<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Autoavaliação de Desempenho · Braskim</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0f172a;--brand:#1a2e8a;--txt:#1e293b;--mut:#64748b;--lin:#e2e8f0;--bg:#f1f5f9;--ok:#059669;--err:#dc2626;
    --n1:#dc2626;--n2:#f59e0b;--n3:#0284c7;--n4:#059669;--na:#64748b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  /* barra superior no padrão do sistema */
  .barra{background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
  .barra .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .barra .b{width:28px;height:28px;border-radius:6px;background:#fff;color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:15px}
  .barra .t{font-weight:700;font-size:17px}.barra .s{color:#94a3b8;font-size:15px}
  /* cabeçalho da pessoa */
  .pess{display:flex;gap:14px;align-items:center}
  .av{width:48px;height:48px;border-radius:50%;background:#e0e7ff;color:var(--brand);font-weight:700;display:grid;place-items:center;flex:none;border:2px solid #c7d2fe}
  .pess h1{text-align:left;font-size:21px;margin:0}
  .chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
  .chip.and{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}.chip.env{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
  /* cards-resumo */
  .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .mini{display:block;border:1px solid var(--lin);border-radius:12px;padding:10px 12px;background:#fff}
  .mini .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .mini .v{font-size:22px;font-weight:700;color:var(--navy);margin-top:2px}
  .mini .s{font-size:12.5px;color:var(--mut)}
  .mini.dest{border:2px solid #c7d2fe;background:#eef2ff}
  /* blocos e critérios no padrão da calibração */
  .bloco{background:#fff;border:1px solid var(--lin);border-radius:16px;margin-bottom:14px;overflow:hidden;scroll-margin-top:150px}
  .bloco .hd{background:#f8fafc;border-bottom:1px solid var(--lin);padding:12px 18px;font-weight:700;color:var(--navy)}
  .bloco .hd span{font-weight:400;color:var(--mut)}
  .linha{padding:16px 18px;border-top:1px solid #f1f5f9}
  .linha:first-of-type{border-top:0}
  .linha .top{display:flex;gap:16px;align-items:flex-start}
  .linha .txt{flex:1;min-width:0}
  .linha .nome{font-weight:600;color:var(--navy);font-size:16px}
  .linha .nome small{color:var(--mut);font-weight:400;font-size:12.5px}
  .linha.falta{background:#fef2f2}
  .linha.falta textarea{border-color:#fca5a5}
  .card{background:#fff;border:1px solid var(--lin);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .logo{height:34px;display:block;margin:6px auto 14px}
  h1{font-size:22px;margin:0 0 6px;color:var(--navy);text-align:center}
  h2{font-size:18px;margin:0 0 4px;color:var(--navy)}
  .mut{color:var(--mut);font-size:14px}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .info div{background:var(--bg);border-radius:10px;padding:10px}
  .info b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
  label.lbl{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
  input.cod{width:100%;font-size:22px;letter-spacing:.2em;text-align:center;text-transform:uppercase;padding:14px;border:2px solid var(--lin);border-radius:12px;font-family:ui-monospace,Menlo,monospace}
  input.cod:focus,textarea:focus{outline:none;border-color:var(--brand)}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sec{background:#fff;color:var(--brand);border:2px solid var(--brand)}
  .btn.ok{background:var(--ok)}
  .msg{border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px}
  .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
  .msg.info{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
  .escala{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--mut)}
  .escala span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--lin);border-radius:999px;padding:3px 10px 3px 3px}
  .dot{font-style:normal;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
  .topo{position:sticky;top:0;z-index:5;background:rgba(241,245,249,.96);backdrop-filter:blur(6px);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid var(--lin)}
  .prog{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:6px 0}
  .prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;border:1px solid var(--lin);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--mut);cursor:pointer}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .crit h3{margin:2px 0 8px;font-size:17px;color:var(--navy)}
  .q{font-size:16px;margin:0 0 8px}
  .ori{font-size:14px;color:var(--mut);margin:0 0 8px}
  .evs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .evs span{font-size:12.5px;background:var(--bg);border-radius:999px;padding:3px 10px;color:#475569}
  .notas{display:flex;gap:6px;flex:none}
  .nota{width:46px;height:46px;border:2px solid var(--lin);border-radius:10px;background:#fff;font-size:16px;font-weight:700;color:#334155;cursor:pointer;font-family:inherit}
  .nota:hover{border-color:#94a3b8}
  @media(max-width:640px){ .linha .top{flex-direction:column;gap:10px} .notas{width:100%;display:grid;grid-template-columns:repeat(5,1fr)} .nota{width:auto;height:50px} }
  .nota.on{color:#fff}
  .rot{font-size:14px;color:#334155;margin:8px 0 0;min-height:21px}

  .aviso{font-size:13px;color:var(--err);margin-top:6px}
  .nav a .pend,.tab .pend{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-left:6px;vertical-align:middle}
  textarea{width:100%;min-height:92px;font:inherit;font-size:16px;border:2px solid var(--lin);border-radius:12px;padding:10px 12px;resize:vertical;margin-top:10px}
  .rod{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--lin);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
  .rod .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .rod .btn{padding:13px;font-size:15px}
  .salvo{font-size:12.5px;color:var(--mut);text-align:center;margin-top:4px}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:var(--bg);border-radius:12px;padding:12px;margin-top:12px}
  .chk input{width:22px;height:22px;margin-top:2px;flex:none}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
  .modal .card{max-width:520px;width:100%;margin:0}
  @media(min-width:640px){.modal{align-items:center}}
  .hide{display:none!important}
  .regua{border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px;border:1px solid var(--lin);background:#f8fafc}
  .regua b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#475569}
  .rg1{background:#fef2f2;border-color:#fecaca}.rg2{background:#fffbeb;border-color:#fde68a}.rg3{background:#f0f9ff;border-color:#bae6fd}.rg4{background:#ecfdf5;border-color:#a7f3d0}
  details.rc{margin-top:8px;font-size:13.5px}details.rc summary{color:var(--brand);cursor:pointer}
  .rcg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px;margin-top:6px}
  .rcg div{border-radius:8px;padding:6px 8px;border:1px solid var(--lin);font-size:13px}
  /* capa de boas-vindas */
  .hero{background:linear-gradient(135deg,#0f172a 0%,#1a2e8a 100%);color:#fff;padding:36px 16px 44px}
  .hero .in{max-width:980px;margin:0 auto}
  .hero .kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a5b4fc;font-weight:600}
  .hero h1{color:#fff;text-align:left;font-size:32px;line-height:1.15;margin:8px 0 10px}
  .hero p{color:#cbd5e1;font-size:17px;max-width:640px;margin:0}
  .hero .msgc{margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;color:#e2e8f0;font-size:15.5px;max-width:680px;white-space:pre-line}
  .sobe{margin-top:-24px}
  .fatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .fato{background:#fff;border:1px solid var(--lin);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
  .fato svg{flex:none;color:var(--brand);background:#eef2ff;border-radius:10px;padding:8px;width:40px;height:40px}
  .fato b{display:block;color:var(--navy);font-size:15px}.fato span{font-size:13.5px;color:var(--mut)}
  .sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0 0 10px}
  .blocos-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .bc{border:1px solid var(--lin);border-radius:12px;padding:12px 14px;background:#fff}
  .bc b{color:var(--navy)}.bc small{color:var(--mut);display:block;font-size:13.5px;margin-top:2px}
  .passos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;counter-reset:p}
  .passo{position:relative;text-align:center;font-size:13.5px;color:var(--mut);padding-top:40px}
  .passo::before{counter-increment:p;content:counter(p);position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:#e2e8f0;color:#475569;font-weight:700;display:grid;place-items:center}
  .passo.voce::before{background:var(--brand);color:#fff;box-shadow:0 0 0 4px #c7d2fe}
  .passo.voce{color:var(--navy);font-weight:700}
  .passo .tag{display:block;font-size:11px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  @media(max-width:640px){ .passos{grid-template-columns:1fr;gap:10px} .passo{text-align:left;padding:4px 0 4px 44px;min-height:32px} .passo::before{left:0;transform:none;top:0} .hero h1{font-size:27px} }
  .dicas{margin:0;padding-left:20px}.dicas li{margin:4px 0}
  .cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(241,245,249,0));padding:18px 0 calc(14px + env(safe-area-inset-bottom))}
</style>
</head>

<div id="app"><div class="wrap"><div class="card" style="text-align:center"><p class="mut">Carregando…</p></div></div></div>

async function iniciar(){
  const token=(location.hash.match(/[#&]t=([A-Za-z0-9_-]{20,})/)||[])[1];
  // tira o token da barra de endereço e do histórico (não fica em prints/compartilhamentos)
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if(!token) return erroGeral(MSG_INDISP);
  sessionStorage.setItem("bsk_auto_t",token);
  try{
    // app Firebase com NOME PRÓPRIO: o login anônimo fica isolado e nunca substitui o login do Google
    // de quem usa o sistema no mesmo navegador. Sessão só nesta aba (some ao fechar).
    const fb=firebase.initializeApp(CFG,"autoavaliacao");
    const au=fb.auth();
    try{ await au.setPersistence(firebase.auth.Auth.Persistence.SESSION); }catch(e){}
    await au.signInAnonymously();
    db=fb.firestore();
  }catch(e){ console.error(e); return erroGeral("Não foi possível conectar. Verifique sua internet e tente novamente."); }
  window.__token=token;
  const capaId=await sha256("capa:"+token);
  capaRef=db.collection("aval_links").doc(capaId);
  try{ const d=await capaRef.get(); if(!d.exists||d.data().revogado) return erroGeral(MSG_INDISP); capa=d.data(); }
  catch(e){ console.error(e); return erroGeral(MSG_INDISP); }
  telaBoasVindas();
}

      <div class="fato">${ICO.cal}<div><b>Prazo: ${exp?exp.toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"}):"—"}</b><span>até as 23:59${expirado?" · encerrado":""}</span></div></div>
      <div class="fato">${ICO.salvar}<div><b>Salve e continue depois</b><span>Suas respostas ficam guardadas até o prazo</span></div></div>
      <div class="fato">${ICO.cadeado}<div><b>Acesso pessoal</b><span>Link e código são só seus. Não compartilhe.</span></div></div>
    </div>
    <div style="height:14px"></div>
    <div class="card"><p class="sec">Por que fazemos</p>
      <p style="margin:0 0 8px">A avaliação de desempenho é a conversa anual sobre o seu trabalho: reconhecer o que foi bem, alinhar expectativas e definir onde investir no seu desenvolvimento.</p>
      <p style="margin:0"><b>Sua autoavaliação não define a sua nota.</b> Ela é a sua visão, que o seu gestor vai considerar na conversa de desempenho.</p></div>
    ${blocosC?`<div class="card"><p class="sec">O que você vai avaliar</p><div class="blocos-c">${blocosC}</div>
      <p class="mut" style="margin:10px 0 0">No final, 4 perguntas abertas sobre suas entregas, sua evolução e o apoio de que precisa.</p></div>`:""}
    <div class="card"><p class="sec">Como funciona o processo</p>
      <div class="passos">
        <div class="passo voce"><span class="tag">Você está aqui</span>Autoavaliação</div>
        <div class="passo">Avaliação do gestor</div>
        <div class="passo">Calibração com o RH</div>
        <div class="passo">Conversa de feedback</div>
        <div class="passo">Plano de desenvolvimento</div>
      </div></div>
    <div class="card"><p class="sec">A escala</p>
      <div style="display:grid;gap:10px">${escala.map(([v,r])=>`<div style="display:flex;gap:10px;align-items:flex-start"><i class="dot" style="background:${COR[v]};width:28px;height:28px;font-size:12px;flex:none">${v==="NA"?"N/A":v}</i><span><b>${r}</b>${(capa.reguaGeral||{})[v]?`<br><span class="mut">${esc(capa.reguaGeral[v])}</span>`:""}</span></div>`).join("")}</div>
      <p class="mut" style="margin:10px 0 0">Em cada critério, você verá também o que cada nota significa naquele ponto específico.</p></div>
    <div class="card"><p class="sec">Para uma boa autoavaliação</p>
      <ul class="dicas">
        <li>Pense em <b>fatos e situações concretas</b> do período, não em impressões gerais.</li>
        <li>Toda nota pede uma <b>justificativa</b>: conte o que aconteceu, o que você fez e qual foi o resultado.</li>
        <li>Seja honesto nos dois sentidos: reconheça o que foi bem e o que pode melhorar.</li>
        <li>Use <b>N/A</b> apenas quando não teve como ser avaliado naquele ponto no período.</li>
      </ul></div>
    <div class="cta">${expirado?`<div class="msg err">O prazo desta autoavaliação terminou em ${fmtDH(exp)}. Procure o RH.</div>`
      :`<button class="btn" id="comecar" style="font-size:17px;padding:17px">Começar minha autoavaliação</button>`}</div>
  </div>`;
  const b=document.getElementById("comecar"); if(b) b.onclick=()=>{ telaCodigo(); window.scrollTo(0,0); };
}
const chaveBloq=()=>"bsk_auto_b_"+String(window.__token||"").slice(0,16); // bloqueio vale só para este link
function bloqueio(){ try{ localStorage.removeItem("bsk_auto_b"); const b=JSON.parse(localStorage.getItem(chaveBloq())||"{}"); return b; }catch(e){ return {}; } }
function telaCodigo(msg){
  const exp=ts(capa.expiraEm), expirado=exp&&new Date()>exp;
  app.innerHTML=`${barra()}<div class="wrap" style="max-width:560px"><div class="card"><img class="logo" src="${LOGO}" alt="Braskim"><h1>Autoavaliação de Desempenho</h1>
    <div class="info"><div><b>Colaborador</b>${esc(capa.nome)}</div><div><b>Cargo</b>${esc(capa.cargo)}</div>
    <div><b>Período avaliado</b>${fmtD(capa.periodo&&capa.periodo.inicio)} a ${fmtD(capa.periodo&&capa.periodo.fim)}</div><div><b>Prazo para conclusão</b>${fmtDH(exp)}</div></div>
    ${expirado?`<div class="msg err">O prazo desta autoavaliação expirou em ${fmtDH(exp)}. Procure o RH.</div>`:""}
    <label class="lbl" for="cod">Código de acesso</label>
    <input id="cod" class="cod" autocomplete="one-time-code" autocapitalize="characters" inputmode="text" maxlength="9" placeholder="XXXX-XXXX">
    <div style="height:12px"></div><button id="entrar" class="btn">Acessar minha avaliação</button>
    <div id="m">${msg?`<div class="msg err">${msg}</div>`:""}</div>
    <p class="mut" style="margin-top:14px">O link e o código são pessoais. Não compartilhe.</p>
    <p style="margin:8px 0 0;text-align:center"><a href="#" id="voltarCapa" style="color:var(--brand);font-size:14px">← Voltar à apresentação</a></p></div></div>`;
  const inp=document.getElementById("cod"), b=document.getElementById("entrar");
  inp.addEventListener("input",()=>{ let v=normCod(inp.value).slice(0,8); inp.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v; });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") b.click(); });
  b.onclick=()=>validar(inp.value);
  const vc=document.getElementById("voltarCapa"); if(vc) vc.onclick=e=>{ e.preventDefault(); telaBoasVindas(); window.scrollTo(0,0); };
}
async function validar(cod){
  const bl=bloqueio(), agora=Date.now();
  if(bl.ate&&agora<bl.ate){ const min=Math.ceil((bl.ate-agora)/60000); return telaCodigo(`Muitas tentativas incorretas. Tente novamente em ${min} minuto(s).`); }
  const c=normCod(cod); if(c.length!==8) return telaCodigo("Informe o código de 8 caracteres.");
  const id=await sha256("acesso:"+window.__token+":"+c);
  contRef=db.collection("aval_acessos").doc(id);
  let d=null; try{ d=await contRef.get(); }catch(e){ d=null; }
  if(!d||!d.exists||d.data().revogado){
    const n=(bl.n||0)+1; localStorage.setItem(chaveBloq(),JSON.stringify(n>=MAX_TENT?{n:0,ate:agora+BLOQ_MIN*60000}:{n,ate:0}));
    capaRef.collection("tentativas").add({em:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
    return telaCodigo(n>=MAX_TENT?`Muitas tentativas incorretas. Tente novamente em ${BLOQ_MIN} minutos.`:"Código inválido ou acesso indisponível. Confira o código ou procure o RH.");
  }
  localStorage.removeItem(chaveBloq());
  dados=d.data(); respostas=JSON.parse(JSON.stringify(dados.respostas||{})); fechamento=JSON.parse(JSON.stringify(dados.fechamento||{}));
  declaracao=false; ultimoSalvo=ts(dados.salvoEm);
  evento("acesso");
  const exp=ts(dados.expiraEm);
  if(dados.estado==="enviada") return telaEnviada();
  if(exp&&new Date()>exp){ somenteLeitura=true; return telaExpirada(); }
  if(!["liberada","em_andamento"].includes(dados.estado)) return erroGeral(MSG_INDISP);
  telaForm(); window.scrollTo(0,0);
}
function evento(acao){ if(!contRef) return; contRef.collection("eventos").add({acao,em:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}); }
function cab(){ return `<img class="logo" src="${LOGO}" alt="Braskim">`; }
function barra(){ return `<div class="barra"><div class="in"><span class="b">B</span><span class="t">Braskim</span><span class="s">· Autoavaliação de Desempenho</span></div></div>`; }
const iniciais=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function telaIntro(){
  const n=Object.values(respostas).filter(r=>r&&r.nota!=null).length;
  app.innerHTML=`${barra()}<div class="wrap"><div class="card"><h1 style="text-align:left">Olá, ${esc(String(dados.nome||"").split(" ")[0])}!</h1>
    <p>Esta autoavaliação é um espaço para refletir sobre seu desempenho durante o período, considerando suas entregas, forma de atuação e, quando aplicável, liderança.</p>
    <p>Avalie sua atuação com base em fatos e situações concretas.</p>
    <p>Você pode salvar suas respostas e continuar posteriormente até o prazo indicado.</p>
    <p><b>Sua autoavaliação não define sua nota final.</b> Ela será considerada pelo seu gestor como parte da conversa de desempenho.</p>
    <div class="msg info">Prazo para envio: <b>${fmtDH(dados.expiraEm)}</b>${n?`<br>Você já respondeu ${n} de ${total()} critérios. Vamos continuar de onde parou.`:""}</div>
    <div style="height:14px"></div><button class="btn" id="ir">${n?"Continuar minha autoavaliação":"Começar"}</button></div></div>`;
  document.getElementById("ir").onclick=()=>{ telaForm(); window.scrollTo(0,0); };
}
const blocos=()=>dados.blocos||[];
const total=()=>blocos().reduce((n,b)=>n+b.criterios.length,0);
const respondidos=()=>blocos().reduce((n,b)=>n+b.criterios.filter(c=>respostas[c.id]&&respostas[c.id].nota!=null).length,0);
const exigeJust=()=>dados.justificativaObrigatoria!==false;
const semJust=c=>{ const r=respostas[c.id]; return !!(r&&r.nota!=null&&exigeJust()&&!String(r.comentario||"").trim()); };
const pendencias=()=>{ const sn=[],sj=[]; blocos().forEach(b=>b.criterios.forEach(c=>{ const r=respostas[c.id];
  if(!(r&&r.nota!=null)) sn.push({b,c}); else if(semJust(c)) sj.push({b,c}); })); return {sn,sj}; };
const primeiraAbaPendente=()=>{ const i=blocos().findIndex(b=>b.criterios.some(c=>!(respostas[c.id]&&respostas[c.id].nota!=null))); return i<0?blocos().length:i; };
function escalaHTML(){ return `<div class="escala">${(dados.escala||[]).map(e=>`<span><i class="dot" style="background:${COR[e.v]}">${e.v==="NA"?"N/A":e.v}</i>${esc(e.rot)}</span>`).join("")}</div>`; }
function telaForm(){
  const pct=Math.round(respondidos()*100/Math.max(1,total()));
  const enviada=dados.estado==="enviada";
  const linha=(b,c)=>{ const r=respostas[c.id]||{}; const rot=(dados.escala||[]).find(e=>e.v===r.nota); const f=semJust(c);
    return `<div class="linha crit${f?" falta":""}" data-id="${c.id}">
      <div class="top"><div class="txt"><div class="nome">${esc(c.nome)}</div>
        <p class="q" style="margin:4px 0 6px">${esc(c.pergunta)}</p>${c.orientacao?`<p class="ori">${fmtRico(c.orientacao)}</p>`:""}
        ${(c.evidencias||[]).length?`<div class="evs">${c.evidencias.map(e=>`<span>${esc(e)}</span>`).join("")}</div>`:""}</div>
        <div class="notas">${[1,2,3,4,"NA"].map(v=>`<button type="button" class="nota${r.nota===v?" on":""}" data-v="${v}" ${somenteLeitura?"disabled":""} style="${r.nota===v?`background:${COR[v]};border-color:${COR[v]}`:""}" title="${esc(((dados.escala||[]).find(e=>e.v===v)||{}).rot||"")}">${v==="NA"?"N/A":v}</button>`).join("")}</div></div>
      <p class="rot" style="margin-top:6px">${rot?`<b style="color:${COR[r.nota]}">${esc(rot.rot)}</b>`:"&nbsp;"}</p>
      ${r.nota!=null?`<div class="regua ${r.nota!=="NA"?"rg"+r.nota:""}"><b>${r.nota==="NA"?"N/A":"Nota "+r.nota}${r.nota!=="NA"&&c.regua&&String(c.regua[r.nota]||"").trim()?" neste critério":""}:</b> ${esc(textoRegua(c,r.nota))}</div>`:""}
      <details class="rc"><summary>Ver o que significa cada nota neste critério</summary>${reguaCompletaHTML(c)}</details>
      <textarea placeholder="${exigeJust()?"Justifique sua nota com fatos, entregas e situações concretas (obrigatório)":"Fatos, entregas e situações que exemplificam sua resposta (recomendado)"}" ${somenteLeitura?"disabled":""}>${esc(r.comentario||"")}</textarea>
      <div class="aviso${f?"":" hide"}">Escreva a justificativa da sua nota.</div></div>`; };
  const resumo=blocos().map(b=>{ const n=b.criterios.filter(c=>respostas[c.id]&&respostas[c.id].nota!=null).length; const pj=b.criterios.some(semJust);
    return `<a href="#b_${b.id}" class="mini" style="text-decoration:none"><div class="t">${esc(b.nome)}</div><div class="v">${n}/${b.criterios.length}</div><div class="s">${pj?'<span style="color:var(--err)">justificativa pendente</span>':n===b.criterios.length?"completo":"respondidos"}</div></a>`; }).join("");
  const fech=`<div class="bloco" id="b_fechamento"><div class="hd">Fechamento <span>· para encerrar, responda às perguntas</span></div><div class="linha">
      ${(dados.perguntasFechamento||[]).map(q=>`<label class="lbl" style="color:var(--txt);font-size:15px;margin-top:4px">${esc(q.txt)}</label><textarea data-f="${q.id}" ${somenteLeitura?"disabled":""}>${esc(fechamento[q.id]||"")}</textarea>`).join("")}
      ${somenteLeitura?"":`<label class="chk"><input type="checkbox" id="decl" ${declaracao?"checked":""}><span>${esc(dados.declaracao||"Declaro que revisei minhas respostas e desejo enviar minha autoavaliação.")}</span></label>
      <div id="pendbox">${pendBox()}</div>
      <div style="height:12px"></div><button class="btn ok" id="enviar" ${declaracao&&!pendencias().sn.length&&!pendencias().sj.length?"":"disabled"}>ENVIAR AUTOAVALIAÇÃO</button>`}</div></div>`;
  app.innerHTML=`${barra()}<div class="wrap">
    <div class="card"><div class="pess"><div class="av">${esc(iniciais(dados.nome))}</div><div style="min-width:0">
      <h1>Autoavaliação · ${esc(dados.nome)}<span class="chip ${enviada?"env":"and"}">${enviada?"Enviada":"Em andamento"}</span></h1>
      <div class="mut">${esc(dados.cargo)} · período ${fmtD(dados.periodo&&dados.periodo.inicio)} a ${fmtD(dados.periodo&&dados.periodo.fim)} · prazo ${fmtDH(dados.expiraEm)}</div></div></div></div>
    <div class="card"><div class="res">${resumo}
      <div class="mini dest"><div class="t">Progresso</div><div class="v">${pct}%</div><div class="s">${respondidos()} de ${total()} critérios</div></div></div>
      <div class="prog" style="margin-top:12px"><i style="width:${pct}%"></i></div>
      <div style="margin-top:10px">${escalaHTML()}</div></div>
    ${blocos().map(b=>`<div class="bloco" id="b_${b.id}"><div class="hd">${esc(b.nome)} <span>· ${b.criterios.length} critério(s)</span></div>${b.criterios.map(c=>linha(b,c)).join("")}</div>`).join("")}
    ${fech}</div>
    <div class="rod"><div class="in">${somenteLeitura?"":`<button class="btn sec" id="sair" style="flex:1">Salvar e sair</button>`}<a href="#b_fechamento" class="btn" style="flex:1;text-align:center;text-decoration:none">${somenteLeitura?"Ver fechamento":"Ir para o envio"}</a></div><div class="salvo" id="salvo">${txtSalvo()}</div></div>`;
  app.querySelectorAll(".crit").forEach(el=>{ const id=el.dataset.id;
    el.querySelectorAll(".nota").forEach(bt=>bt.onclick=()=>{ const v=bt.dataset.v==="NA"?"NA":+bt.dataset.v; const atual=respostas[id]&&respostas[id].nota;
      respostas[id]={...(respostas[id]||{}),nota:atual===v?null:v}; marcar(); telaFormManterRolagem(); });
    el.querySelector("textarea").addEventListener("input",e=>{ respostas[id]={...(respostas[id]||{}),comentario:e.target.value}; marcar();
      const f=semJust({id}); el.classList.toggle("falta",f); el.querySelector(".aviso").classList.toggle("hide",!f); atualizarPend(); }); });
  app.querySelectorAll("textarea[data-f]").forEach(t=>t.addEventListener("input",e=>{ fechamento[t.dataset.f]=e.target.value; marcar(); }));
  const dc=document.getElementById("decl"); if(dc) dc.onchange=()=>{ declaracao=dc.checked; atualizarPend(); };
  const env=document.getElementById("enviar"); if(env) env.onclick=confirmarEnvio;
  const sair=document.getElementById("sair"); if(sair) sair.onclick=async()=>{ await salvar(); telaSaiu(); };
}
function pendBox(){ const p=pendencias(); if(!p.sn.length&&!p.sj.length) return `<div class="msg ok">Todos os critérios foram respondidos e justificados.</div>`;
  const lista=[...p.sn.map(x=>`${esc(x.c.nome)} — sem nota`),...p.sj.map(x=>`${esc(x.c.nome)} — sem justificativa`)];
  return `<div class="msg err"><b>Antes de enviar, complete:</b><br>${lista.slice(0,8).join("<br>")}${lista.length>8?`<br>e mais ${lista.length-8}.`:""}</div>`; }
function atualizarPend(){ const pb=document.getElementById("pendbox"); if(pb) pb.innerHTML=pendBox(); const p=pendencias(); const env=document.getElementById("enviar");
  if(env) env.disabled=!declaracao||p.sn.length>0||p.sj.length>0; }
function telaFormManterRolagem(){ const y=window.scrollY; telaForm(); window.scrollTo(0,y); }
async function irAba(){ if(sujo) await salvar(); telaForm(); window.scrollTo(0,0); }
function marcar(){ if(somenteLeitura) return; sujo=true; atualizarSalvo(); clearTimeout(timer); timer=setTimeout(salvar,3000); }
function txtSalvo(){ if(somenteLeitura) return "Somente leitura"; if(salvando) return "Salvando…"; if(sujo) return "Alterações não salvas"; return ultimoSalvo?`Alterações salvas · ${fmtDH(ultimoSalvo)}`:"Nenhuma resposta salva ainda"; }
function atualizarSalvo(){ const el=document.getElementById("salvo"); if(el) el.textContent=txtSalvo(); }
async function salvar(){
  if(!sujo||somenteLeitura||!contRef) return true; clearTimeout(timer); salvando=true; atualizarSalvo();
  try{ await contRef.update({respostas,fechamento,estado:"em_andamento",salvoEm:firebase.firestore.FieldValue.serverTimestamp()});
    sujo=false; ultimoSalvo=new Date(); if(dados.estado!=="em_andamento"){ dados.estado="em_andamento"; evento("salvamento"); }
    salvando=false; atualizarSalvo(); return true; }
  catch(e){ console.error(e); salvando=false;
    const exp=ts(dados.expiraEm); if(exp&&new Date()>exp){ somenteLeitura=true; telaExpirada(); return false; }
    const el=document.getElementById("salvo"); if(el) el.innerHTML=`<span style="color:var(--err)">Não foi possível salvar. Verifique a internet — tentaremos de novo.</span>`;
    timer=setTimeout(salvar,8000); return false; }
}
window.addEventListener("beforeunload",e=>{ if(sujo&&!somenteLeitura){ salvar(); e.preventDefault(); e.returnValue=""; } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&sujo) salvar(); });
setInterval(()=>{ if(sujo&&!salvando) salvar(); },30000);
function confirmarEnvio(){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card"><h2>Tem certeza de que deseja enviar sua autoavaliação?</h2>
    <p>Após o envio, suas respostas serão consideradas finalizadas e não poderão ser alteradas, salvo reabertura autorizada pelo RH.</p>
    <div style="display:grid;gap:10px;margin-top:14px"><button class="btn ok" id="sim">Enviar autoavaliação</button><button class="btn sec" id="nao">Voltar e revisar</button></div>
    <div id="me"></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#nao").onclick=()=>m.remove();
  m.querySelector("#sim").onclick=async()=>{ const b=m.querySelector("#sim"); b.disabled=true; b.textContent="Enviando…";
    try{ const FV=firebase.firestore.FieldValue;
      await contRef.update({respostas,fechamento,declaracaoMarcada:true,estado:"enviada",enviadoEm:FV.serverTimestamp(),salvoEm:FV.serverTimestamp()});
      evento("envio"); sujo=false; m.remove(); const d=await contRef.get(); dados=d.data(); telaEnviada(); }
    catch(e){ console.error(e); b.disabled=false; b.textContent="Enviar autoavaliação";
      const exp=ts(dados.expiraEm); m.querySelector("#me").innerHTML=`<div class="msg err">${exp&&new Date()>exp?"O prazo expirou. Procure o RH.":"Não foi possível enviar agora. Verifique sua internet e tente novamente."}</div>`; } };
}
function telaEnviada(){
  somenteLeitura=true;
  app.innerHTML=`${barra()}<div class="wrap"><div class="card" style="text-align:center"><h1>Autoavaliação enviada com sucesso.</h1>
    <p>Suas respostas foram registradas e serão consideradas no processo de avaliação de desempenho.</p>
    <p>A próxima etapa será conduzida pelo seu gestor.</p>
    <div class="msg ok">Enviada em ${fmtDH(dados.enviadoEm)}</div>
    <div style="height:14px"></div><button class="btn sec" id="ver">Ver minhas respostas</button></div></div>`;
  document.getElementById("ver").onclick=()=>{ telaForm(); window.scrollTo(0,0); };
}
function telaExpirada(){
  const n=respondidos();
  app.innerHTML=`${barra()}<div class="wrap"><div class="card" style="text-align:center"><h1>Prazo encerrado</h1>
    <div class="msg err">Este acesso expirou em ${fmtDH(dados.expiraEm)}. Não é mais possível editar ou enviar.</div>
    <p>${n?`Suas ${n} resposta(s) salva(s) foram preservadas. `:""}Procure o RH se precisar de um novo prazo.</p>
    ${n?`<button class="btn sec" id="ver">Ver minhas respostas</button>`:""}</div></div>`;
  const v=document.getElementById("ver"); if(v) v.onclick=()=>{ telaForm(); window.scrollTo(0,0); };
}
function telaSaiu(){
  app.innerHTML=`${barra()}<div class="wrap"><div class="card" style="text-align:center"><h1>Respostas salvas</h1>
    <p>Você pode continuar até <b>${fmtDH(dados.expiraEm)}</b> usando o mesmo link e código.</p>
    <div class="msg ok">${respondidos()} de ${total()} critérios respondidos.</div>
    <div style="height:14px"></div><button class="btn sec" id="voltar">Continuar agora</button></div></div>`;
  document.getElementById("voltar").onclick=()=>telaForm();
}
// ao recarregar a página, o token some da URL: recupera da sessão
if(!/[#&]t=/.test(location.hash)){ const t=sessionStorage.getItem("bsk_auto_t"); if(t) try{ history.replaceState(null,"",location.pathname+"#t="+t); }catch(e){} }
iniciar();
})();
</script>
