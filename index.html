      {card("Técnicas",nTec,"Hard skills · conhecimentos e habilidades")}
      {card("Perguntas neste dicionário",nCore,"Reutilizáveis em avaliação e entrevista")}
      {card("Cadastros incompletos",nIncompletas,"Faltam níveis, comportamentos ou perguntas",nIncompletas?"text-amber-500":"text-navy")}
    </div>

    <div className="flex gap-0.5 border-b border-slate-200">
      {[["comportamental","Comportamentais (soft skills)"],["tecnica","Técnicas (hard skills)"],["matriz","Matriz por cargo"]].map(([k,l])=>(
        <button key={k} onClick={()=>{setGrupoF("");setGerGrupos(false);k==="matriz"?setAba("matriz"):(setAba("dic"),setTipo(k));}} className={"px-4 py-2 text-sm font-medium border-b-2 "+((k==="matriz"?aba==="matriz":aba==="dic"&&tipo===k)?"border-brand text-brand":"border-transparent text-slate-400 hover:text-slate-600")}>{l}</button>))}
    </div>

    {(competencias||[]).length===0&&bkp.length>0&&isRH&&<div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start justify-between gap-4">
      <div>
        <div className="text-sm font-semibold text-amber-800">Encontramos uma cópia local com {bkp.length} competência(s)</div>
        <p className="text-[12px] text-amber-700 mt-0.5">O dicionário está vazio, mas este navegador guarda uma cópia de segurança da última lista salva. Você pode restaurá-la.</p>
      </div>
      <button onClick={restaurarBkp} className="shrink-0 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium px-4 py-2 rounded-md">Restaurar</button>
    </div>}

    {aba==="matriz" ? <MatrizCompetencias competencias={competencias||[]} cargos={cargos||[]} notify={notify}/> : <>
    <div className="flex items-center gap-3 flex-wrap">
      <div className="flex-1 min-w-[260px] flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 shadow-sm">
        <span className="text-slate-400"><IcSearch size={16}/></span>
        <input value={q} onChange={e=>setQ(e.target.value)} className="flex-1 text-sm outline-none bg-transparent text-slate-700 placeholder-slate-400" placeholder="Buscar por competência, grupo ou definição…"/>
      </div>
      <label className="flex items-center gap-2 text-sm text-slate-500 whitespace-nowrap px-1 cursor-pointer select-none"><input type="checkbox" checked={mostrarInativas} onChange={e=>setMostrarInativas(e.target.checked)} className="accent-brand"/>Mostrar inativas</label>
    </div>

    {gruposDoTipo.length>0&&<div className="flex items-center gap-1.5 flex-wrap">
      <span className="text-[11px] uppercase tracking-wide text-slate-400 mr-1">Grupo:</span>
      <button onClick={()=>setGrupoF("")} className={"text-xs px-2.5 py-1 rounded-full border transition-colors "+(grupoF===""?"bg-brand text-white border-brand":"border-slate-300 text-slate-600 hover:bg-slate-50")}>Todos ({doTipo.length})</button>
      {gruposDoTipo.map(g=>{const n=doTipo.filter(c=>c.grupo===g).length;return (
        <button key={g} onClick={()=>setGrupoF(grupoF===g?"":g)} className={"text-xs px-2.5 py-1 rounded-full border transition-colors "+(grupoF===g?"bg-brand text-white border-brand":"border-slate-300 text-slate-600 hover:bg-slate-50")}>{g} ({n})</button>);})}
      {doTipo.some(c=>!c.grupo)&&<button onClick={()=>setGrupoF(grupoF==="__sem"?"":"__sem")} className={"text-xs px-2.5 py-1 rounded-full border transition-colors "+(grupoF==="__sem"?"bg-brand text-white border-brand":"border-slate-300 text-slate-400 hover:bg-slate-50")}>Sem grupo ({doTipo.filter(c=>!c.grupo).length})</button>}
      {isRH&&<button onClick={abrirGerGrupos} className={"text-xs px-2.5 py-1 rounded-full border ml-1 transition-colors "+(gerGrupos?"bg-slate-700 text-white border-slate-700":"border-slate-300 text-slate-500 hover:bg-slate-50")} title="Renomear, mesclar ou remover grupos">
        {gerGrupos?"Fechar edição":"Editar grupos"}</button>}
    </div>}

    {gerGrupos&&isRH&&<div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-2">
      <div><div className="text-sm font-semibold text-navy">Editar grupos · {rotuloDic}</div>
        <p className="text-[11px] text-slate-400">Renomear altera o grupo em todas as competências deste dicionário. Se o novo nome já existir, os dois grupos são <b>mesclados</b>.</p></div>
      {gruposDoTipo.length===0
        ? <p className="text-[11px] text-slate-400">Nenhum grupo cadastrado neste dicionário ainda.</p>
        : <div className="space-y-1.5">{gruposDoTipo.map(g=>{
            const qtd=doTipo.filter(c=>(c.grupo||"")===g).length;
            const alterado=String(nomesEdit[g]??g).trim()!==g&&String(nomesEdit[g]??"").trim()!=="";
            return <div key={g} className="flex items-center gap-2">
              <input value={nomesEdit[g]??g} onChange={e=>setNomesEdit(m=>({...m,[g]:e.target.value}))}
                onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();renomearGrupo(g);}}}
                className="flex-1 text-sm border border-slate-300 rounded-md px-2.5 py-1.5 outline-none focus:ring-2 ring-brand/30"/>
              <span className="text-[11px] text-slate-400 w-20 shrink-0">{qtd} compet.</span>
              <button onClick={()=>renomearGrupo(g)} disabled={!alterado}
                className={"text-xs px-3 py-1.5 rounded-md shrink-0 "+(alterado?"bg-brand text-white hover:bg-navy":"bg-slate-100 text-slate-400 cursor-not-allowed")}>Salvar</button>
              <IconBtn title="Remover grupo (as competências ficam sem grupo)" onClick={()=>removerGrupo(g)}><IcTrash/></IconBtn>
            </div>;})}</div>}
    </div>}

    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table className="w-full text-sm min-w-[1040px]">
        <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
          <SortTh label="ID" col="codigo" sort={sortComp} onSort={toggleSortComp} className="px-4"/>
          <SortTh label="Competência" col="nome" sort={sortComp} onSort={toggleSortComp}/>
          <SortTh label="Grupo" col="grupo" sort={sortComp} onSort={toggleSortComp}/>
          <SortTh label="Aplicabilidade" col="aplicabilidade" sort={sortComp} onSort={toggleSortComp}/>
          <SortTh label="Detalhamento" col="detalhe" sort={sortComp} onSort={toggleSortComp} align="center"/>
          <SortTh label="Níveis" col="niveis" sort={sortComp} onSort={toggleSortComp} align="center"/>
          <SortTh label="Perguntas" col="perguntas" sort={sortComp} onSort={toggleSortComp} align="center"/>
          <SortTh label="Status" col="status" sort={sortComp} onSort={toggleSortComp} align="center"/>
          <th className="text-center font-semibold px-4 py-2.5">Ações</th></tr></thead>
        <tbody>
          {filtrada.map(c=>{const np=nPerguntas(c);const nd=LISTAS_COMP.reduce((s,[k])=>s+((c[k]||[]).length),0);
            const nn=NIVEIS_EXIG.filter(([k])=>String(c.niveis?.[k]||"").trim()).length;return (
            <tr key={c.id} className="border-t border-slate-100 hover:bg-slate-50">
              <td className="px-4 py-2.5 font-mono text-xs text-slate-500">{c.codigo||"—"}</td>
              <td className="px-3 py-2.5"><button onClick={()=>setVer(c)} className="font-medium text-navy hover:text-brand text-left">{c.nome}</button>
                {c.conceito&&<div className="text-[11px] text-slate-400 line-clamp-1 max-w-sm">{c.conceito}</div>}</td>
              <td className="px-3 py-2.5 text-slate-600">{c.grupo||"—"}</td>
              <td className="px-3 py-2.5">{c.aplicabilidade
                ?<span className={"text-[11px] px-2 py-0.5 rounded-full font-medium "+({"Essencial":"bg-sky-50 text-sky-700","Liderança":"bg-violet-50 text-violet-700","Específica":"bg-amber-50 text-amber-700"}[c.aplicabilidade]||"bg-slate-100 text-slate-600")}>{c.aplicabilidade}</span>
                :<span className="text-slate-300">—</span>}</td>
              <td className="px-3 py-2.5 text-center"><span className={"text-xs font-semibold "+(nd?"text-navy":"text-amber-500")}>{nd}</span></td>
              <td className="px-3 py-2.5 text-center"><span className={"text-xs font-semibold "+(nn===NIVEIS_EXIG.length?"text-emerald-600":nn?"text-amber-500":"text-slate-300")}>{nn}/{NIVEIS_EXIG.length}</span></td>
              <td className="px-3 py-2.5 text-center"><span className={"text-xs font-semibold "+(np?"text-navy":"text-amber-500")}>{np}</span></td>
              <td className="px-3 py-2.5 text-center">{c.status==="INATIVA"
                ? <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">Inativa</span>
                : <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600">Ativa</span>}</td>
              <td className="px-4 py-2.5"><div className="flex items-center justify-center gap-1.5">
                <IconBtn title="Ver" onClick={()=>setVer(c)}><IcEye/></IconBtn>
                <IconBtn title="Editar" tint="text-brand" onClick={()=>isRH&&setEdit(c)} disabled={!isRH}><IcEdit/></IconBtn>
                <IconBtn title={c.status!=="INATIVA"?"Inativar":"Ativar"} onClick={()=>isRH&&alternar(c)} disabled={!isRH}><IcPower/></IconBtn>
                <IconBtn title="Exportar PDF" onClick={()=>exportarCompPDF(c,cargos||[],notify)}><IcFile/></IconBtn>
                <IconBtn title="Exportar Word" filled onClick={()=>exportarCompWord(c,cargos||[])}><IcDownload/></IconBtn>
                <IconBtn title="Excluir" onClick={()=>isRH&&excluir(c)} disabled={!isRH}><IcTrash/></IconBtn>
              </div></td>
            </tr>);})}
          {filtrada.length===0&&<tr><td colSpan="9" className="px-4 py-12 text-center text-slate-400">
            {doTipo.length===0?<>Nenhuma competência {tipo==="tecnica"?"técnica":"comportamental"} cadastrada ainda.{isRH&&<> Clique em <b>+ Nova competência</b> para começar.</>}</>:"Nenhuma competência encontrada com esse filtro."}
          </td></tr>}
        </tbody>
      </table>
    </div>
    </>}

    {ver&&<div className="fixed inset-0 z-50 grid place-items-center bg-navy/40 p-4" onClick={()=>setVer(null)}>
      <div className="bg-white rounded-lg shadow-2xl w-full max-w-2xl max-h-[88vh] overflow-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-4 border-b border-slate-200 flex items-start justify-between">
          <div><h2 className="text-lg font-bold text-navy">{ver.nome}</h2>
            <p className="text-sm text-slate-500">{ver.codigo?`${ver.codigo} · `:""}{ver.grupo||"Sem grupo"} · {ver.tipo==="tecnica"?"Técnica (hard skill)":"Comportamental (soft skill)"}</p></div>
          <div className="flex items-center gap-1.5 shrink-0">
            <button onClick={()=>exportarCompPDF(ver,cargos||[],notify)} className="text-xs px-2.5 py-1.5 border border-slate-300 rounded-md text-slate-600 hover:bg-slate-50">PDF</button>
            <button onClick={()=>exportarCompWord(ver,cargos||[])} className="text-xs px-2.5 py-1.5 border border-slate-300 rounded-md text-slate-600 hover:bg-slate-50">Word</button>
            <button onClick={()=>setVer(null)} className="text-slate-400 hover:text-slate-600 text-xl ml-1">✕</button>
          </div></div>
        <div className="p-4 space-y-4">
          {ver.aplicabilidade&&<div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Aplicabilidade</div>
            <p className="text-sm text-slate-700">{ver.aplicabilidade}</p></div>}
          {ver.conceito&&<div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Conceito</div>
            <p className="text-sm text-slate-700 text-justify">{ver.conceito}</p></div>}
          {LISTAS_COMP.map(([k,titulo])=>{const arr=(ver[k]||[]).filter(Boolean);if(!arr.length)return null;return (
            <div key={k}><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">{titulo}</div>
              <ol className="list-decimal pl-5 space-y-1">{arr.map((p,i)=><li key={i} className="text-sm text-slate-700 text-justify">{p}</li>)}</ol></div>);})}
          {NIVEIS_EXIG.some(([k])=>String(ver.niveis?.[k]||"").trim())&&<div>
            <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Descrição por nível</div>
            <div className="space-y-2">{NIVEIS_EXIG.map(([k,l])=>(
              <div key={k} className="flex gap-3 border border-slate-200 rounded-lg p-2.5">
                <span className="shrink-0 w-7 h-7 grid place-items-center rounded-full bg-brand/10 text-brand text-xs font-bold">{k}</span>
                <div className="flex-1"><div className="text-xs font-semibold text-navy">{l}</div>
                  <div className="text-sm text-slate-600 text-justify">{ver.niveis?.[k]||<span className="text-slate-300">Não preenchido</span>}</div></div>
              </div>))}</div></div>}
          {(ver.cargosIndicados||[]).length>0&&<div>
            <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Cargos indicados</div>
            <div className="flex flex-wrap gap-1.5">{(ver.cargosIndicados||[]).map(id=>{const cg=(cargos||[]).find(x=>x.id===id);if(!cg)return null;
              return <span key={id} className="text-[11px] bg-brand/10 text-brand px-2 py-1 rounded-md">{cg.titulo}</span>;})}</div></div>}
          <div className="border-t border-slate-200 pt-3">
            <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Exigida nos cargos <span className="text-slate-300 normal-case">· com nível definido no descritivo</span></div>
            {(()=>{const usos=(cargos||[]).map(cg=>{const r=(cg.competenciasReq||[]).find(x=>x.compId===ver.id);return r?{cargo:cg,nivel:r.nivel}:null;}).filter(Boolean);
              return usos.length
                ? <div className="flex flex-wrap gap-1.5">{usos.map(u=><span key={u.cargo.id} className="text-[11px] bg-slate-100 text-slate-700 px-2 py-1 rounded-md">{u.cargo.titulo} · nível {u.nivel}</span>)}</div>
                : <p className="text-sm text-slate-300">Ainda não vinculada a nenhum cargo.</p>;})()}
          </div>
        </div>
      </div>
    </div>}
  </div></main>;
}

function MatrizCompetencias({competencias,cargos,notify}){
  const [dep,setDep]=useState("");
  const [soComDef,setSoComDef]=useState(false);
  const [tipoF,setTipoF]=useState("");
  const comps=(competencias||[]).filter(c=>c.status!=="INATIVA"&&(!tipoF||c.tipo===tipoF))
    .sort((a,b)=>(a.tipo||"").localeCompare(b.tipo||"")||(a.grupo||"").localeCompare(b.grupo||"","pt-BR")||(a.nome||"").localeCompare(b.nome||"","pt-BR"));
  const nivelDe=(cg,compId)=>{const r=(cg.competenciasReq||[]).find(x=>x.compId===compId);return r?Number(r.nivel)||0:0;};
  const listaCargos=(cargos||[]).filter(cg=>cg.status!=="INATIVO")
    .filter(cg=>!dep||cg.departamento===dep)
    .filter(cg=>!soComDef||(cg.competenciasReq||[]).length>0)
    .sort((a,b)=>{
      const ca=String(a.codigo||"").trim(), cb=String(b.codigo||"").trim();
      if(ca&&!cb)return -1; if(!ca&&cb)return 1;          // sem código vai para o fim
      return ca.localeCompare(cb,"pt-BR",{numeric:true,sensitivity:"base"})
          || (a.titulo||"").localeCompare(b.titulo||"","pt-BR");
    });
  const deps=[...new Set((cargos||[]).map(c=>c.departamento).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const pontCargo=cg=>comps.reduce((s,c)=>s+nivelDe(cg,c.id),0);
  const pontComp=c=>listaCargos.reduce((s,cg)=>s+nivelDe(cg,c.id),0);
  const usosComp=c=>listaCargos.filter(cg=>nivelDe(cg,c.id)>0).length;
  const corNivel=n=>n===0?"text-slate-200":n===1?"bg-slate-100 text-slate-600":n===2?"bg-sky-100 text-sky-700":n===3?"bg-brand/15 text-brand":n===4?"bg-indigo-200 text-indigo-800":"bg-emerald-100 text-emerald-700";
  const exportar=()=>{
    try{
      if(!comps.length||!listaCargos.length){notify("Nada para exportar.");return;}
      const rot=cg=>cg.codigo?`${cg.codigo} — ${cg.titulo}`:cg.titulo;
      const linhas=comps.map(c=>{
        const o={"Tipo":c.tipo==="tecnica"?"Técnica":"Comportamental","Grupo":c.grupo||"","Competência":c.nome||""};
        listaCargos.forEach(cg=>{const n=nivelDe(cg,c.id);o[rot(cg)]=n||"";});
        o["Cargos que exigem"]=usosComp(c); o["Pontuação total"]=pontComp(c);
        return o;
      });
      const tot={"Tipo":"","Grupo":"","Competência":"PONTUAÇÃO DO CARGO"};
      listaCargos.forEach(cg=>{tot[rot(cg)]=pontCargo(cg);});
      linhas.push(tot);
      const ws=XLSX.utils.json_to_sheet(linhas);const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Matriz");XLSX.writeFile(wb,"matriz-competencias-cargos.xlsx");
    }catch(e){notify("Falha ao exportar: "+String(e.message||e).slice(0,60));}
  };
  const th="text-[11px] font-semibold text-slate-500 uppercase tracking-wide";
  const maiorNome=listaCargos.reduce((m,cg)=>Math.max(m,(cg.titulo||"").length),8);
  const headH=Math.min(300,Math.max(130,Math.round(maiorNome*6.6)+28));
  return <div className="space-y-3">
    <div className="flex items-center gap-3 flex-wrap">
      <select value={tipoF} onChange={e=>setTipoF(e.target.value)} className="text-sm border border-slate-300 rounded-md px-2.5 py-2 bg-white">
        <option value="">Todas as competências</option><option value="comportamental">Só comportamentais</option><option value="tecnica">Só técnicas</option></select>
      <select value={dep} onChange={e=>setDep(e.target.value)} className="text-sm border border-slate-300 rounded-md px-2.5 py-2 bg-white">
        <option value="">Todos os departamentos</option>{deps.map(d=><option key={d}>{d}</option>)}</select>
      <label className="flex items-center gap-2 text-sm text-slate-500 cursor-pointer select-none"><input type="checkbox" checked={soComDef} onChange={e=>setSoComDef(e.target.checked)} className="accent-brand"/>Só cargos já mapeados</label>
      <div className="ml-auto flex items-center gap-3">
        <div className="flex items-center gap-1.5 text-[11px] text-slate-400 flex-wrap">
          {NIVEIS_EXIG.map(([k])=><span key={k} className={"px-1.5 py-0.5 rounded font-semibold "+corNivel(Number(k))}>{k} · {NIVEIS_CURTO[k]}</span>)}
        </div>
        <div className="flex items-center rounded-md border border-slate-300 overflow-hidden text-sm shrink-0">
          <span className="px-2.5 py-2 text-slate-400 text-xs bg-slate-50 border-r border-slate-200">Exportar</span>
          <button onClick={exportar} className="px-2.5 py-2 text-slate-600 hover:bg-slate-50">Excel</button>
          <button onClick={()=>{ if(!comps.length||!listaCargos.length){notify("Nada para exportar.");return;}
            const w=window.open("","_blank"); if(!w){notify("Permita pop-ups para exportar em PDF.");return;}
            w.document.write(matrizHTML(comps,listaCargos,nivelDe,NIVEIS_EXIG.map(([k])=>[k,NIVEIS_CURTO[k]]))); w.document.close(); setTimeout(()=>w.print(),400);
          }} className="px-2.5 py-2 text-slate-600 hover:bg-slate-50 border-l border-slate-200">PDF</button>
        </div>
      </div>
    </div>

    {(!comps.length||!listaCargos.length)
      ? <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-12 text-center text-slate-400 text-sm">
          {!comps.length?"Cadastre competências para montar a matriz.":"Nenhum cargo encontrado com esse filtro."}
        </div>
      : <div className="matriz-scroll bg-white rounded-xl border border-slate-200 shadow-sm overflow-auto max-h-[70vh]">
        <table className="text-sm border-collapse">
          <thead className="sticky top-0 z-20">
            <tr className="bg-slate-50">

// célula de texto que cresce com o conteúdo
function CelTA({value,onChange,ph}){
  const r=useRef(null);
  // altura acompanha o texto: ao digitar, quando a largura da coluna muda e quando a fonte termina de carregar (sem barra de rolagem)
  const ajustar=()=>{ const el=r.current; if(!el) return; el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; };
  useEffect(ajustar,[value]);
  useEffect(()=>{ const el=r.current; if(!el) return; let ro=null;
    if(window.ResizeObserver){ let w=el.offsetWidth; ro=new ResizeObserver(()=>{ if(el.offsetWidth!==w){ w=el.offsetWidth; ajustar(); } }); ro.observe(el); }
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(ajustar).catch(()=>{});
    const t=setTimeout(ajustar,60); window.addEventListener("resize",ajustar);
    return ()=>{ clearTimeout(t); window.removeEventListener("resize",ajustar); ro&&ro.disconnect(); }; },[]);
  return <textarea ref={r} rows={1} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={ph} style={{overflow:"hidden"}}
    className="w-full resize-none bg-transparent outline-none px-2 py-1.5 text-sm leading-5 text-slate-700 rounded focus:bg-white focus:ring-1 focus:ring-brand/30 placeholder:text-slate-300"/>;
}
// lê tabela colada (HTML de Word/Excel/chat, ou texto separado por tabulação) e distribui nas colunas; ignora a linha de cabeçalho
// texto de uma célula colada: preserva quebras de linha (<br>, parágrafos) e negrito como **texto**
const textoCelula=td=>{ const c=td.cloneNode(true);
  c.querySelectorAll("strong,b").forEach(b=>{ b.textContent="**"+b.textContent+"**"; });
  c.querySelectorAll("br").forEach(b=>b.replaceWith("\n"));
  c.querySelectorAll("p,div,li").forEach(b=>b.append("\n"));
  return limparTextoColado(c.textContent); };
const limparTextoColado=t=>String(t||"").replace(/<br\s*\/?>/gi,"\n").replace(/\r/g,"").split("\n").map(l=>l.replace(/[ \t\u00a0]+/g," ").trim()).filter((l,i,a)=>l||(i>0&&a[i-1]))
  .join("\n").replace(/\*\*\s*\*\*/g,"").replace(/\n{3,}/g,"\n\n").trim();
// lê tabela colada (HTML de Word/Excel/chat, texto com tabulação ou tabela em markdown "| a | b |") e distribui nas colunas; ignora a linha de cabeçalho
const lerTabelaColada=(e,cols)=>{
  const cd=e.clipboardData||window.clipboardData; if(!cd) return null;
  let linhas=[]; const html=cd.getData("text/html");
  if(html&&/<table/i.test(html)){
    const d=new DOMParser().parseFromString(html,"text/html");
    d.querySelectorAll("tr").forEach(tr=>{ const cs=[...tr.querySelectorAll("th,td")].map(textoCelula); if(cs.some(Boolean)) linhas.push(cs); });
  } else {
    const t=(cd.getData("text")||"").replace(/\r/g,"");
    if(/^\s*\|.*\|\s*$/m.test(t)){ // tabela markdown
      linhas=t.split("\n").filter(l=>/^\s*\|/.test(l)&&!/^\s*\|?\s*:?-{2,}/.test(l.replace(/\|/g,"").trim()?l:"---"))
        .filter(l=>!/^\s*\|(\s*:?-+:?\s*\|)+\s*$/.test(l))
        .map(l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>limparTextoColado(x))).filter(l=>l.some(Boolean));
    } else { if(!t.includes("\t")) return null;
      linhas=t.split("\n").map(l=>l.split("\t").map(x=>limparTextoColado(x))).filter(l=>l.some(Boolean)); }
  }
  if(!linhas.length) return null;
  const norm=x=>String(x||"").replace(/\*/g,"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const acertos=linhas[0].filter(c=>cols.some(([,l])=>norm(c).startsWith(norm(l).split(" ")[0]))).length;
  if(acertos>=Math.min(2,cols.length)) linhas.shift(); // cabeçalho
  const n=cols.length;
  return linhas.map(l=>{ const r={id:uid()}; cols.forEach(([k],i)=>{ r[k]=i<n-1?(l[i]||""):l.slice(i).filter(Boolean).join(" "); });
    // nome (1ª coluna) e números sem marcação de negrito

    return r; });
};
const normNome=x=>String(x||"").replace(/\*/g,"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
// mostra **negrito** como <b> (orientações coladas de documentos)
const TextoRico=({t})=><>{String(t||"").split(/(\*\*[^*]+\*\*)/g).map((p,i)=>/^\*\*[^*]+\*\*$/.test(p)?<b key={i}>{p.slice(2,-2)}</b>:<React.Fragment key={i}>{p}</React.Fragment>)}</>;

    competenciasObrig:f.conhecimentos,competenciasDesej:f.habilidades,...(novo?{}:{_motivo:motivo,_semRevisao:!novaRevisao}),
    criterios:{tempoMinMeses:Number(f.criterios.tempoMinMeses)||0,notaMinAvaliacao:Number(f.criterios.notaMinAvaliacao)||0,exigeCompetenciasObrig:!!f.criterios.exigeCompetenciasObrig}},novo); };
  // preenchimento local (fallback sem chave de API)
  const preencherLocal=(t,dep)=>{
    setF(p=>({...p,titulo:p.titulo||t,departamento:dep||p.departamento,
      missao:p.missao||`Contribuir para os resultados da área de ${dep||"atuação"} exercendo as atribuições de ${t} com qualidade, segurança e alinhamento à missão da Braskim.`,
      responsabilidades:p.responsabilidades.length?p.responsabilidades:[`Executar as atribuições típicas de ${t}`,"Seguir procedimentos e normas aplicáveis","Registrar informações e indicadores da função"],
      conhecimentos:p.conhecimentos.length?p.conhecimentos:["Conhecimentos técnicos da área","Normas e procedimentos internos"],
      habilidades:p.habilidades.length?p.habilidades:["Organização","Comunicação","Trabalho em equipe"],
      atitudes:p.atitudes.length?p.atitudes:["Proatividade","Responsabilidade","Foco em segurança"]}));
    setTab("basico"); notify&&notify("Rascunho local gerado — configure a chave de IA em Conexões para o agente completo.");
  };
  // Agente IA (Claude via API Anthropic) — gera a descrição completa
  const gerar=async()=>{
    const t=(ag.cargo||f.titulo||"").trim(); const dep=(ag.departamento||f.departamento||"").trim();
    if(!t){notify&&notify("Informe o título do cargo para gerar.");return;}
    if(!iaKey){ preencherLocal(t,dep); return; }
    setGerando(true);
    try{
      const prompt=`Você é um especialista sênior em Cargos & Salários de uma indústria brasileira de produtos de limpeza e especialidades químicas (Braskim). Elabore uma DESCRIÇÃO DE CARGO completa, realista e em português do Brasil para o cargo "${t}"${dep?` no departamento "${dep}"`:""}.
Responda SOMENTE com um objeto JSON válido (sem markdown, sem comentários, sem texto fora do JSON), exatamente com estas chaves:
{"missao": string, "responsabilidades": string[], "detalhesExperiencia": string, "certificacoes": string,
"escolaridadeMinima": um de ${JSON.stringify(ESCOLARIDADES)}, "tempoExperiencia": um de ${JSON.stringify(TEMPOS_EXP)},
"nivel": um de ${JSON.stringify(NIVEIS)} (nível da trilha de carreira, 01=mais júnior), "cbo": string (código CBO plausível), "faixaMin": number, "faixaMax": number,
"classificacao": um de ${JSON.stringify(CLASSIFICACOES)} (nível do cargo na organização), "relacionamentoCliente": um de ${JSON.stringify(RELAC_CLIENTE)},
"supervisionaPessoas": boolean, "cuidaBensMateriais": boolean, "lidaValoresFinanceiros": boolean, "acessaInfoConfidenciais": boolean,
"metas": string[], "indicadores": string[], "conhecimentos": string[], "habilidades": string[], "atitudes": string[],
"desafios": string, "recursosFerramentas": string, "cargosAnteriores": string[], "proximosPassos": string[],
"treinamentos": string[], "atividades": {"diarias": string[], "semanais": string[], "quinzenais": string[], "mensais": string[], "esporadicas": string[], "anuais": string[]}}
Use 3 a 6 itens por lista, linguagem objetiva de RH, e valores de faixa salarial (R$) coerentes com o mercado industrial brasileiro.`;
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"content-type":"application/json","x-api-key":iaKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:iaModel||"claude-sonnet-4-5",max_tokens:2500,messages:[{role:"user",content:prompt}]})});
      if(!res.ok){ const e=await res.text(); throw new Error(res.status+" — "+e.slice(0,140)); }
      const data=await res.json();
      const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
      const j=JSON.parse(txt.replace(/```json|```/g,"").trim());
      const at=j.atividades||{};
      setF(p=>({...p,titulo:t,departamento:dep||p.departamento,
        missao:j.missao??p.missao,responsabilidades:j.responsabilidades||p.responsabilidades,
        detalhesExperiencia:j.detalhesExperiencia??p.detalhesExperiencia,certificacoes:j.certificacoes??p.certificacoes,
        escolaridadeMinima:j.escolaridadeMinima||p.escolaridadeMinima,tempoExperiencia:j.tempoExperiencia||p.tempoExperiencia,
        nivel:j.nivel||p.nivel,cbo:j.cbo??p.cbo,faixaMin:j.faixaMin??p.faixaMin,faixaMax:j.faixaMax??p.faixaMax,
        classificacao:j.classificacao||p.classificacao,relacionamentoCliente:j.relacionamentoCliente||p.relacionamentoCliente,
        supervisionaPessoas:!!j.supervisionaPessoas,cuidaBensMateriais:!!j.cuidaBensMateriais,lidaValoresFinanceiros:!!j.lidaValoresFinanceiros,acessaInfoConfidenciais:!!j.acessaInfoConfidenciais,
        metas:j.metas||p.metas,indicadores:j.indicadores||p.indicadores,
        indicadoresTab:Array.isArray(j.indicadores)&&j.indicadores.length?j.indicadores.map(t=>({id:uid(),indicador:String(t),objetivo:"",frequencia:""})):p.indicadoresTab,
        conhecimentos:j.conhecimentos||p.conhecimentos,habilidades:j.habilidades||p.habilidades,atitudes:j.atitudes||p.atitudes,
        desafios:j.desafios??p.desafios,recursosFerramentas:j.recursosFerramentas??p.recursosFerramentas,
        cargosAnteriores:j.cargosAnteriores||p.cargosAnteriores,proximosPassos:j.proximosPassos||p.proximosPassos,
        treinamentos:j.treinamentos||p.treinamentos,
        atividades:{diarias:at.diarias||[],semanais:at.semanais||[],quinzenais:at.quinzenais||[],mensais:at.mensais||[],esporadicas:at.esporadicas||[],anuais:at.anuais||[]}}));
      setTab("basico"); notify&&notify("Descrição gerada pelo agente ✓ — revise e ajuste.");
    }catch(err){ console.error(err); notify&&notify("Falha no agente: "+String(err.message||err).slice(0,90)); }
    finally{ setGerando(false); }
  };
  // ordem das abas depende do nível do cargo: Rotina de gestão só para Estratégico
  const tabs=[["basico","Cadastro"],["descricao","Descrição"],["atividades","Atividades"],["indicadores","Indicadores"],["competencias","Competências"],
    ...(ehEstrategico(f)?[["rotina","Rotina de gestão"]]:[]),["criterios","Critérios de avaliação"],["promocao","Promoção"],["treinamentos","Treinamentos"],["carreira","Carreira"]];
  useEffect(()=>{ if(!tabs.some(([k])=>k===tab)) setTab("basico"); },[f.classificacao]);
  const inp="w-full text-sm border border-slate-300 rounded-md px-2.5 py-1.5 outline-none focus:ring-2 ring-brand/30";
  const ta="w-full text-sm border border-slate-300 rounded-md px-2.5 py-1.5 outline-none focus:ring-2 ring-brand/30";
  return <div className="fixed inset-0 z-50 bg-slate-50 flex flex-col">
    <div className="px-5 py-3 border-b border-slate-200 bg-white flex items-center justify-between shrink-0">
      <div className="flex items-center gap-3">
        <button onClick={onClose} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-md border border-slate-300 text-slate-600 hover:bg-slate-50">← Voltar</button>
        <div><h1 className="text-xl font-bold text-navy">{novo?"Novo Cargo":"Editar Cargo"}</h1><p className="text-sm text-slate-500">{f.titulo||"Preencha os dados do cargo"}{f.codigo?` · ${f.codigo}`:""}</p></div>
      </div>
      <button onClick={salvar} disabled={!ok} className="bg-brand hover:bg-navy text-white text-sm font-medium px-5 py-2 rounded-md shadow-sm disabled:opacity-50">{novo?"Criar cargo":"Salvar alterações"}</button>
    </div>
    <div className="flex-1 overflow-auto">
      <div className="max-w-5xl mx-auto w-full p-5">
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
      {/* abas */}
      <div className="flex flex-wrap gap-x-0.5 px-4 pt-2 border-b border-slate-200">
        {tabs.map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={"px-1.5 py-2 text-[13px] font-medium border-b-2 whitespace-nowrap "+(tab===k?"border-brand text-brand":"border-transparent text-slate-400 hover:text-slate-600")}>{l}</button>)}
      </div>
      <div className="p-4 space-y-4">
        {tab==="basico"&&<>
          <div className="grid grid-cols-2 gap-3">
            <L t="Título do Cargo *"><input value={f.titulo} onChange={e=>set("titulo",e.target.value)} className={inp}/></L>
            <L t="Código *"><input value={f.codigo} onChange={e=>set("codigo",e.target.value)} placeholder="Ex: BKM-001" className={inp+" font-mono"+(codigoDup?" border-red-400 ring-2 ring-red-100":"")}/>{codigoDup&&<div className="text-[11px] text-red-500 mt-0.5">Este código já está em uso por outro cargo.</div>}</L>
            <L t="CBO (catálogo MTE)"><input value={f.cbo} onChange={e=>set("cbo",e.target.value)} placeholder="Ex: 4141-05" className={inp}/></L>
            <L t="Nível do Cargo"><select value={f.classificacao||""} onChange={e=>set("classificacao",e.target.value)} className={inp}><option value="">Selecione</option>{[...new Set([...CLASSIFICACOES,f.classificacao].filter(Boolean))].map(x=><option key={x}>{x}</option>)}</select></L>
            <L t="Departamento *"><select value={f.departamento} onChange={e=>set("departamento",e.target.value)} className={inp}><option value="">Selecione</option>{[...new Set([...departamentos,f.departamento].filter(Boolean))].map(d=><option key={d}>{d}</option>)}</select></L>
            <L t="Cargo Superior"><select value={f.cargoSuperior} onChange={e=>set("cargoSuperior",e.target.value)} className={inp}><option value="">Nenhum cargo superior</option>{cargos.filter(c=>c.titulo!==f.titulo&&c.status!=="INATIVO").map(c=><option key={c.id}>{c.titulo}</option>)}</select></L>
            <L t="Revisão"><input value={novo?"REV01 (nova)":fmtRev(f.revisao)} disabled className={inp+" bg-slate-100 text-slate-500"}/></L>
            <L t="Data da última revisão"><input value={novo?"—":brDate(f.dataRevisao)} disabled className={inp+" bg-slate-100 text-slate-500"}/></L>
          </div>
          <div className="grid grid-cols-2 gap-3 border-t border-slate-200 pt-3">
            <L t="Faixa salarial mín. (R$)"><FaixaInp valor={f.faixaMin} onChange={v=>set("faixaMin",v)} ver={verFaixa} setVer={setVerFaixa} cls={inp}/></L>
            
            <L t="Faixa salarial máx. (R$)"><FaixaInp valor={f.faixaMax} onChange={v=>set("faixaMax",v)} ver={verFaixa} setVer={setVerFaixa} cls={inp}/></L>
          </div>
          <div className="border-t border-slate-200 pt-3">
            <div className="text-[11px] uppercase tracking-wide text-brand font-semibold mb-2">Requisitos para ocupação do cargo</div>
            <div className="grid grid-cols-2 gap-3">
              <L t="Formação"><div className="flex gap-2">
                <select value={f.escolaridadeMinima} onChange={e=>set("escolaridadeMinima",e.target.value)} className={inp+" w-44 shrink-0"}><option value="">Escolaridade</option>{ESCOLARIDADES.map(x=><option key={x}>{x}</option>)}</select>
                <input value={f.formacaoArea||""} onChange={e=>set("formacaoArea",e.target.value)} placeholder="Área / curso (ex.: Engenharia Química)" className={inp}/>
              </div></L>
                          {ehEstrategico(f)&&<>
                <L t="Habilitação profissional"><input value={f.habilitacao||""} onChange={e=>set("habilitacao",e.target.value)} placeholder="Ex.: Registro ativo no CRQ ou CREA" className={inp}/></L>
                <L t="Experiência"><textarea value={f.detalhesExperiencia||""} onChange={e=>set("detalhesExperiencia",e.target.value)} rows="2" placeholder="Ex.: Gestão de operações industriais em indústria química" className={ta}/></L>
                <L t="Tempo de Experiência"><select value={f.tempoExperiencia} onChange={e=>set("tempoExperiencia",e.target.value)} className={inp}><option value="">Selecione</option>{TEMPOS_EXP.map(x=><option key={x}>{x}</option>)}</select></L>
              </>}
              {!ehEstrategico(f)&&<L t="Tempo de Experiência"><select value={f.tempoExperiencia} onChange={e=>set("tempoExperiencia",e.target.value)} className={inp}><option value="">Selecione</option>{TEMPOS_EXP.map(x=><option key={x}>{x}</option>)}</select></L>}
              {ehEstrategico(f)&&<>
                <AddList label="Conhecimentos técnicos" items={f.conhecTecnicos||[]} onChange={v=>set("conhecTecnicos",v)} vertical placeholder="Adicionar (pode colar vários)"/>
                <AddList label="Conhecimentos gerenciais" items={f.conhecGerenciais||[]} onChange={v=>set("conhecGerenciais",v)} vertical placeholder="Adicionar (pode colar vários)"/>
                <div className="col-span-2"><AddList label="Sistemas e ferramentas" items={f.sistemasFerramentas||[]} onChange={v=>set("sistemasFerramentas",v)} vertical placeholder="Ex.: ERP, Excel avançado, Power BI"/></div>
              </>}
            </div>
            {!ehEstrategico(f)&&<p className="text-[11px] text-slate-400 mt-2">Para cargos táticos e operacionais, os requisitos são formação e tempo de experiência. Os demais aparecem quando o nível do cargo é Estratégico.</p>}
          </div>
          <p className="text-[11px] text-slate-400">A faixa salarial alimenta as abas Equidade e Movimentações. A criação de nova revisão é definida no rodapé, ao salvar.</p>
        </>}
        {tab==="descricao"&&<>
          <L t="Missão do Cargo"><textarea value={f.missao} onChange={e=>set("missao",e.target.value)} rows="3" placeholder="Descrição curta, inspiradora e conectada à missão da empresa" className={ta}/></L>
          <RichText label="Principais Responsabilidades do Cargo" value={f.responsabilidadesTexto} onChange={v=>set("responsabilidadesTexto",v)} numeracaoContinua
            placeholder="Liste as principais responsabilidades. Use o botão 1. para numerar os tópicos e B para negrito."
            dica={<><b>Enter</b>: novo tópico numerado · <b>Shift+Enter</b>: nova linha no mesmo tópico · <b>Tab</b>: subitem · <b>Shift+Tab</b>: tira a linha da numeração. A contagem segue mesmo com texto entre os tópicos.</>}/>
          <L t="Principais Desafios do Cargo"><textarea value={f.desafios} onChange={e=>set("desafios",e.target.value)} rows="2" placeholder="Descreva os principais desafios e barreiras do cargo" className={ta}/></L>
          <L t="Recursos e Ferramentas"><textarea value={f.recursosFerramentas} onChange={e=>set("recursosFerramentas",e.target.value)} rows="2" placeholder="Ferramentas e recursos geralmente utilizados" className={ta}/></L>
        </>}
        {tab==="indicadores"&&<>
          <p className="text-xs text-slate-500">Indicadores acompanhados por este cargo. Você pode colar uma tabela inteira do Excel, Word ou de um chat: clique em qualquer célula (ou no campo "Colar tabela") e use Ctrl+V.</p>
          <TabelaEditavel cols={COLS_INDIC} larg={["w-[30%]","","w-[16%]"]} rows={f.indicadoresTab||[]} onChange={v=>set("indicadoresTab",v)} rotuloAdd="+ Adicionar indicador" vazioMsg="Nenhum indicador ainda. Adicione uma linha ou cole uma tabela."/>
        </>}
        {tab==="competencias"&&(()=>{
          const dic=(competencias||[]).filter(c=>c.status!=="INATIVA");
          const req=f.competenciasReq||[];
          const addComp=id=>{ if(!id||req.some(r=>r.compId===id))return; set("competenciasReq",[...req,{compId:id,nivel:"2"}]); };
          const setNivelReq=(id,n)=>set("competenciasReq",req.map(r=>r.compId===id?{...r,nivel:n}:r));
          const delComp=id=>set("competenciasReq",req.filter(r=>r.compId!==id));
          const setEvid=(id,v)=>set("competenciasReq",req.map(r=>r.compId===id?{...r,evidencia:v}:r));
          // colar tabela "Competência | Evidência": preenche por nome ou código das competências já vinculadas
          const colarEvid=e=>{ const linhas=lerTabelaColada(e,[["comp","Competência"],["evidencia","Evidência"]]); if(!linhas||!linhas.length) return;
            if(linhas.length===1&&!(linhas[0].comp&&linhas[0].evidencia)) return;
            e.preventDefault();
            const nrm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
            const mapa={}; const faltou=[];
            linhas.forEach(l=>{ const alvo=nrm(l.comp); if(!alvo) return;
              const r=req.find(x=>{ const c=dic.find(d=>d.id===x.compId); return c&&(nrm(c.nome)===alvo||nrm(c.codigo)===alvo); });
              if(r) mapa[r.compId]=l.evidencia; else faltou.push(l.comp); });
            const n=Object.keys(mapa).length;
            if(n) set("competenciasReq",req.map(r=>r.compId in mapa?{...r,evidencia:mapa[r.compId]}:r));
            notify&&notify(`${n} evidência(s) preenchida(s)`+(faltou.length?` · não vinculadas ao cargo (ignoradas): ${faltou.join(", ")}`:" ✓"));
          };
          // filtro opcional: divide as comportamentais em Essenciais e Específicas pela Aplicabilidade do dicionário
          const bloco=(tipoC,titulo,filtro,sub)=>{
            const ok=c=>c.tipo===tipoC&&(!filtro||filtro(c));
            const disponiveis=dic.filter(c=>ok(c)&&!req.some(r=>r.compId===c.id));
            const escolhidas=req.map(r=>({r,c:dic.find(x=>x.id===r.compId)})).filter(x=>x.c&&ok(x.c));
            const essenciais=sub==="essenciais";
            const incluirTodas=()=>set("competenciasReq",[...req,...disponiveis.map(c=>({compId:c.id,nivel:"2"}))]);
            return <div className="space-y-2">
              <div className="flex items-center gap-2">
                <div className={sub?"text-[11px] font-semibold text-slate-600":"text-[11px] uppercase tracking-wide text-slate-400"}>{titulo}{sub?<span className="font-normal text-slate-400"> · {escolhidas.length}</span>:null}</div>
                {essenciais&&disponiveis.length>0&&<button onClick={incluirTodas} className="ml-auto text-[11px] px-2 py-0.5 border border-brand/40 text-brand rounded hover:bg-brand/5">+ Incluir todas as essenciais ({disponiveis.length})</button>}
              </div>
              {essenciais&&<p className="text-[11px] text-slate-400 -mt-1">Padronizadas para todos os cargos. Aparecem aqui as competências marcadas como <b>Essencial</b> no dicionário.</p>}
              {escolhidas.length===0&&<p className="text-[11px] text-slate-400">{sub?`Nenhuma competência ${essenciais?"essencial":"específica"} exigida ainda.`:`Nenhuma competência ${tipoC==="tecnica"?"técnica":"comportamental"} exigida ainda.`}</p>}
              {escolhidas.map(({r,c})=>(
                <div key={c.id} className="border border-slate-200 rounded-lg grid md:grid-cols-2 md:divide-x divide-slate-100">
                  <div className="px-3 py-2 min-w-0">
                  <div className="flex items-center gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-navy truncate">{c.codigo?<span className="font-mono text-[11px] text-slate-400 mr-1.5">{c.codigo}</span>:null}{c.nome}{sub==="especificas"&&c.aplicabilidade==="Liderança"&&<span className="ml-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-violet-50 text-violet-700 font-medium align-middle">Liderança</span>}</div>
                      {c.grupo&&<div className="text-[10px] text-slate-400">{c.grupo}</div>}
                    </div>
                    <select value={r.nivel} onChange={e=>setNivelReq(c.id,e.target.value)} className="text-sm border border-slate-300 rounded-md px-2 py-1 bg-white shrink-0">
                      {NIVEIS_EXIG.map(([k,l])=><option key={k} value={k}>{l}</option>)}
                    </select>
                    <button onClick={()=>delComp(c.id)} className="text-slate-400 hover:text-red-500 shrink-0 w-6 h-6 grid place-items-center" title="Remover">✕</button>
                  </div>
                  {c.niveis?.[r.nivel]&&<p className="text-[11px] text-slate-500 mt-1.5 pl-0.5 text-justify border-t border-slate-100 pt-1.5">{c.niveis[r.nivel]}</p>}
                </div>
                  <div className="px-3 py-2 bg-slate-50/60 md:rounded-r-lg border-t md:border-t-0 border-slate-100">
                    <div className="text-[10px] uppercase tracking-wide text-slate-400 mb-1">Evidência observável aplicada à função</div>
                    <CelTA value={r.evidencia} onChange={v=>setEvid(c.id,v)} ph="Como esta competência aparece no dia a dia deste cargo…"/>
                  </div>
                </div>))}
              <CompPicker itens={disponiveis} onPick={addComp}
                placeholder={disponiveis.length?`+ Adicionar competência ${sub?(essenciais?"essencial":"específica"):(tipoC==="tecnica"?"técnica":"comportamental")} — busque por código ou nome…`:"Todas já foram adicionadas"}/>
            </div>;
          };
          if(!dic.length) return <div className="text-center py-10 text-slate-400 text-sm">
            Nenhuma competência cadastrada no dicionário ainda.<br/>Vá em <b>Desenvolvimento → Competências</b> para criar o dicionário primeiro.</div>;
          return <>
            <p className="text-[11px] text-slate-400">Selecione as competências do dicionário e defina o <b>nível exigido</b> para este cargo. A pontuação total aparece na matriz em Competências.</p>
            {req.length>0&&<div onPaste={colarEvid} className="flex items-center gap-2">
              <input value="" onChange={()=>{}} placeholder="Colar evidências aqui (tabela Competência | Evidência, Ctrl+V)" className="flex-1 text-sm border border-dashed border-slate-300 rounded-md px-3 py-1.5 bg-slate-50 focus:bg-white outline-none focus:ring-1 focus:ring-brand/30 cursor-pointer"/>
            </div>}
            <div className="space-y-3">

function MoverModal({ctx,cargos,pessoas,onClose,onSolicitar,isRH}){

  // caminhos de promoção (um por trilha compartilhada); pode haver vários
  const caminhos=useMemo(()=>pessoa&&!lateral?proximosCargos(cargos,pessoa.vinculo.cargo):[],[pessoa,lateral,cargos]);
  const [trilhaSel,setTrilhaSel]=useState(caminhos[0]?.familia||"");
  useEffect(()=>{ setTrilhaSel(caminhos[0]?.familia||""); },[pessoaId,cargos]);
  const opcoes=useMemo(()=>{
    if(!pessoa)return [];
    if(lateral) return cargosLaterais(cargos,pessoa.vinculo.cargo);
    // promoção: destino é o próximo cargo da trilha escolhida
    const cam=caminhos.find(c=>c.familia===trilhaSel)||caminhos[0];
    return cam?[cam.cargo]:[];
  },[pessoa,lateral,cargos,caminhos,trilhaSel]);
  const [destinoT,setDestinoT]=useState(opcoes[0]?.titulo||"");
  useEffect(()=>{ setDestinoT(opcoes[0]?.titulo||""); },[pessoaId,trilhaSel,cargos]);
  const destino=cargos.find(c=>c.titulo===destinoT);
  const [sal,setSal]=useState("");
  useEffect(()=>{ setSal(destino?String(lateral?pessoa?.vinculo.salario||destino.faixaMin:destino.faixaMin):""); },[destinoT]);
  const [just,setJust]=useState("");
  const el=pessoa&&!lateral?avaliarElegibilidade(pessoa,cargos,trilhaSel):null;
  const pos=destino?posicaoNaFaixa(destino,Number(sal)):null;
  const delta=pessoa?Number(sal)-pessoa.vinculo.salario:0;
  if(!pessoa) return null;
  return <div className="fixed inset-0 z-50 grid place-items-center bg-navy/40 p-4" onClick={onClose}>
    <div className="bg-white rounded-lg shadow-2xl w-full max-w-md p-5 max-h-[90vh] overflow-auto" onClick={e=>e.stopPropagation()}>

      {!lateral&&caminhos.length>1&&<L t="Trilha de promoção"><select value={trilhaSel} onChange={e=>setTrilhaSel(e.target.value)} className="w-full text-sm border border-slate-300 rounded-md px-2.5 py-1.5 mt-0.5">{caminhos.map(c=><option key={c.familia} value={c.familia}>{c.familia} → {c.cargo.titulo}</option>)}</select></L>}
      {!lateral&&caminhos.length>1&&<div className="text-[11px] text-amber-600 mt-1">Este cargo pertence a {caminhos.length} trilhas — escolha por qual promover.</div>}
      <div className="text-sm text-slate-500 mt-2">{pessoa.vinculo.cargo} <span className="text-slate-300">→</span> {destino?<b className="text-navy">{destino.titulo}</b>:<span className="text-amber-600">sem destino disponível</span>}</div>
      {!lateral&&opcoes.length===0&&<div className="text-sm text-slate-500 mt-3">{pessoa.nome} já está no topo da trilha.</div>}
      {opcoes.length>0&&<>
        {lateral&&<L t="Cargo destino (mesmo nível)"><select value={destinoT} onChange={e=>setDestinoT(e.target.value)} className="w-full text-sm border border-slate-300 rounded-md px-2.5 py-1.5 mt-0.5">{opcoes.map(c=><option key={c.id} value={c.titulo}>{c.titulo} ({familiasDe(c).join(", ")})</option>)}</select></L>}

        {isRH&&destino&&<div className="mt-3"><L t={`Novo salário (faixa ${money(destino.faixaMin)}–${money(destino.faixaMax)})`}><Inp type="number" value={sal} onChange={e=>setSal(e.target.value)}/></L>

        <L t="Justificativa"><textarea value={just} onChange={e=>setJust(e.target.value)} rows="2" className="w-full text-sm border border-slate-300 rounded-md px-2.5 py-1.5 mt-0.5"/></L>

        {opcoes.length>0&&<button disabled={!destino||(isRH&&!sal)} onClick={()=>onSolicitar(pessoa,destino,ctx.tipo,isRH?sal:pessoa.vinculo.salario,just,el?el.elegivel:true)} className={"px-4 py-1.5 text-sm font-medium rounded-md text-white "+(destino&&(!isRH||sal)?"bg-brand hover:bg-navy":"bg-slate-300 cursor-not-allowed")}>Solicitar</button>}</div>
    </div></div>;
}
function HistoricoDrawer({pessoa,eventos,cargoAtual,isRH,onClose}){
  const relevantes=["PessoaAdmitida","CargoAlterado","AlteracaoSalarial","PromocaoAprovada","MovimentacaoRealizada"];
  const hist=eventos.filter(e=>relevantes.includes(e.tipo)).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const pos=cargoAtual?posicaoNaFaixa(cargoAtual,pessoa.vinculo.salario):null;
  return <Slide onClose={onClose} titulo={pessoa.nome} sub={pessoa.vinculo.cargo} status={pessoa.status}>
    <div className="grid grid-cols-2 gap-3 mb-4">
      <Info l="Cargo atual">{pessoa.vinculo.cargo}</Info><Info l="Tempo no cargo">{mesesDesde(pessoa.vinculo.desdeCargo||pessoa.vinculo.admissao)} meses</Info>
      {isRH&&<Info l="Salário atual">{money(pessoa.vinculo.salario)}</Info>}
      {isRH&&cargoAtual&&<Info l="Faixa / posição">{money(cargoAtual.faixaMin)}–{money(cargoAtual.faixaMax)} · {pos==="DENTRO"?"na faixa":pos==="ABAIXO"?"abaixo":"acima"}</Info>}
      <Info l="Última avaliação">{pessoa.ultimaAvaliacao?pessoa.ultimaAvaliacao.toFixed(1):"—"}</Info>
    </div>
    <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-2">Histórico de cargo e salário</div>
    <div className="text-xs text-slate-400 mb-3 bg-slate-50 rounded-md p-2.5 ring-1 ring-slate-200">Derivado dos eventos imutáveis — o histórico nunca é perdido nem editado.</div>
    <div className="relative pl-5"><div className="absolute left-1.5 top-1 bottom-1 w-px bg-slate-200"></div>
      {hist.map(e=>{const m=EVENTO_META[e.tipo]||{c:"#64748b",t:e.tipo};

      {hist.length===0&&<div className="text-sm text-slate-400">Sem histórico registrado.</div>}
    </div>
  </Slide>;
}

// --- Ordenação de tabelas (reutilizável) ---
function useSort(defKey,defDir){
  const [sort,setSort]=useState({key:defKey||null,dir:defDir||"asc"});
  const toggle=key=>setSort(s=>s.key===key?{key,dir:s.dir==="asc"?"desc":"asc"}:{key,dir:"asc"});
  const sortBy=(arr,accessors)=>{
    if(!sort.key||!accessors[sort.key])return arr;
    const get=accessors[sort.key];
    const mul=sort.dir==="asc"?1:-1;
    return [...arr].sort((a,b)=>{
      let va=get(a),vb=get(b);
      if(va==null)va="";if(vb==null)vb="";
      if(typeof va==="number"&&typeof vb==="number")return (va-vb)*mul;
      return String(va).localeCompare(String(vb),"pt-BR",{numeric:true,sensitivity:"base"})*mul;
    });
  };
  return {sort,toggle,sortBy};
}
const SortTh=({label,col,sort,onSort,align="left",className=""})=>{
  const active=sort.key===col;
  const arrow=active?(sort.dir==="asc"?"▲":"▼"):"";
  const just=align==="center"?"justify-center":align==="right"?"justify-end":"justify-start";
  return (
    <th className={"font-semibold px-3 py-2.5 select-none cursor-pointer group "+(align==="center"?"text-center":align==="right"?"text-right":"text-left")+" "+className}
        onClick={()=>onSort(col)} title="Ordenar">
      <span className={"inline-flex items-center gap-1 "+just}>
        {label}
        <span className={"text-[9px] transition-opacity "+(active?"opacity-100 text-brand":"opacity-0 group-hover:opacity-40")}>{arrow||"▲"}</span>
      </span>
    </th>
  );
};
