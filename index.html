function ProcedimentosView({pessoas,role,busca,notify,fb,usuario}){
  const {sort,toggle,sortBy}=useSort("nome","asc");
  const [procs,setProcs]=useState([]);
  const [carregando,setCarregando]=useState(true);
  const [form,setForm]=useState(null); // objeto em edição ou {} para novo
  const [filtro,setFiltro]=useState("todos"); // todos | vencido | a-vencer
  const podeEditar=role==="RH"||role==="ADMIN";
  const db=fb&&fb.db;

  useEffect(()=>{
    if(!db){setCarregando(false);return;}
    const un=db.collection(PROC_COL).onSnapshot(
      s=>{setProcs(s.docs.map(d=>({id:d.id,...d.data()})));setCarregando(false);},
      e=>{console.error("[proc]",e);notify&&notify("Erro ao carregar procedimentos: "+(e.message||e));setCarregando(false);});
    return ()=>un&&un();
  },[db]);

  const responsaveis=useMemo(()=>(pessoas||[]).filter(p=>p.status!=="DESLIGADO").map(p=>p.nome).filter(Boolean).sort((a,b)=>a.localeCompare(b,"pt-BR")),[pessoas]);
  const salvar=async(dados)=>{
    if(!db)return;
    if(!(dados.nome||"").trim()){notify&&notify("Informe o nome/código do procedimento.");return;}
    try{
      const {id,...limpo}=dados;   // separa o id: ele nunca vai dentro do documento
      const payload={...limpo,atualizadoEm:new Date().toISOString(),por:(usuario&&usuario.email)||"?"};
      if(id){await db.collection(PROC_COL).doc(id).set(payload,{merge:true});}
      else await db.collection(PROC_COL).add({...payload,criadoEm:new Date().toISOString()});
      notify&&notify(id?"Procedimento atualizado.":"Procedimento criado.");setForm(null);
    }catch(e){notify&&notify("Erro ao salvar: "+(e.message||e));}
  };
  const excluir=async p=>{if(!db)return;if(!window.confirm(`Excluir "${p.nome}"?`))return;
    try{await db.collection(PROC_COL).doc(p.id).delete();notify&&notify("Procedimento excluído.");}catch(e){notify&&notify("Erro: "+(e.message||e));}};

  const termo=(busca||"").trim().toLowerCase();
  const lista=useMemo(()=>procs.filter(p=>{
    const okBusca=!termo||[p.nome,p.descricao,p.tipo,p.pasta,p.responsavel,...(p.palavrasChave||[])].filter(Boolean).join(" ").toLowerCase().includes(termo);
    const st=procValidade(p.validade)[0];
    const okFiltro=filtro==="todos"||(filtro==="vencido"&&st==="vencido")||(filtro==="a-vencer"&&st==="a-vencer");
    return okBusca&&okFiltro;
  }),[procs,termo,filtro]);

  const stats={total:procs.length,vencidos:procs.filter(p=>procValidade(p.validade)[0]==="vencido").length,aVencer:procs.filter(p=>procValidade(p.validade)[0]==="a-vencer").length};
  // agrupa por pasta
  const acessores={nome:p=>p.nome,tipo:p=>p.tipo,responsavel:p=>p.responsavel,revisao:p=>p.revisao,
    validade:p=>p.validade||"9999",status:p=>procStatusInfo(procStatusNorm(p))[1]};
  const grupos=useMemo(()=>{const m={};lista.forEach(p=>{const k=p.pasta||"Sem pasta";(m[k]=m[k]||[]).push(p);});return Object.keys(m).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(k=>[k,sortBy(m[k],acessores)]);},[lista,sort]);

  return <div className="flex-1 overflow-y-auto px-8 py-6 bg-slate-50">
    <div className="w-full">
    <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
      <div className="flex items-center gap-3">
        <span className="w-10 h-10 grid place-items-center rounded-xl bg-brand/10 text-brand"><IcDoc size={22}/></span>
        <div><h1 className="text-2xl font-bold text-navy">Procedimentos</h1>
          <p className="text-sm text-slate-500">Documentos e procedimentos de RH</p></div>
      </div>
      {podeEditar&&<button onClick={()=>setForm({})} className="bg-brand hover:bg-navy text-white text-sm font-medium px-4 py-2 rounded-md shadow-sm flex items-center gap-1.5"><IcPlus/>Novo procedimento</button>}
    </div>

    <div className="flex gap-2 mb-4 flex-wrap">
      {[["todos","Todos",stats.total,"bg-navy text-white"],["vencido","Vencidos",stats.vencidos,"bg-red-500 text-white"],["a-vencer","A vencer",stats.aVencer,"bg-amber-500 text-white"]].map(([id,l,n,cor])=>(
        <button key={id} onClick={()=>setFiltro(id)} className={"px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-2 "+(filtro===id?cor:"bg-white border border-slate-200 text-slate-600 hover:bg-slate-50")}>
          {l}<span className={"text-xs px-1.5 rounded-full "+(filtro===id?"bg-white/25":"bg-slate-100")}>{n}</span></button>))}
    </div>

    {carregando?<div className="text-center text-slate-400 py-16">Carregando…</div>
      :lista.length===0?<div className="bg-white rounded-xl border border-slate-200 py-16 text-center text-slate-400">Nenhum procedimento {filtro!=="todos"?"neste filtro":"cadastrado"}.</div>
      :<div className="space-y-5">
        {grupos.map(([pasta,itens])=>(
          <div key={pasta} className="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-100 text-sm font-semibold text-navy flex items-center gap-2"><IcFolder/>{pasta} <span className="text-slate-400 font-normal">({itens.length})</span></div>
            <div className="overflow-x-auto"><table className="w-full text-sm min-w-[900px]">
              <thead><tr className="text-slate-500 text-xs uppercase tracking-wide border-b border-slate-100">
                <SortTh label="Procedimento" col="nome" sort={sort} onSort={toggle} className="px-4 py-2"/>
                <SortTh label="Tipo" col="tipo" sort={sort} onSort={toggle} className="px-3 py-2"/>
                <SortTh label="Responsável" col="responsavel" sort={sort} onSort={toggle} className="px-3 py-2"/>
                <SortTh label="Revisão" col="revisao" sort={sort} onSort={toggle} align="center" className="px-3 py-2"/>
                <SortTh label="Validade" col="validade" sort={sort} onSort={toggle} className="px-3 py-2"/>
                <SortTh label="Status" col="status" sort={sort} onSort={toggle} align="center" className="px-3 py-2"/>
                <th className="text-center font-semibold px-3 py-2">Drive</th>
                <th className="text-center font-semibold px-3 py-2">Ações</th></tr></thead>
              <tbody>{itens.map(p=>{const[stv,txv]=procValidade(p.validade);
                const corv=stv==="vencido"?"text-red-600 font-semibold":stv==="a-vencer"?"text-amber-600 font-semibold":stv==="valido"?"text-emerald-600":"text-slate-400";
                return <tr key={p.id} className="border-t border-slate-50 hover:bg-slate-50/50">
                  <td className="px-4 py-2.5"><div className="font-medium text-navy">{p.nome}</div>{p.descricao&&<div className="text-[11px] text-slate-400 truncate max-w-md">{p.descricao}</div>}</td>
                  <td className="px-3 py-2.5">{p.tipo&&<span className="text-[11px] font-medium px-2 py-0.5 rounded bg-brand/10 text-brand">{p.tipo}</span>}</td>
                  <td className="px-3 py-2.5 text-slate-600">{p.responsavel||"—"}</td>
                  <td className="px-3 py-2.5 text-center text-slate-500">{p.revisao||"—"}</td>
                  <td className={"px-3 py-2.5 "+corv}>{txv}</td>
                  <td className="px-3 py-2.5 text-center">{(()=>{const[,lb,ct,bg]=procStatusInfo(procStatusNorm(p));return <span className="text-[11px] px-2 py-0.5 rounded-full font-medium" style={{color:ct,background:bg}}>{lb}</span>;})()}</td>
                  <td className="px-3 py-2.5 text-center">{p.url
                    ? <a href={p.url} target="_blank" rel="noopener" className="inline-flex items-center gap-1 text-xs text-brand hover:underline"><IcLink2/>Drive</a>
                    : <span className="text-xs text-slate-300">—</span>}</td>
                  <td className="px-3 py-2.5"><div className="flex items-center justify-center gap-1.5">
                    {podeEditar&&<button onClick={()=>setForm(p)} className="text-xs px-2 py-1 border border-slate-300 rounded-md text-slate-600 hover:bg-slate-50">Editar</button>}
                    {podeEditar&&<button onClick={()=>excluir(p)} className="text-xs px-2 py-1 border border-slate-300 rounded-md text-red-500 hover:bg-red-50">✕</button>}
                  </div></td>
                </tr>;})}</tbody>
            </table></div>
          </div>))}
      </div>}

    {form&&<ProcedimentoForm proc={form} responsaveis={responsaveis} onClose={()=>setForm(null)} onSalvar={salvar}/>}
    </div>
  </div>;
}

function ProcedimentoForm({proc,responsaveis,onClose,onSalvar}){
  const [nome,setNome]=useState(proc.nome||"");
  const [url,setUrl]=useState(proc.url||"");
  const [pasta,setPasta]=useState(proc.pasta||PROC_PASTAS[0]);
  const [descricao,setDescricao]=useState(proc.descricao||"");
  const [chaves,setChaves]=useState(proc.palavrasChave||[]);
  const [chaveInput,setChaveInput]=useState("");
  const [tipo,setTipo]=useState(proc.tipo||"");
  const [resp,setResp]=useState(proc.responsavel||"");
  const [revisao,setRevisao]=useState(proc.revisao||"");
  const [validade,setValidade]=useState(proc.validade||"");
  const [aprovacao,setAprovacao]=useState(!!proc.precisaAprovacao);
  const [status,setStatus]=useState(procStatusNorm(proc));
  const inp="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 ring-brand/30 bg-white";
  const lab="block text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1";
  const addChave=()=>{const t=chaveInput.trim();if(t&&chaves.length<10&&!chaves.includes(t)){setChaves([...chaves,t]);setChaveInput("");}};
  const salvar=()=>onSalvar({id:proc.id,nome:nome.trim(),url:url.trim(),pasta,descricao:descricao.trim(),palavrasChave:chaves,tipo,responsavel:resp,
    revisao:status==="nao-iniciado"?"":revisao.trim(),validade:status==="nao-iniciado"?"":validade,precisaAprovacao:aprovacao,status});
  return <div onClick={onClose} className="fixed inset-0 z-50 bg-navy/50 grid place-items-center p-4">
    <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col">
      <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
        <h2 className="text-lg font-bold text-navy flex items-center gap-2"><IcPlus/>{proc.id?"Editar procedimento":"Novo procedimento"}</h2>
        <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl">✕</button></div>
      <div className="px-6 py-5 space-y-4 overflow-auto">
        <div><label className={lab}>Nome / Código</label><input autoFocus value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: PO.RH.001 – Admissão de Colaborador" className={inp}/></div>
        <div><label className={lab}>URL (Google Drive)</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://drive.google.com/..." className={inp}/></div>
        <div><label className={lab}>Pasta</label><select value={pasta} onChange={e=>setPasta(e.target.value)} className={inp}>{PROC_PASTAS.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
        <div><label className={lab}>Descrição</label><textarea value={descricao} onChange={e=>setDescricao(e.target.value)} rows="2" placeholder="Breve descrição do procedimento…" className={inp}/></div>
        <div><label className={lab}>Palavras-chave (até 10, Enter para adicionar)</label>
          <input value={chaveInput} onChange={e=>setChaveInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addChave();}}} placeholder="Digite e pressione Enter…" className={inp}/>
          {chaves.length>0&&<div className="flex flex-wrap gap-1.5 mt-2">{chaves.map((c,i)=><span key={i} className="inline-flex items-center gap-1 text-xs bg-brand/10 text-brand px-2 py-1 rounded-full">{c}<button onClick={()=>setChaves(chaves.filter((_,k)=>k!==i))}>✕</button></span>)}</div>}
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className={lab}>Tipo de documento</label><select value={tipo} onChange={e=>setTipo(e.target.value)} className={inp}><option value="">— Selecione —</option>{PROC_TIPOS.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
          <div><label className={lab}>Responsável</label><select value={resp} onChange={e=>setResp(e.target.value)} className={inp}><option value="">— Selecione —</option>{responsaveis.map(r=><option key={r} value={r}>{r}</option>)}</select></div>
        </div>
        <div><label className={lab}>Status do procedimento</label>
          <select value={status} onChange={e=>setStatus(e.target.value)} className={inp}>{PROC_STATUS.map(([id,l])=><option key={id} value={id}>{l}</option>)}</select></div>
        {status!=="nao-iniciado"&&<div className="grid grid-cols-2 gap-3">
          <div><label className={lab}>Revisão</label><input value={revisao} onChange={e=>setRevisao(e.target.value)} placeholder="Ex: REV00, REV01…" className={inp}/></div>
          <div><label className={lab}>Data de validade</label><input type="date" value={validade} onChange={e=>setValidade(e.target.value)} className={inp}/></div>
        </div>}
        {status==="nao-iniciado"&&<p className="text-[11px] text-slate-400">Procedimentos não iniciados não exigem revisão nem data de validade.</p>}
        <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"><input type="checkbox" checked={aprovacao} onChange={e=>setAprovacao(e.target.checked)} className="w-4 h-4 accent-brand"/>Precisa de aprovação</label>
      </div>
      <div className="px-6 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
        <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50">Cancelar</button>
        <button onClick={salvar} disabled={!nome.trim()} className="bg-brand hover:bg-navy text-white text-sm font-semibold px-6 py-2 rounded-lg disabled:opacity-50">Salvar</button>
      </div>
    </div>
  </div>;
}

// ====================== ATIVIDADES — KANBAN DO RH ======================
const ATV_COL="atv_rh";
const ATV_LOG_COL="atv_rh_log";       // log de eventos das tarefas
const ATV_CONTADOR="contadores";      // doc contadores/atv_rh guarda o último número usado
// Gera o próximo ID sequencial (TAR-00001) via transação — nunca reutiliza, mesmo após exclusão
const proximoIdTarefa=async(fb)=>{
  const ref=fb.db.collection(ATV_CONTADOR).doc("atv_rh");
  const num=await fb.db.runTransaction(async tx=>{
    const snap=await tx.get(ref);
    const atual=snap.exists?(Number(snap.data().ultimo)||0):0;
    const novo=atual+1;
    tx.set(ref,{ultimo:novo},{merge:true});
    return novo;
  });
  return "TAR-"+String(num).padStart(5,"0");
};
// Registra um evento no log (criação, status, conclusão, exclusão, edição)
const logarEvento=async(fb,usuario,{tarefaId,codigo,titulo,tipo,detalhe})=>{
  try{ await fb.db.collection(ATV_LOG_COL).add({
    tarefaId:tarefaId||"",codigo:codigo||"",titulo:titulo||"",tipo,detalhe:detalhe||"",
    por:(usuario&&(usuario.displayName||usuario.email))||"?",em:new Date().toISOString()});
  }catch(e){console.error("[log]",e);}
};
const ATV_LOG_TIPOS={criada:["Criada","#16a34a"],status:["Status alterado","#2563eb"],concluida:["Concluída","#16a34a"],reaberta:["Reaberta","#d97706"],editada:["Editada","#7c3aed"],excluida:["Excluída","#dc2626"]};
const ATV_STATUS=[["pendente","Pendente","#2563eb","#e6edfd"],["andamento","Em Andamento","#d97706","#fbf1e0"],["suspensa","Suspensa","#dc2626","#fde8e8"],["validacao","Em Validação","#7c3aed","#f0e9fd"],["concluido","Concluído","#16a34a","#e5f4ea"]];
// normaliza status antigos (afazer/revisao) para os novos
const atvStatusNorm=s=>({afazer:"pendente",revisao:"validacao"}[s]||s||"pendente");
// iniciais e avatar de responsável
const iniciais=nome=>{const p=String(nome||"").trim().split(/\s+/);if(!p[0])return "?";return ((p[0][0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase();};
const corAvatar=nome=>{const cores=["#1a2e8a","#0e7490","#b45309","#7c3aed","#be185d","#15803d","#c2410c"];let h=0;for(const c of String(nome||""))h=(h*31+c.charCodeAt(0))>>>0;return cores[h%cores.length];};
const AvatarTarefa=({nome,size=22})=>nome?<span className="inline-grid place-items-center rounded-full text-white font-semibold shrink-0" style={{width:size,height:size,background:corAvatar(nome),fontSize:size*0.4}} title={nome}>{iniciais(nome)}</span>:<span className="inline-grid place-items-center rounded-full border border-dashed border-slate-300 text-slate-300 shrink-0" style={{width:size,height:size,fontSize:size*0.5}}>+</span>;
const ATV_PRIO={urgente:["Urgente","#dc2626"],alta:["Alta","#ea580c"],media:["Média","#ca8a04"],baixa:["Baixa","#64748b"]};
const atvData=v=>{if(!v)return null;if(v.toDate)return v.toDate();const d=new Date(v);return isNaN(d)?null:d;};
const atvFmt=v=>{const d=atvData(v);return d?d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"—";};
const atvAtrasada=t=>{if(!t||!t.prazo||t.status==="concluido")return false;const d=atvData(t.prazo);if(!d)return false;const h=new Date();h.setHours(0,0,0,0);return d<h;};
const atvIsoHoje=(off=0)=>{const x=new Date();x.setDate(x.getDate()+off);return x.toISOString().slice(0,10);};

function AtividadesView({pessoas,departamentos,procedimentos:procsProp,role,busca,notify,fb,usuario}){
  const [atividades,setAtividades]=useState([]);
  const [procedimentos,setProcedimentos]=useState(procsProp||[]);
  const dbP=fb&&fb.db;
  useEffect(()=>{ if(procsProp)setProcedimentos(procsProp); },[procsProp]);
  useEffect(()=>{
    if(!dbP||procsProp)return;
    const un=dbP.collection(PROC_COL).onSnapshot(s=>setProcedimentos(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error("[proc-atv]",e));
    return ()=>un&&un();
  },[dbP]);
  const [modo,setModo]=useState("kanban");
  const [nova,setNova]=useState(false);
  const [aberta,setAberta]=useState(null);
  const [carregando,setCarregando]=useState(true);
  const [buscaLocal,setBuscaLocal]=useState("");
  const [aba,setAba]=useState("tarefas"); // tarefas | historico
  const [logs,setLogs]=useState([]);
  const podeEditar=role==="RH"||role==="ADMIN";
  const db=fb&&fb.db;

  useEffect(()=>{
    if(!db){setCarregando(false);return;}
    const un=db.collection(ATV_COL).onSnapshot(
      s=>{setAtividades(s.docs.map(d=>{const x={id:d.id,...d.data()};x.status=atvStatusNorm(x.status);return x;}));setCarregando(false);},
      e=>{console.error("[atividades]",e);notify&&notify("Erro ao carregar tarefas: "+(e.message||e));setCarregando(false);}
    );
    return ()=>un&&un();
  },[db]);
  // log de eventos (para a aba Histórico)
  useEffect(()=>{
    if(!db)return;
    const un=db.collection(ATV_LOG_COL).onSnapshot(
      s=>setLogs(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.em||"").localeCompare(a.em||""))),
      e=>console.error("[log-atv]",e));
    return ()=>un&&un();
  },[db]);

  const responsaveis=useMemo(()=>(pessoas||[]).filter(p=>p.status!=="INATIVO"&&p.status!=="DESLIGADO").map(p=>({id:p.id,nome:p.nome})).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR")),[pessoas]);
  const nomeResp=id=>{const r=(pessoas||[]).find(x=>x.id===id);return r?r.nome:"—";};

  const termo=((buscaLocal||busca||"")).trim().toLowerCase();
  const filtradas=useMemo(()=>atividades.filter(t=>!termo||[t.codigo,t.titulo,t.descricao,nomeResp(t.responsavel),...(t.tags||[])].filter(Boolean).join(" ").toLowerCase().includes(termo)),[atividades,termo,responsaveis]);

  const mudarStatus=async(id,status)=>{if(!podeEditar||!db)return;try{
    const tar=atividades.find(t=>t.id===id);
    const campos={status,atualizadoEm:new Date().toISOString()};
    if(status==="concluido")campos.concluidoEm=new Date().toISOString();
    else campos.concluidoEm="";
    await db.collection(ATV_COL).doc(id).update(campos);
    if(tar){const lbl=(ATV_STATUS.find(s=>s[0]===status)||[])[1]||status;
      const tipo=status==="concluido"?"concluida":(tar.status==="concluido"?"reaberta":"status");
      logarEvento(fb,usuario,{tarefaId:id,codigo:tar.codigo,titulo:tar.titulo,tipo,detalhe:"→ "+lbl});}
  }catch(e){notify&&notify("Não foi possível mover: "+(e.message||e));}};
  const excluir=async t=>{if(!podeEditar||!db)return;if(!window.confirm(`Excluir a tarefa "${t.titulo}"?\n\nO identificador ${t.codigo||""} não será reutilizado.`))return;try{
    await db.collection(ATV_COL).doc(t.id).delete();
    logarEvento(fb,usuario,{tarefaId:t.id,codigo:t.codigo,titulo:t.titulo,tipo:"excluida",detalhe:""});
    notify&&notify("Tarefa excluída.");setAberta(null);
  }catch(e){notify&&notify("Erro ao excluir: "+(e.message||e));}};

  const stats={total:filtradas.length,pendente:filtradas.filter(t=>t.status==="pendente").length,andamento:filtradas.filter(t=>t.status==="andamento").length,validacao:filtradas.filter(t=>t.status==="validacao").length,atrasadas:filtradas.filter(atvAtrasada).length,concluidas:filtradas.filter(t=>t.status==="concluido").length};

  return <div className="flex flex-col h-full">
    <header className="px-8 py-6 border-b border-slate-200 bg-white">
      <div className="w-full">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-2.5">
          <span className="w-10 h-10 grid place-items-center rounded-xl bg-brand/10 text-brand"><IcClipboard size={22}/></span>
          <div><h1 className="text-2xl font-bold text-navy">Tarefas</h1>
            <p className="text-sm text-slate-500">Quadro de tarefas do RH</p></div>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex rounded-lg border border-slate-300 overflow-hidden text-sm">
            <button onClick={()=>setModo("tabela")} className={"px-3 py-1.5 flex items-center gap-1.5 "+(modo==="tabela"?"bg-brand text-white":"text-slate-600 hover:bg-slate-50")}><IcTable/>Lista</button>
            <button onClick={()=>setModo("kanban")} className={"px-3 py-1.5 flex items-center gap-1.5 border-l border-slate-300 "+(modo==="kanban"?"bg-brand text-white":"text-slate-600 hover:bg-slate-50")}><IcGrid/>Kanban</button>
            <button onClick={()=>setModo("calendario")} className={"px-3 py-1.5 flex items-center gap-1.5 border-l border-slate-300 "+(modo==="calendario"?"bg-brand text-white":"text-slate-600 hover:bg-slate-50")}><IcCalendar/>Calendário</button>
          </div>
          {podeEditar&&<button onClick={()=>setNova(true)} className="bg-brand hover:bg-navy text-white text-sm font-medium px-4 py-2 rounded-md shadow-sm flex items-center gap-1.5"><IcPlus/>Criar tarefa</button>}
        </div>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mt-4">
        {[["Total",stats.total,"text-navy"],["Pendente",stats.pendente,"text-blue-600"],["Em andamento",stats.andamento,"text-amber-600"],["Em validação",stats.validacao,"text-violet-600"],["Concluídas",stats.concluidas,"text-emerald-600"],["Atrasadas",stats.atrasadas,stats.atrasadas?"text-red-600":"text-navy"]].map(([l,n,c])=>(
          <div key={l} className="bg-white rounded-xl border border-slate-200 shadow-sm px-4 py-3">
            <div className="text-[11px] uppercase tracking-wide text-slate-400">{l}</div>
            <div className={"text-2xl font-bold "+c}>{n}</div></div>))}
      </div>
      {/* abas */}
      <div className="flex gap-1 mt-4 border-b border-slate-200">
        <button onClick={()=>setAba("tarefas")} className={"px-4 py-2 text-sm font-medium border-b-2 -mb-px "+(aba==="tarefas"?"border-brand text-brand":"border-transparent text-slate-500 hover:text-slate-700")}>Tarefas</button>
        <button onClick={()=>setAba("historico")} className={"px-4 py-2 text-sm font-medium border-b-2 -mb-px "+(aba==="historico"?"border-brand text-brand":"border-transparent text-slate-500 hover:text-slate-700")}>Histórico de alterações</button>
      </div>
      </div>
    </header>

    <div className="flex-1 overflow-auto px-8 py-6 bg-slate-50">
      <div className="w-full">
      {aba==="historico"
        ? <AtividadesLog logs={logs}/>
        : <>
          {/* barra de busca própria */}
          <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 shadow-sm mb-4">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" className="text-slate-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input value={buscaLocal} onChange={e=>setBuscaLocal(e.target.value)} placeholder="Buscar por ID, título, responsável ou etiqueta…" className="flex-1 text-sm outline-none bg-transparent"/>
            {buscaLocal&&<button onClick={()=>setBuscaLocal("")} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>}
            <span className="text-[11px] text-slate-400">{filtradas.length} tarefa(s)</span>
          </div>
          {carregando
            ? <div className="text-center text-slate-400 py-16">Carregando tarefas…</div>
            : modo==="kanban"
              ? <AtividadesKanban atividades={filtradas} nomeResp={nomeResp} podeEditar={podeEditar} onMover={mudarStatus} onAbrir={setAberta}/>
              : modo==="calendario"
                ? <AtividadesCalendario atividades={filtradas} nomeResp={nomeResp} onAbrir={setAberta}/>
                : <AtividadesTabela atividades={filtradas} nomeResp={nomeResp} podeEditar={podeEditar} onStatus={mudarStatus} onAbrir={setAberta}/>}
        </>}
      </div>
    </div>

    {nova&&<AtividadeForm responsaveis={responsaveis} departamentos={departamentos} procedimentos={procedimentos} usuario={usuario} db={db} fb={fb} onClose={()=>setNova(false)} notify={notify}/>}
    {aberta&&<AtividadeModal t={atividades.find(x=>x.id===aberta.id)||aberta} responsaveis={responsaveis} nomeResp={nomeResp} procedimentos={procedimentos} podeEditar={podeEditar} db={db} usuario={usuario} onClose={()=>setAberta(null)} onExcluir={excluir} notify={notify}/>}
  </div>;
}

function AtividadesKanban({atividades,nomeResp,podeEditar,onMover,onAbrir}){
  const [dragId,setDragId]=useState(null);
  return <div className="flex gap-4 pb-2">
    {ATV_STATUS.map(([sid,label,cor,bg])=>{
      const cards=atividades.filter(t=>t.status===sid);
      return <div key={sid} onDragOver={e=>podeEditar&&e.preventDefault()} onDrop={()=>{if(dragId){onMover(dragId,sid);setDragId(null);}}}
        className="bg-white rounded-xl border border-slate-200 flex flex-col min-h-[120px] flex-1 min-w-0">
        <div className="px-3 py-2.5 border-b border-slate-100 flex items-center justify-between rounded-t-xl" style={{background:bg}}>
          <span className="text-sm font-semibold" style={{color:cor}}>{label}</span>
          <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-white/70" style={{color:cor}}>{cards.length}</span>
        </div>
        <div className="p-2 space-y-2 flex-1">
          {cards.length===0&&<div className="text-[11px] text-slate-300 text-center py-6">Nenhuma tarefa</div>}
          {cards.map(t=>{const atr=atvAtrasada(t);const pr=ATV_PRIO[t.prioridade]||ATV_PRIO.media;const feitas=(t.subtarefas||[]).filter(s=>s.feita).length;const tot=(t.subtarefas||[]).length;const pct=tot?Math.round(feitas/tot*100):0;
            return <div key={t.id} draggable={podeEditar} onDragStart={()=>setDragId(t.id)} onClick={()=>onAbrir(t)}
              className="border border-slate-200 rounded-lg p-3 bg-white hover:shadow-md cursor-pointer transition-shadow">
              {/* topo: prioridade + atrasada */}
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{color:pr[1],background:pr[1]+"1f"}}>{pr[0]}</span>
                {atr&&<span className="text-[10px] font-semibold text-red-500 flex items-center gap-0.5">⚠ Atrasada</span>}
              </div>
              {/* ID + título */}
              {t.codigo&&<div className="text-[10px] font-mono text-slate-400">{t.codigo}</div>}
              <div className="text-sm font-semibold text-navy leading-snug">{t.titulo}</div>
              {/* departamento */}
              {t.departamento&&<div className="mt-1.5"><span className="text-[10px] font-medium px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 uppercase tracking-wide">{t.departamento}</span></div>}
              {/* tags */}
              {t.tags&&t.tags.length>0&&<div className="flex flex-wrap gap-1 mt-1.5">{t.tags.slice(0,3).map((tg,i)=><span key={i} className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">{tg}</span>)}</div>}
              {/* progresso da checklist */}
              {tot>0&&<div className="mt-2">
                <div className="flex items-center justify-between text-[10px] text-slate-400 mb-0.5"><span>{feitas}/{tot}</span><span>{pct}%</span></div>
                <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full" style={{width:pct+"%",background:pr[1]}}/></div>
              </div>}
              {/* rodapé: responsável + data */}
              <div className="flex items-center justify-between mt-2.5 pt-2 border-t border-slate-50 text-[11px]">
                <span className="flex items-center gap-1.5 text-slate-500 truncate max-w-[62%]">{t.responsavel&&<AvatarTarefa nome={nomeResp(t.responsavel)} size={18}/>}{nomeResp(t.responsavel)}</span>
                <span className={"flex items-center gap-1 "+(atr?"text-red-500 font-semibold":"text-slate-400")}><IcClock/>{atvFmt(t.prazo)}</span>
              </div>
            </div>;})}
        </div>
      </div>;})}
  </div>;
}

function AtividadesTabela({atividades,nomeResp,podeEditar,onStatus,onAbrir}){
  return <div className="bg-white rounded-xl border border-slate-200 overflow-auto">
    <table className="w-full text-sm min-w-[920px]">
      <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <th className="text-left font-semibold px-3 py-2.5">ID</th>
        <th className="text-left font-semibold px-4 py-2.5">Tarefa</th>
        <th className="text-left font-semibold px-3 py-2.5">Responsável</th>
        <th className="text-center font-semibold px-3 py-2.5">Prioridade</th>
        <th className="text-center font-semibold px-3 py-2.5">Necessidade</th>
        <th className="text-center font-semibold px-3 py-2.5">Conclusão</th>
        <th className="text-left font-semibold px-3 py-2.5">Status</th>
        <th className="text-left font-semibold px-3 py-2.5 w-32">Progresso</th></tr></thead>
      <tbody>
        {atividades.length===0&&<tr><td colSpan="8" className="px-4 py-12 text-center text-slate-400">Nenhuma tarefa encontrada.</td></tr>}
        {atividades.map(t=>{const atr=atvAtrasada(t);const pr=ATV_PRIO[t.prioridade]||ATV_PRIO.media;const nm=nomeResp(t.responsavel);
          const feitas=(t.subtarefas||[]).filter(s=>s.feita).length;const tot=(t.subtarefas||[]).length;const pct=tot?Math.round(feitas/tot*100):(t.status==="concluido"?100:0);
          return <tr key={t.id} className="border-t border-slate-100 hover:bg-slate-50">
            <td className="px-3 py-2.5 text-[11px] font-mono text-slate-400 whitespace-nowrap">{t.codigo||"—"}</td>
            <td className="px-4 py-2.5"><button onClick={()=>onAbrir(t)} className="font-medium text-navy hover:text-brand text-left">{t.titulo}</button></td>
            <td className="px-3 py-2.5"><div className="flex items-center gap-2 text-slate-600">{t.responsavel&&<AvatarTarefa nome={nm} size={22}/>}{nm}</div></td>
            <td className="px-3 py-2.5 text-center"><span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{color:pr[1],background:pr[1]+"18"}}>{pr[0]}</span></td>
            <td className={"px-3 py-2.5 text-center "+(atr?"text-red-500 font-semibold":"text-slate-500")}>{atvFmt(t.prazo)}</td>
            <td className="px-3 py-2.5 text-center text-slate-500">{t.concluidoEm?new Date(t.concluidoEm).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"—"}</td>
            <td className="px-3 py-2.5">
              <select value={t.status} disabled={!podeEditar} onChange={e=>onStatus(t.id,e.target.value)}
                className="text-xs border border-slate-300 rounded-md px-2 py-1 bg-white disabled:opacity-60">
                {ATV_STATUS.map(([sid,label])=><option key={sid} value={sid}>{label}</option>)}</select></td>
            <td className="px-3 py-2.5"><div className="flex items-center gap-2"><div className="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full bg-brand" style={{width:pct+"%"}}/></div><span className="text-[10px] text-slate-400 w-8 text-right">{pct}%</span></div></td>
          </tr>;})}
      </tbody>
    </table>
  </div>;
}

function AtividadesLog({logs}){
  const [busca,setBusca]=useState("");
  const termo=busca.trim().toLowerCase();
  const lista=logs.filter(l=>!termo||[l.codigo,l.titulo,l.por,(ATV_LOG_TIPOS[l.tipo]||[])[0]].filter(Boolean).join(" ").toLowerCase().includes(termo));
  return <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
      <div className="text-sm font-semibold text-navy">Histórico de alterações <span className="text-slate-400 font-normal">({logs.length})</span></div>
      <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar no histórico…" className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 outline-none focus:ring-2 ring-brand/30 w-64 max-w-full"/>
    </div>
    <div className="overflow-x-auto"><table className="w-full text-sm min-w-[720px]">
      <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <th className="text-left font-semibold px-4 py-2.5">Quando</th>
        <th className="text-left font-semibold px-3 py-2.5">Evento</th>
        <th className="text-left font-semibold px-3 py-2.5">ID</th>
        <th className="text-left font-semibold px-3 py-2.5">Tarefa</th>
        <th className="text-left font-semibold px-3 py-2.5">Por</th></tr></thead>
      <tbody>
        {lista.length===0&&<tr><td colSpan="5" className="px-4 py-12 text-center text-slate-400">Nenhum registro ainda.</td></tr>}
        {lista.map(l=>{const[lbl,cor]=ATV_LOG_TIPOS[l.tipo]||[l.tipo,"#64748b"];
          return <tr key={l.id} className="border-t border-slate-100 hover:bg-slate-50">
            <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{l.em?new Date(l.em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}</td>
            <td className="px-3 py-2.5"><span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{color:cor,background:cor+"18"}}>{lbl}</span>{l.detalhe&&<span className="text-[11px] text-slate-400 ml-1.5">{l.detalhe}</span>}</td>
            <td className="px-3 py-2.5 text-[11px] font-mono text-slate-400">{l.codigo||"—"}</td>
            <td className="px-3 py-2.5 text-slate-700">{l.titulo||"—"}</td>
            <td className="px-3 py-2.5 text-slate-500">{l.por||"—"}</td>
          </tr>;})}
      </tbody>
    </table></div>
  </div>;
}

function AtividadesCalendario({atividades,nomeResp,onAbrir}){
  const [ref,setRef]=useState(()=>{const d=new Date();return {ano:d.getFullYear(),mes:d.getMonth()};});
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const primeiro=new Date(ref.ano,ref.mes,1);
  const inicioSemana=primeiro.getDay(); // 0=dom
  const diasNoMes=new Date(ref.ano,ref.mes+1,0).getDate();
  // mapeia tarefas por dia (usa prazo = data de necessidade)
  const porDia={};
  atividades.forEach(t=>{const d=atvData(t.prazo);if(d&&d.getFullYear()===ref.ano&&d.getMonth()===ref.mes)(porDia[d.getDate()]=porDia[d.getDate()]||[]).push(t);});
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const celulas=[];
  for(let i=0;i<inicioSemana;i++)celulas.push(null);
  for(let d=1;d<=diasNoMes;d++)celulas.push(d);
  const mover=(delta)=>setRef(r=>{let m=r.mes+delta,a=r.ano;if(m<0){m=11;a--;}if(m>11){m=0;a++;}return {ano:a,mes:m};});
  return <div className="bg-white rounded-xl border border-slate-200 p-4">
    <div className="flex items-center justify-between mb-4">
      <button onClick={()=>mover(-1)} className="w-8 h-8 grid place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50">‹</button>
      <div className="text-lg font-bold text-navy">{meses[ref.mes]} {ref.ano}</div>
      <div className="flex gap-2"><button onClick={()=>setRef({ano:hoje.getFullYear(),mes:hoje.getMonth()})} className="text-xs px-3 py-1.5 border border-slate-200 rounded-md text-slate-500 hover:bg-slate-50">Hoje</button>
      <button onClick={()=>mover(1)} className="w-8 h-8 grid place-items-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-50">›</button></div>
    </div>
    <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold uppercase tracking-wide text-slate-400 mb-1">
      {["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=><div key={d} className="py-1">{d}</div>)}
    </div>
    <div className="grid grid-cols-7 gap-1">
      {celulas.map((d,i)=>{
        if(!d)return <div key={i} className="min-h-[92px] rounded-lg bg-slate-50/50"/>;
        const ehHoje=d===hoje.getDate()&&ref.mes===hoje.getMonth()&&ref.ano===hoje.getFullYear();
        const tarefas=porDia[d]||[];
        return <div key={i} className={"min-h-[92px] rounded-lg border p-1.5 "+(ehHoje?"border-brand bg-brand/5":"border-slate-100")}>
          <div className={"text-xs font-semibold mb-1 "+(ehHoje?"text-brand":"text-slate-400")}>{d}</div>
          <div className="space-y-1">
            {tarefas.slice(0,3).map(t=>{const st=ATV_STATUS.find(s=>s[0]===t.status)||ATV_STATUS[0];
              return <button key={t.id} onClick={()=>onAbrir(t)} className="w-full text-left text-[10px] leading-tight px-1.5 py-1 rounded truncate hover:opacity-80" style={{background:st[3],color:st[2]}} title={t.titulo}>{t.titulo}</button>;})}
            {tarefas.length>3&&<div className="text-[10px] text-slate-400 px-1">+{tarefas.length-3} mais</div>}
          </div>
        </div>;})}
    </div>
  </div>;
}


function AtividadeForm({responsaveis,departamentos,procedimentos,usuario,db,fb,onClose,notify,modo,modeloEdit}){
  const ehModelo=modo==="modelo";
  const base=modeloEdit||{};
  const [nomeModelo,setNomeModelo]=useState(base.nome||"");
  const [titulo,setTitulo]=useState(base.titulo||"");
  const [resp,setResp]=useState(base.responsavel||"");
  const [status,setStatus]=useState(base.status||"afazer");
  const [prio,setPrio]=useState(base.prioridade||"media");
  const [necessidade,setNecessidade]=useState(ehModelo?"":atvIsoHoje(3));
  const [depto,setDepto]=useState(base.departamento||"");
  const [procId,setProcId]=useState(base.procedimentoId||"");
  const [tags,setTags]=useState(base.tags||[]);
  const [tagInput,setTagInput]=useState("");
  const [lembrete,setLembrete]=useState(!!base.lembrete);
  const [checklist,setChecklist]=useState(base.subtarefas?base.subtarefas.map(s=>({titulo:s.titulo,feita:false})):[]);
  const [novoItem,setNovoItem]=useState("");
  const [desc,setDesc]=useState(base.descricao||"");
  const [salvando,setSalvando]=useState(false);
  const [usarModelo,setUsarModelo]=useState(false);
  const [modelosList,setModelosList]=useState([]);
  const inp="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 ring-brand/30 bg-white";
  const lab="block text-[12px] font-semibold text-slate-500 mb-1";
  const deptos=(departamentos||[]).map(d=>d.nome||d.titulo||d).filter(Boolean);
  const procs=(procedimentos||[]).filter(p=>procStatusNorm(p)!=="obsoleto");
  const addTag=()=>{const t=tagInput.trim();if(t&&!tags.includes(t)){setTags([...tags,t]);setTagInput("");}};
  const addItem=()=>{const t=novoItem.trim();if(t){setChecklist([...checklist,{titulo:t,feita:false}]);setNovoItem("");}};

  // aplica um modelo escolhido, preenchendo o formulário
  const aplicarModelo=m=>{
    if(m.titulo)setTitulo(m.titulo);
    if(m.responsavel)setResp(m.responsavel);
    if(m.prioridade)setPrio(m.prioridade);
    if(m.departamento)setDepto(m.departamento);
    if(m.procedimentoId)setProcId(m.procedimentoId);
    setTags(m.tags||[]);
    setChecklist((m.subtarefas||[]).map(s=>({titulo:s.titulo,feita:false})));
    if(m.descricao)setDesc(m.descricao);
    setUsarModelo(false);
    notify&&notify(`Modelo "${m.nome}" aplicado.`);
  };
  const abrirModelos=async()=>{
    if(!db)return;
    try{const s=await db.collection(MODELO_COL).get();setModelosList(s.docs.map(d=>({id:d.id,...d.data()})));setUsarModelo(true);}
    catch(e){notify&&notify("Erro ao carregar modelos: "+(e.message||e));}
  };

  const dadosComuns=()=>{
    const proc=procs.find(p=>p.id===procId);
    return {responsavel:resp,prioridade:prio,departamento:depto||"",
      procedimentoId:procId||"",procedimentoNome:proc?proc.nome:"",
      tags,subtarefas:checklist,descricao:desc,titulo:titulo.trim()};
  };
  const salvarTarefa=async()=>{
    if(!titulo.trim()||!db)return;
    setSalvando(true);
    try{
      const codigo=fb?await proximoIdTarefa(fb):"";
      const ref=await db.collection(ATV_COL).add({...dadosComuns(),codigo,area:"rh",status,
        prazo:necessidade||"",lembrete,
        criadoPor:(usuario&&usuario.email)||"?",criadoEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
      if(fb)logarEvento(fb,usuario,{tarefaId:ref.id,codigo,titulo:titulo.trim(),tipo:"criada",detalhe:""});
      notify&&notify("Tarefa criada"+(codigo?" ("+codigo+")":"")+".");onClose();
    }catch(e){notify&&notify("Erro ao criar: "+(e.message||e));setSalvando(false);}
  };
  const salvarModelo=async(fechar)=>{
    if(!db)return;
    const nome=(nomeModelo||titulo||"").trim();
    if(!nome){notify&&notify("Dê um nome ao modelo.");return;}
    setSalvando(true);
    try{
      const payload={...dadosComuns(),nome,prioridade:prio,atualizadoEm:new Date().toISOString(),por:(usuario&&usuario.email)||"?"};
      if(modeloEdit&&modeloEdit.id) await db.collection(MODELO_COL).doc(modeloEdit.id).set(payload,{merge:true});
      else await db.collection(MODELO_COL).add({...payload,criadoEm:new Date().toISOString()});
      notify&&notify("Modelo salvo.");
      if(fechar)onClose(); else setSalvando(false);
    }catch(e){notify&&notify("Erro ao salvar modelo: "+(e.message||e));setSalvando(false);}
  };

  return <div onClick={onClose} className="fixed inset-0 z-50 bg-navy/50 grid place-items-center p-4">
    <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col">
      <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
        <h2 className="text-xl font-bold text-navy">{ehModelo?(modeloEdit?"Editar modelo":"Novo modelo"):"Nova Tarefa"}</h2>
        <button onClick={onClose} className="w-8 h-8 grid place-items-center rounded-full border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-50">✕</button>
      </div>

      <div className="px-6 py-5 space-y-5 overflow-auto">
        {/* Usar modelo (só ao criar tarefa) */}
        {!ehModelo&&<div className="relative">
          <button onClick={abrirModelos} className="inline-flex items-center gap-2 text-sm border border-slate-300 rounded-lg px-3 py-1.5 text-slate-600 hover:bg-slate-50"><IcBookmark/>Usar modelo</button>
          {usarModelo&&<div className="absolute z-10 mt-1 w-72 bg-white border border-slate-200 rounded-lg shadow-xl max-h-64 overflow-auto">
            {modelosList.length===0&&<div className="px-3 py-4 text-sm text-slate-400 text-center">Nenhum modelo cadastrado.</div>}
            {modelosList.map(m=><button key={m.id} onClick={()=>aplicarModelo(m)} className="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 border-b border-slate-50 last:border-0">
              <div className="font-medium text-navy">{m.nome}</div>
              <div className="text-[11px] text-slate-400">{(m.subtarefas||[]).length} item(ns){m.departamento?" · "+m.departamento:""}</div></button>)}
            <button onClick={()=>setUsarModelo(false)} className="w-full text-center px-3 py-1.5 text-xs text-slate-400 hover:bg-slate-50">Fechar</button>
          </div>}
        </div>}

        {/* Nome do modelo (só no modo modelo) */}
        {ehModelo&&<div><label className={lab}>Nome do modelo *</label>
          <input autoFocus value={nomeModelo} onChange={e=>setNomeModelo(e.target.value)} placeholder="Ex: Admissão de colaborador" className={inp}/></div>}

        <input value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder={ehModelo?"Título padrão da tarefa (opcional)":"Nome da tarefa..."} className="w-full text-base border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 ring-brand/30"/>

        <div className="grid sm:grid-cols-2 gap-4">
          <div><label className={lab}>Responsável</label>
            <select value={resp} onChange={e=>setResp(e.target.value)} className={inp}>
              <option value="">Sem responsável</option>
              {responsaveis.map(r=><option key={r.id} value={r.id}>{r.nome}</option>)}
            </select></div>
          {!ehModelo&&<div><label className={lab}>Data de necessidade</label>
            <input type="date" value={necessidade} onChange={e=>setNecessidade(e.target.value)} className={inp} title="Quando a tarefa precisa estar concluída"/>
            <p className="text-[10px] text-slate-400 mt-1">Quando a tarefa precisa estar pronta.</p></div>}
        </div>

        <div className="grid sm:grid-cols-2 gap-4">
          <div><label className={lab}>Prioridade</label>
            <select value={prio} onChange={e=>setPrio(e.target.value)} className={inp}>{Object.keys(ATV_PRIO).map(k=><option key={k} value={k}>{ATV_PRIO[k][0]}</option>)}</select></div>
          {!ehModelo&&<div><label className={lab}>Status inicial</label>
            <select value={status} onChange={e=>setStatus(e.target.value)} className={inp}>{ATV_STATUS.map(([s,l])=><option key={s} value={s}>{l}</option>)}</select></div>}
        </div>

        <div className="grid sm:grid-cols-2 gap-4">
          <div><label className={lab}>Departamento</label>
            <select value={depto} onChange={e=>setDepto(e.target.value)} className={inp}>
              <option value="">— Nenhum —</option>
              {deptos.map(d=><option key={d} value={d}>{d}</option>)}
            </select></div>
          <div><label className={lab}>Procedimento vinculado</label>
            <select value={procId} onChange={e=>setProcId(e.target.value)} className={inp}>
              <option value="">— Nenhum —</option>
              {procs.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
            </select></div>
        </div>

        <div><label className={lab}>Etiquetas</label>
          <input value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addTag();}}} placeholder="Digite uma etiqueta e pressione Enter" className={inp}/>
          {tags.length>0&&<div className="flex flex-wrap gap-1.5 mt-2">
            {tags.map((t,i)=><span key={i} className="inline-flex items-center gap-1 text-xs bg-brand/10 text-brand px-2 py-1 rounded-full">{t}
              <button onClick={()=>setTags(tags.filter((_,k)=>k!==i))} className="hover:text-navy">✕</button></span>)}
          </div>}
        </div>

        {!ehModelo&&<label className="flex items-center gap-3 cursor-pointer select-none">
          <button type="button" onClick={()=>setLembrete(!lembrete)} className={"relative w-10 h-5 rounded-full transition-colors "+(lembrete?"bg-brand":"bg-slate-300")}>
            <span className={"absolute top-0.5 w-4 h-4 bg-white rounded-full transition-all "+(lembrete?"left-5":"left-0.5")}/></button>
          <span className="text-sm text-slate-600">Lembre-me desta tarefa</span>
        </label>}

        {/* Lista de verificação */}
        <div className="border border-slate-200 rounded-xl p-4">
          <div className="text-sm font-semibold text-navy mb-2">Lista de verificação {checklist.length>0&&<span className="text-slate-300 font-normal">· {checklist.length} item(ns)</span>}</div>
          {checklist.length===0&&<div className="text-xs text-slate-400 text-center py-3">Sem itens na lista. Adicione novos itens abaixo.</div>}
          <div className="space-y-1.5">
            {checklist.map((it,i)=>ehModelo?<div key={i} className="flex items-center gap-2 group">
              <div className="flex flex-col shrink-0">
                <button type="button" onClick={()=>{if(i>0){const c=[...checklist];[c[i-1],c[i]]=[c[i],c[i-1]];setChecklist(c);}}} disabled={i===0} className="w-5 h-3.5 grid place-items-center text-slate-400 hover:text-brand disabled:opacity-20 text-[10px]" title="Subir">▲</button>
                <button type="button" onClick={()=>{if(i<checklist.length-1){const c=[...checklist];[c[i+1],c[i]]=[c[i],c[i+1]];setChecklist(c);}}} disabled={i===checklist.length-1} className="w-5 h-3.5 grid place-items-center text-slate-400 hover:text-brand disabled:opacity-20 text-[10px]" title="Descer">▼</button>
              </div>
              <span className="w-4 h-4 rounded border border-slate-300 shrink-0"/>
              <input value={it.titulo} onChange={e=>setChecklist(checklist.map((x,k)=>k===i?{...x,titulo:e.target.value}:x))} className="text-sm flex-1 text-slate-700 bg-transparent border border-transparent hover:border-slate-200 focus:border-brand rounded px-1.5 py-1 outline-none"/>
              <button onClick={()=>setChecklist(checklist.filter((_,k)=>k!==i))} className="text-slate-300 hover:text-red-500 text-xs shrink-0">✕</button>
            </div>:<div key={i} className="flex items-center gap-2">
              <span className="w-4 h-4 rounded border border-slate-300 shrink-0"/>
              <span className="text-sm flex-1 text-slate-700">{it.titulo}</span>
              <button onClick={()=>setChecklist(checklist.filter((_,k)=>k!==i))} className="text-slate-300 hover:text-red-500 text-xs shrink-0">✕</button>
            </div>)}
          </div>
          <div className="flex gap-2 mt-3">
            <input value={novoItem} onChange={e=>setNovoItem(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addItem();}}} placeholder="Adicionar novo item..." className="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-2"/>
            <button onClick={addItem} className="px-4 py-2 text-sm bg-brand/10 text-brand rounded-lg hover:bg-brand/20 font-medium flex items-center gap-1"><IcPlus/>Adicionar</button>
          </div>
        </div>

        <div><label className={lab}>Observações</label>
          <RichText value={desc} onChange={setDesc} placeholder="Detalhes da tarefa… (use os botões para negrito, listas, alinhamento e links)"/></div>
      </div>

      {/* Rodapé */}
      <div className="px-6 py-4 border-t border-slate-200 flex justify-between items-center gap-2 shrink-0">
        <div>{!ehModelo&&<button onClick={()=>salvarModelo(false)} className="text-sm text-slate-600 border border-slate-300 rounded-lg px-4 py-2 hover:bg-slate-50 flex items-center gap-1.5"><IcBookmark/>Salvar como modelo</button>}</div>
        <div className="flex gap-2">
          <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50">Cancelar</button>
          {ehModelo
            ? <button onClick={()=>salvarModelo(true)} disabled={!(nomeModelo||titulo).trim()||salvando} className="bg-brand hover:bg-navy text-white text-sm font-semibold px-6 py-2 rounded-lg disabled:opacity-50">{salvando?"Salvando…":"Salvar modelo"}</button>
            : <button onClick={salvarTarefa} disabled={!titulo.trim()||salvando} className="bg-brand hover:bg-navy text-white text-sm font-semibold px-6 py-2 rounded-lg disabled:opacity-50 flex items-center gap-1.5"><IcPlus/>{salvando?"Criando…":"Criar Tarefa"}</button>}
        </div>
      </div>
    </div>
  </div>;
}


function AtividadeModal({t,responsaveis,nomeResp,procedimentos,podeEditar,db,usuario,onClose,onExcluir,notify}){
  const [nova,setNova]=useState("");
  if(!t)return null;
  const upd=async campos=>{if(!podeEditar||!db)return;try{await db.collection(ATV_COL).doc(t.id).update({...campos,atualizadoEm:new Date().toISOString()});}catch(e){notify&&notify("Erro ao salvar: "+(e.message||e));}};
  const subs=t.subtarefas||[];
  const toggleSub=i=>upd({subtarefas:subs.map((s,k)=>k===i?{...s,feita:!s.feita}:s)});
  const setSub=(i,campos)=>upd({subtarefas:subs.map((s,k)=>k===i?{...s,...campos}:s)});
  const addSub=()=>{if(nova.trim()){upd({subtarefas:[...subs,{titulo:nova.trim(),feita:false,data:"",observacao:"",responsavel:""}]});setNova("");}};
  const delSub=i=>upd({subtarefas:subs.filter((_,k)=>k!==i)});
  const pr=ATV_PRIO[t.prioridade]||ATV_PRIO.media;
  const inp="text-sm border border-slate-300 rounded-md px-2 py-1 bg-white";
  return <div onClick={onClose} className="fixed inset-0 z-50 bg-navy/50 grid place-items-center p-4">
    <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[88vh] flex flex-col">
      <div className="p-5 border-b border-slate-200 flex items-start justify-between gap-3">
        <div className="flex-1">
          {t.codigo&&<div className="text-[11px] font-mono text-slate-400 mb-0.5">{t.codigo}</div>}
          {podeEditar
            ? <input value={t.titulo} onChange={e=>upd({titulo:e.target.value})} className="text-lg font-bold text-navy w-full border-none outline-none focus:bg-slate-50 rounded px-1 -ml-1"/>
            : <h2 className="text-lg font-bold text-navy">{t.titulo}</h2>}
        </div>
        <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl shrink-0">✕</button>
      </div>
      <div className="p-5 space-y-4 overflow-auto">
        <div className="grid grid-cols-2 gap-3">
          <div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Responsável</div>
            {podeEditar?<select value={t.responsavel} onChange={e=>upd({responsavel:e.target.value})} className={inp+" w-full"}>{responsaveis.map(r=><option key={r.id} value={r.id}>{r.nome}</option>)}</select>:<div className="text-sm text-slate-700">{nomeResp(t.responsavel)}</div>}</div>
          <div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Data de necessidade</div>
            {podeEditar?<input type="date" value={String(t.prazo||"").slice(0,10)||atvIsoHoje()} onChange={e=>upd({prazo:e.target.value})} className={inp+" w-full"}/>:<div className={"text-sm "+(atvAtrasada(t)?"text-red-500 font-semibold":"text-slate-700")}>{atvFmt(t.prazo)}</div>}</div>
          <div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Prioridade</div>
            {podeEditar?<select value={t.prioridade} onChange={e=>upd({prioridade:e.target.value})} className={inp+" w-full"}>{Object.keys(ATV_PRIO).map(k=><option key={k} value={k}>{ATV_PRIO[k][0]}</option>)}</select>:<span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{color:pr[1],background:pr[1]+"18"}}>{pr[0]}</span>}</div>
          <div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Status</div>
            {podeEditar?<select value={t.status} onChange={e=>upd({status:e.target.value})} className={inp+" w-full"}>{ATV_STATUS.map(([s,l])=><option key={s} value={s}>{l}</option>)}</select>:<div className="text-sm text-slate-700">{(ATV_STATUS.find(s=>s[0]===t.status)||[])[1]}</div>}</div>
        </div>
        {(t.departamento||t.tags&&t.tags.length>0)&&<div className="flex flex-wrap items-center gap-2">
          {t.departamento&&<span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">{t.departamento}</span>}
          {(t.tags||[]).map((tg,i)=><span key={i} className="text-xs bg-brand/10 text-brand px-2 py-0.5 rounded-full">{tg}</span>)}
        </div>}
        {t.procedimentoNome&&<div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Procedimento vinculado</div>
          {(()=>{const p=(procedimentos||[]).find(x=>x.id===t.procedimentoId);
            return <div className="flex items-center gap-2 text-sm">
              <span className="inline-flex items-center gap-1.5 bg-brand/10 text-brand px-2.5 py-1 rounded-md"><IcDoc/>{t.procedimentoNome}</span>
              {p&&p.url&&<a href={p.url} target="_blank" rel="noopener" className="text-brand hover:underline text-xs flex items-center gap-1"><IcLink2/>Abrir no Drive</a>}
            </div>;})()}</div>}
        {(t.descricao||podeEditar)&&<div><div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1">Observações</div>
          {podeEditar?<RichText value={t.descricao||""} onChange={v=>upd({descricao:v})} placeholder="Detalhes da tarefa…"/>:<div className="rt-view text-sm text-slate-700" dangerouslySetInnerHTML={{__html:htmlSeguro(t.descricao)}}/>}</div>}
        {/* datas de rastreio */}
        <div className="flex flex-wrap gap-4 text-[11px] text-slate-400">
          <span>Criada em: <b className="text-slate-600">{t.criadoEm?new Date(t.criadoEm).toLocaleDateString("pt-BR"):"—"}</b></span>
          {t.status==="concluido"&&<span>Concluída em: <b className="text-emerald-600">{t.concluidoEm?new Date(t.concluidoEm).toLocaleDateString("pt-BR"):"—"}</b></span>}
        </div>
        <div>
          <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">Subtarefas / checklist {subs.length>0&&<span className="text-slate-300">· {subs.filter(s=>s.feita).length}/{subs.length}</span>}</div>
          <div className="space-y-2">
            {subs.map((s,i)=><div key={i} className="border border-slate-200 rounded-lg p-2.5">
              <div className="flex items-start gap-2">

}

const AV_COR={slate:"bg-slate-100 text-slate-600 ring-slate-200",sky:"bg-sky-50 text-sky-700 ring-sky-200",red:"bg-red-50 text-red-600 ring-red-200",
  amber:"bg-amber-50 text-amber-700 ring-amber-200",violet:"bg-violet-50 text-violet-700 ring-violet-200",indigo:"bg-indigo-50 text-indigo-700 ring-indigo-200",
  emerald:"bg-emerald-50 text-emerald-700 ring-emerald-200"};
const AvStatus=({s})=>{ const st=AVAL.STATUS[s]||AVAL.STATUS.nao_iniciada;
  return <span className={"inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 whitespace-nowrap "+AV_COR[st.cor]}>{st.rot}</span>; };
const CICLO_ROT={rascunho:"Rascunho",programado:"Programado",aberto:"Aberto",em_andamento:"Em andamento",em_fechamento:"Em fechamento",concluido:"Concluído",cancelado:"Cancelado"};
const fmtDH=iso=>{ if(!iso) return "—"; const d=iso.toDate?iso.toDate():new Date(iso); if(isNaN(d)) return "—";
  return d.toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"})+" às "+d.toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit"}); };
const fmtD=iso=>{ if(!iso) return "—"; if(/^\d{4}-\d{2}-\d{2}$/.test(iso)) return brDate(iso); const d=new Date(iso); return isNaN(d)?"—":d.toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"}); };
const diasRestantes=iso=>{ if(!iso) return null; return Math.ceil((new Date(iso)-new Date())/864e5); };
// fim do dia (Brasília) de uma data AAAA-MM-DD
const fimDoDiaSP=d=>d?new Date(`${d}T23:59:59-03:00`).toISOString():null;
const GRUPOS_KPI=[
  ["auto","Aguardando autoavaliação",["nao_iniciada","aguardando_auto","auto_andamento","auto_expirada"]],
  ["gestor","Aguardando avaliação do gestor",["auto_enviada","aguardando_gestor","gestor_andamento"]],
  ["calib","Em calibração",["aguardando_calibracao","em_calibracao","calibrada"]],
  ["feedback","Aguardando feedback",["aguardando_feedback"]],
  ["concl","Concluídas",["concluida"]],
];
const prazoAtual=av=>{ const e=av.etapas; for(const k of ["auto","gestor","calibracao","feedback","conclusao"]){
    if(["pendente","liberada","em_andamento","em_calibracao"].includes(e[k].estado)&&!(k==="auto"&&e[k].estado==="pendente")) return e[k].prazo; }
  return null; };
const resultadoDe=av=>(av.conclusao&&av.conclusao.resultado)||av.resultadoFinal||null;

// ---------- camada de dados (Firestore) ----------
const avalDB=(fb)=>{
  const FV=()=>window.firebase.firestore.FieldValue, TS=d=>window.firebase.firestore.Timestamp.fromDate(new Date(d));
  const db=fb.db;
  const refAv=id=>db.collection("avaliacoes").doc(id);
  const gravarHistorico=(batch,avId,eventos)=>eventos.forEach(ev=>batch.set(refAv(avId).collection("historico").doc(),{...ev,em:FV().serverTimestamp(),emCliente:ev.em}));
  const lerPrivado=async avId=>{ const d=await refAv(avId).collection("privado").doc("acesso").get(); return d.exists?d.data():null; };
  // executa uma ação do motor e grava avaliação + privado + histórico numa só operação
  const executar=async(av,acao,dados,ator,ciclo,extra)=>{
    const agora=new Date().toISOString();
    const {av:novo,eventos,privado}=AVAL.aplicarAcao(av,acao,dados,ator,agora,ciclo);
    const batch=db.batch();
    const semId=Object.fromEntries(Object.entries(novo).filter(([k])=>k!=="id"&&!k.startsWith("_"))); batch.set(refAv(av.id),semId);
    if(privado) batch.set(refAv(av.id).collection("privado").doc("acesso"),privado);
    gravarHistorico(batch,av.id,eventos);
    if(extra) extra(batch,novo,privado);
    await batch.commit(); return novo;
  };
  return {
    executar,lerPrivado,
    salvarCiclo:async(ciclo,ator,acao)=>{ const {id,...d}=ciclo; const batch=db.batch();
      batch.set(db.collection("aval_ciclos").doc(id),d);
      batch.set(db.collection("aval_ciclos").doc(id).collection("historico").doc(),{acao,ator,em:FV().serverTimestamp(),emCliente:new Date().toISOString()});
      await batch.commit(); },
    incluir:async(ciclo,itens,ator)=>{ // itens: [{pessoa,cargo,template,gestor}]
      const agora=new Date().toISOString(); let n=0;
      for(let i=0;i<itens.length;i+=150){ const batch=db.batch();
        itens.slice(i,i+150).forEach(it=>{ const av=AVAL.novaAvaliacao({...it,ciclo,agora}); av.status=AVAL.derivarStatus(av,agora);
          const {id,...d}=av; batch.set(refAv(id),d);
          batch.set(refAv(id).collection("historico").doc(),{acao:"incluida",etapa:null,ator,para:av.snapshot.template.id,em:FV().serverTimestamp(),emCliente:agora});
          batch.set(db.collection("aval_templates").doc(it.template.id),{...JSON.parse(JSON.stringify(it.template)),emUso:true},{merge:true}); n++; });
        await batch.commit(); }
      return n; },
    gerarAcesso:async(av,ator,ciclo,dias)=>{
      const token=AVAL.gerarToken(), codigo=AVAL.gerarCodigo();
      const [capaId,conteudoId]=await Promise.all([AVAL.idCapa(token),AVAL.idConteudo(token,codigo)]);
      const liberadoEm=new Date().toISOString(), expiraEm=AVAL.prazoAcesso(liberadoEm,dias);
      const docs=AVAL.montarDocsAcesso(av,{liberadoEm,expiraEm,mensagem:ciclo&&ciclo.mensagemBoasVindas});
      return executar(av,"gerarAcesso",{acesso:{token,codigo,capaId,conteudoId,liberadoEm,expiraEm}},ator,ciclo,(b)=>{
        b.set(db.collection("aval_links").doc(capaId),{...docs.capa,expiraEm:TS(expiraEm)});
        b.set(db.collection("aval_acessos").doc(conteudoId),{...docs.conteudo,expiraEm:TS(expiraEm),liberadoEm:TS(liberadoEm)}); }); },
    prorrogar:async(av,novoPrazo,motivo,ator,ciclo)=>{ const p=await lerPrivado(av.id);
      return executar(av,"prorrogar",{novoPrazo,motivo},ator,ciclo,(b)=>{ if(!p) return;
        b.update(db.collection("aval_links").doc(p.capaId),{expiraEm:TS(novoPrazo)});
        b.update(db.collection("aval_acessos").doc(p.conteudoId),{expiraEm:TS(novoPrazo)}); }); },
    novoAcesso:async(av,motivo,ator,ciclo,dias)=>{ const p=await lerPrivado(av.id);
      const antigo=p?await db.collection("aval_acessos").doc(p.conteudoId).get():null; const ant=antigo&&antigo.exists?antigo.data():{};
      const token=AVAL.gerarToken(), codigo=AVAL.gerarCodigo();
      const [capaId,conteudoId]=await Promise.all([AVAL.idCapa(token),AVAL.idConteudo(token,codigo)]);
      const liberadoEm=new Date().toISOString(), expiraEm=AVAL.prazoAcesso(liberadoEm,dias);
      const docs=AVAL.montarDocsAcesso(av,{liberadoEm,expiraEm,respostas:ant.respostas,fechamento:ant.fechamento,mensagem:ciclo&&ciclo.mensagemBoasVindas});
      return executar(av,"novoAcesso",{motivo,privadoAtual:p,acesso:{token,codigo,capaId,conteudoId,liberadoEm,expiraEm}},ator,ciclo,(b)=>{
        b.set(db.collection("aval_links").doc(capaId),{...docs.capa,expiraEm:TS(expiraEm)});
        b.set(db.collection("aval_acessos").doc(conteudoId),{...docs.conteudo,estado:ant.estado==="em_andamento"?"em_andamento":"liberada",salvoEm:ant.salvoEm||null,expiraEm:TS(expiraEm),liberadoEm:TS(liberadoEm)});
        if(p){ b.delete(db.collection("aval_links").doc(p.capaId)); b.delete(db.collection("aval_acessos").doc(p.conteudoId)); } }); },
    // lê o documento externo e espelha o andamento (em andamento / enviada) no documento interno
    lerExterno:async av=>{ const p=await lerPrivado(av.id); if(!p) return null; const d=await db.collection("aval_acessos").doc(p.conteudoId).get();
      if(!d.exists) return null; const x=d.data(); const ts=v=>v&&v.toDate?v.toDate().toISOString():v;
      return {...x,salvoEm:ts(x.salvoEm),enviadoEm:ts(x.enviadoEm),expiraEm:ts(x.expiraEm),liberadoEm:ts(x.liberadoEm)}; },
    sincronizar:async(av,ator,ciclo,externo)=>{
      if(!externo||!["liberada","em_andamento"].includes(av.etapas.auto.estado)) return av;
      const mudou=(externo.estado==="em_andamento"&&av.etapas.auto.estado==="liberada")||externo.estado==="enviada";
      return mudou?executar(av,"sincronizarAuto",{externo},{tipo:"sistema",email:"",nome:"Sistema"},ciclo):av; },
    encerrarAuto:async(av,motivo,ator,ciclo)=>{ const p=await lerPrivado(av.id);
      const ext=p?await db.collection("aval_acessos").doc(p.conteudoId).get():null; const x=ext&&ext.exists?ext.data():{};
      return executar(av,"encerrarAuto",{motivo,externo:x},ator,ciclo,(b)=>{ if(p&&ext&&ext.exists){ b.update(db.collection("aval_acessos").doc(p.conteudoId),{revogado:true}); b.update(db.collection("aval_links").doc(p.capaId),{revogado:true}); } }); },
    excluir:async(av,motivo,ator,pessoa)=>{
      const p=await lerPrivado(av.id).catch(()=>null);
      const hist=await refAv(av.id).collection("historico").get().catch(()=>({docs:[]}));
      const batch=db.batch();
      hist.docs.forEach(d=>batch.delete(d.ref||refAv(av.id).collection("historico").doc(d.id)));
      batch.delete(refAv(av.id).collection("privado").doc("acesso"));
      if(p){ if(p.capaId) batch.delete(db.collection("aval_links").doc(p.capaId)); if(p.conteudoId) batch.delete(db.collection("aval_acessos").doc(p.conteudoId)); }
      if(av.pdiId) batch.delete(db.collection("pdis").doc(av.pdiId));
      const pd=await db.collection("pessoas").doc(av.pessoaId).get().catch(()=>null); const pAtual=(pd&&pd.exists&&pd.data())||pessoa;
      if(pAtual&&pAtual.ultimaAvaliacaoRef&&pAtual.ultimaAvaliacaoRef.avaliacaoId===av.id) batch.set(db.collection("pessoas").doc(av.pessoaId),{ultimaAvaliacao:null,ultimaAvaliacaoRef:null},{merge:true});
      batch.delete(refAv(av.id));
      batch.set(db.collection("aval_ciclos").doc(av.cicloId).collection("historico").doc(),{acao:"avaliacao_excluida",ator,justificativa:motivo,
        pessoa:av.snapshot.contexto.pessoa.nome,statusNaExclusao:AVAL.derivarStatus(av,new Date().toISOString()),pdiExcluido:av.pdiId||null,em:FV().serverTimestamp(),emCliente:new Date().toISOString()});
      await batch.commit(); },
    revogarExternos:async av=>{ const p=await lerPrivado(av.id); if(!p) return; const b=db.batch();
      b.update(db.collection("aval_links").doc(p.capaId),{revogado:true}); b.update(db.collection("aval_acessos").doc(p.conteudoId),{revogado:true}); await b.commit(); },
  };
};

function AvIncluir({ciclo,pessoas,cargos,avaliacoes,onClose,onIncluir}){

    const gestor=pessoas.find(x=>x.nome===(p.vinculo&&p.vinculo.lider));
    const template=AVAL.templateDoCargo(cargo,cargos);
    const avisos=[]; if(!cargo) avisos.push("Cargo não encontrado no cadastro de cargos");
    if(template&&cargo) avisos.push(...AVAL.validarTemplate(template,(cargo.avaliacao||{}).criteriosResultado||[]));
    if(!gestor) avisos.push("Gestor (superior direto) não cadastrado"); else if(!gestor.email) avisos.push("Gestor sem e-mail na ficha");
    return {p,cargo,gestor,template,avisos,ja:jaTem.has(p.id)}; });
  const deps=[...new Set(ativos.map(p=>p.vinculo&&p.vinculo.setor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const vis=linhas.filter(l=>(!dep||(l.p.vinculo&&l.p.vinculo.setor)===dep)&&(!q||l.p.nome.toLowerCase().includes(q.toLowerCase())));
  const tog=id=>setSel(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const [busy,setBusy]=useState(false);
  const ok=async()=>{ setBusy(true); try{ await onIncluir(linhas.filter(l=>sel.has(l.p.id)&&!l.ja).map(l=>({pessoa:l.p,cargo:l.cargo,template:l.template,gestor:l.gestor}))); onClose(); }finally{ setBusy(false); } };

    <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[88vh] flex flex-col">

        <select value={dep} onChange={e=>setDep(e.target.value)} className="text-sm border border-slate-300 rounded-md px-2 py-1.5 bg-white"><option value="">Todos os departamentos</option>{deps.map(d=><option key={d}>{d}</option>)}</select>
        <button onClick={()=>setSel(new Set(vis.filter(l=>!l.ja).map(l=>l.p.id)))} className="text-sm px-3 py-1.5 border border-slate-300 rounded-md hover:bg-slate-50">Selecionar visíveis</button>
      </div>
      <div className="overflow-y-auto flex-1 divide-y divide-slate-100">
        {vis.map(l=><label key={l.p.id} className={"flex items-start gap-3 px-5 py-2.5 "+(l.ja?"opacity-50":"hover:bg-slate-50 cursor-pointer")}>
          <input type="checkbox" disabled={l.ja} checked={sel.has(l.p.id)} onChange={()=>tog(l.p.id)} className="mt-2 accent-brand"/>
          <Avatar nome={l.p.nome} status={l.p.status} foto={l.p.foto} pessoaId={l.p.id} fotoLocal={l.p.fotoLocal}/>
          <div className="flex-1 min-w-0"><div className="text-sm font-medium text-navy">{l.p.nome}{l.ja&&<span className="ml-2 text-[11px] text-slate-400">já incluído</span>}</div>
            <div className="text-xs text-slate-500">{(l.p.vinculo&&l.p.vinculo.cargo)||"—"} · gestor: {(l.p.vinculo&&l.p.vinculo.lider)||"—"}</div>
            {l.avisos.map((a,i)=><div key={i} className="text-[11px] text-amber-700">⚠ {a}</div>)}</div>
          <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 whitespace-nowrap mt-1">{l.template?l.template.nome:"—"}</span>
        </label>)}
        {!vis.length&&<div className="p-8 text-center text-sm text-slate-400">Nenhum colaborador encontrado.</div>}
      </div>
      <div className="px-5 py-3 border-t border-slate-200 flex items-center gap-2">
        <span className="text-xs text-slate-500 flex-1">Avisos não impedem a inclusão. Enquanto o acesso não for gerado, é possível atualizar a estrutura da avaliação.</span>
        <button onClick={onClose} className="px-4 py-2 text-sm text-slate-500">Cancelar</button>

function AvMenu({itens,onPick}){
  const [pos,setPos]=useState(null); const btnRef=useRef(null), boxRef=useRef(null);

    // altura real + folga (o último item tem separador)
    const alt=Math.min(itens.length*34+48,window.innerHeight-24);
    const abaixo=window.innerHeight-r.bottom;
    const cima=abaixo<alt+12&&r.top>abaixo;
    setPos({right:Math.max(8,window.innerWidth-r.right),...(cima?{bottom:window.innerHeight-r.top+4}:{top:r.bottom+4}),maxHeight:Math.max(160,(cima?r.top:abaixo)-12)}); };
  useEffect(()=>{ if(!pos) return;
    const fora=e=>{ if(boxRef.current&&!boxRef.current.contains(e.target)&&btnRef.current&&!btnRef.current.contains(e.target)) setPos(null); };
    const fechar=()=>setPos(null);
    document.addEventListener("mousedown",fora); window.addEventListener("resize",fechar); document.addEventListener("scroll",fechar,true);
    return ()=>{ document.removeEventListener("mousedown",fora); window.removeEventListener("resize",fechar); document.removeEventListener("scroll",fechar,true); }; },[pos]);
  return <div className="inline-block">

      {itens.map(([k,r])=><button key={k} onClick={()=>{setPos(null);onPick(k);}} className={"w-full text-left px-3 py-1.5 text-sm hover:bg-slate-50 "+(k==="cancelar"||k==="excluir"?"text-red-600":"text-slate-700")+(k==="excluir"?" border-t border-slate-100 mt-1 pt-2":"")}>{r}</button>)}
