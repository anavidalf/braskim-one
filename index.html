<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Braskim One</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config={theme:{extend:{
    colors:{navy:'#0f172a',brand:'#1a2e8a'},
    fontFamily:{sans:['"DM Sans"','system-ui','sans-serif']}
  }}}
</script>
<style>body{font-family:"DM Sans",system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-navy">
<div id="root"></div>

<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.2.0",
  "react-dom/client":"https://esm.sh/react-dom@18.2.0/client"
}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React,{useState,useEffect} from "react";
import {createRoot} from "react-dom/client";

// =====================================================================
// BRASKIM ONE — PORTAL
// Porta de entrada única dos apps da Braskim. Nesta versão:
//  • login com Google (mesmo projeto Firebase do RH → o login vale para os dois)
//  • lançador de apps: RH liberado conforme perfis/{email} (mantido pelo próprio RH)
//  • demais apps aparecem como "Em breve"
// O RH continua igual, agora no endereço /rh (arquivo rh.html).
// =====================================================================
const FIREBASE_CFG={apiKey:"AIzaSyB0Y1wn5kWzGiWc"+"xDowbTIuztCERx6me2M",authDomain:"braskim---one.firebaseapp.com",projectId:"braskim---one",storageBucket:"braskim---one.firebasestorage.app",messagingSenderId:"1064753515954",appId:"1:1064753515954:web:b4d2a2fd48c3e8482da8ab"};
const ADMIN_EMAIL="ana.vidal@braskim.com.br";
const DOMINIO_PERMITIDO="braskim.com.br";
const SDK="https://www.gstatic.com/firebasejs/10.12.2/";

// ---------- ícones (traço) ----------
const Svg=({children,size=24,sw=1.8})=><svg aria-hidden="true" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
const ICONES={
  rh:<Svg><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.4.1 4 1.6 4.5 4.3"/></Svg>,
  tarefas:<Svg><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9.5l1.6 1.6L12.5 8"/><path d="M14.5 9.5H17"/><path d="M8 15l1.6 1.6 2.9-3.1"/><path d="M14.5 15H17"/></Svg>,
  procedimentos:<Svg><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7"/><path d="M8.5 16h5"/></Svg>,
  planejamento:<Svg><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/><path d="M12 3.5V2"/><path d="M20.5 12H22"/></Svg>,
  comercial:<Svg><path d="M4 19h16"/><path d="M7 15v-3"/><path d="M11 15V9"/><path d="M15 15v-5"/><path d="M19 15V6"/><path d="M6 8.5l4-3 4 2.5 5-4"/></Svg>,
  qualidade:<Svg><path d="M9.5 3h5"/><path d="M10.5 3v6L5 18.5A1.7 1.7 0 0 0 6.5 21h11a1.7 1.7 0 0 0 1.5-2.5L13.5 9V3"/><path d="M7.5 15h9"/></Svg>,
};
const IcoSair=()=><Svg size={18} sw={2}><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></Svg>;

// ---------- catálogo de apps ----------
// liberado(ctx) decide se a pessoa vê o app como disponível. Apps sem "href" ainda não existem.
const APPS=[
  {id:"rh",nome:"Recursos Humanos",desc:"Colaboradores, férias, avaliações, PDI e reconhecimento.",href:"/rh",
   liberado:({admin,modulos})=>admin||Object.values(modulos||{}).some(Boolean)},
  {id:"tarefas",nome:"Tarefas",desc:"Tarefas e rotinas de todas as áreas num só lugar."},
  {id:"procedimentos",nome:"Procedimentos",desc:"Procedimentos, revisões e aprovações."},
  {id:"planejamento",nome:"Planejamento 2027",desc:"Objetivos, metas por área e planos de ação."},
  {id:"comercial",nome:"Comercial",desc:"Clientes, contatos e negociações."},
  {id:"qualidade",nome:"Qualidade",desc:"Laboratório e controle de qualidade."},
];

const carregarScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
const iniciais=n=>String(n||"").trim().split(/\s+/).filter(Boolean).map(p=>p[0]).slice(0,2).join("").toUpperCase()||"?";
const saudacao=()=>{const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";};
const dataHoje=()=>new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});

function Logo({grande}){
  // símbolo "Elo": duas formas que se encontram e viram uma
  const t=grande?60:32;
  return <div className={"flex items-center "+(grande?"gap-4":"gap-3")}>
    <svg aria-hidden="true" width={t} height={t} viewBox="0 0 64 64"><rect x="5" y="5" width="34" height="34" rx="10" fill="none" stroke="#ffffff" strokeWidth="5"/><rect x="25" y="25" width="34" height="34" rx="10" fill="none" stroke="#7b8ff0" strokeWidth="5"/></svg>
    <div className={grande?"text-[34px] tracking-[-0.8px]":"text-lg tracking-tight"}><span className="font-bold">Braskim</span> <span className="font-medium text-indigo-300">One</span></div>
  </div>;
}

// frase exibida no login (provisória; futuramente uma "frase do dia")
const FRASE_LOGIN="Todo carinho que sua casa merece começa com o cuidado de cada um de nós.";
const dataLonga=()=>{ const t=dataHoje(); return t.charAt(0).toUpperCase()+t.slice(1); };

function Login({onEntrar,ocupado,erro}){
  return <div className="min-h-screen flex flex-wrap">
    <div className="flex-[1_1_420px] relative overflow-hidden bg-navy text-white p-10 md:p-16 flex flex-col gap-12">
      <img src="/braskim-simbolo-contorno.png" alt="" aria-hidden="true" className="absolute left-10 md:left-16 top-1/2 -translate-y-1/2 h-[400px] w-auto opacity-[0.08] pointer-events-none select-none"/>
      <div className="relative"><Logo grande/></div>
      <div className="relative my-auto">
        <h1 className="text-4xl md:text-[44px] leading-[1.1] font-bold tracking-tight">Tudo da Braskim<br/>num só lugar.</h1>
        <div className="mt-8 pt-6 border-t border-slate-700 max-w-[460px]">
          <div className="text-[13px] font-semibold tracking-wider uppercase text-indigo-300">{dataLonga()}</div>
          <p className="mt-2 text-[19px] leading-normal text-slate-200">{FRASE_LOGIN}</p>
        </div>
      </div>
    </div>
    <div className="flex-[1_1_420px] bg-slate-50 flex items-center justify-center p-6">
      <div className="w-full max-w-[400px] bg-white border border-slate-200 rounded-2xl p-10 shadow-[0_8px_24px_rgba(15,23,42,0.06)]">
        <h2 className="text-2xl font-bold">Entrar</h2>
        <p className="mt-2 mb-7 text-[14.5px] text-slate-600">Use sua conta Google da Braskim.</p>
        <button onClick={onEntrar} disabled={ocupado} className="w-full h-12 rounded-[11px] border border-slate-300 bg-white flex items-center justify-center gap-3 text-[15px] font-semibold hover:bg-slate-50 disabled:opacity-60">
          <Svg size={18} sw={2}><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8"/><path d="M12 21a9 9 0 1 1 6.2-15.5"/></Svg>
          {ocupado?"Entrando…":"Entrar com Google"}
        </button>
        {erro&&<p className="mt-4 text-sm text-red-700">{erro}</p>}
      </div>
    </div>
  </div>;
}

function CardApp({app,disponivel}){
  const conteudo=<>
    <div className="flex items-center justify-between">
      <span className={"w-12 h-12 rounded-xl flex items-center justify-center "+(disponivel?"bg-brand/[0.08] text-brand ring-1 ring-inset ring-brand/20":"bg-slate-200 text-slate-500")}>{ICONES[app.id]}</span>
      <span className={"text-xs font-semibold px-2.5 py-1 rounded-full "+(disponivel?"bg-green-100 text-green-800":"bg-slate-200 text-slate-600")}>{disponivel?"Disponível":app.href?"Sem acesso":"Em breve"}</span>
    </div>
    <div className="mt-[18px] text-[17px] font-bold text-navy">{app.nome}</div>
    <div className="mt-1.5 text-[13.5px] leading-snug text-slate-600">{app.desc}</div>
  </>;
  const base="text-left rounded-[14px] p-5 min-h-[168px] flex flex-col ";
  if(disponivel) return <a href={app.href} className={base+"bg-white border border-slate-200 shadow-sm hover:border-brand/40 hover:shadow-md transition"}>{conteudo}</a>;
  return <div aria-disabled="true" className={base+"bg-slate-50 border border-dashed border-slate-300"}>{conteudo}</div>;
}

function Inicio({usuario,ctx,onSair}){
  const nome=usuario.displayName||usuario.email;
  const primeiro=String(nome).split(/\s+/)[0];
  const [menu,setMenu]=useState(false);
  const visiveis=APPS.map(a=>({app:a,disponivel:!!(a.href&&a.liberado&&a.liberado(ctx))}));
  const IcoCasa=()=><Svg size={20} sw={1.8}><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></Svg>;
  return <div className="min-h-screen md:flex">
    <aside className="relative overflow-hidden bg-navy text-white md:w-[264px] md:shrink-0 md:h-screen md:sticky md:top-0 flex md:flex-col">
      <img src="/braskim-simbolo-contorno.png" alt="" aria-hidden="true" className="hidden md:block absolute left-6 bottom-28 h-[220px] w-auto opacity-[0.06] pointer-events-none select-none"/>
      <div className="relative px-5 md:px-6 py-4 md:pt-7 md:pb-8"><Logo/></div>
      <nav aria-label="Menu" className="relative hidden md:flex flex-col gap-1 px-3">
        <a href="/" aria-current="page" className="flex items-center gap-3 px-3 h-11 rounded-lg bg-white/10 font-semibold text-[15px]"><IcoCasa/>Início</a>
        <div className="mt-5 mb-1 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Apps</div>
        {visiveis.map(({app,disponivel})=>disponivel
          ?<a key={app.id} href={app.href} className="flex items-center gap-3 px-3 h-11 rounded-lg text-[15px] text-slate-200 hover:bg-white/5 [&_svg]:w-5 [&_svg]:h-5">{ICONES[app.id]}{app.nome}</a>
          :<div key={app.id} aria-disabled="true" className="flex items-center gap-3 px-3 h-11 rounded-lg text-[15px] text-slate-500 [&_svg]:w-5 [&_svg]:h-5">{ICONES[app.id]}<span className="flex-1">{app.nome}</span></div>)}
      </nav>
      <div className="relative ml-auto md:ml-0 md:mt-auto px-3 py-2 md:py-4 md:border-t md:border-white/10">
        <button onClick={()=>setMenu(m=>!m)} aria-expanded={menu} className="w-full flex items-center gap-2.5 p-2 rounded-lg hover:bg-white/5 text-left">
          {usuario.photoURL?<img src={usuario.photoURL} alt="" referrerPolicy="no-referrer" className="w-9 h-9 rounded-full"/>:<span className="w-9 h-9 rounded-full bg-slate-200 text-navy flex items-center justify-center font-bold text-[13px]">{iniciais(nome)}</span>}
          <span className="leading-tight hidden sm:block min-w-0"><span className="block text-sm font-semibold truncate">{nome}</span><span className="block text-xs text-slate-400 truncate">{ctx.admin?"Administradora":usuario.email}</span></span>
        </button>
        {menu&&<div className="absolute right-3 md:left-3 top-full md:top-auto md:bottom-full mt-2 md:mt-0 md:mb-2 w-52 bg-white text-navy rounded-xl shadow-lg border border-slate-200 py-1 z-10">
          <button onClick={onSair} className="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm hover:bg-slate-50"><IcoSair/>Sair</button>
        </div>}
      </div>
    </aside>
    <main className="flex-1 min-w-0 max-w-[1280px] px-5 md:px-10 pt-9 pb-12">
      <div className="mb-7">
        <div className="text-[13px] text-slate-600 uppercase tracking-wider font-semibold">{dataHoje()}</div>
        <h1 className="mt-1.5 text-[32px] font-bold tracking-tight">{saudacao()}, {primeiro}</h1>
      </div>
      <div className="flex flex-wrap gap-7 items-start">
        <section className="flex-[999_1_560px] min-w-0">
          <div className="flex flex-wrap items-baseline justify-between gap-2 mb-3.5">
            <h2 className="text-lg font-bold">Seus apps</h2>
            <span className="text-[13px] text-slate-600">Você vê apenas os apps liberados para o seu perfil</span>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {visiveis.map(v=><CardApp key={v.app.id} {...v}/>)}
          </div>
        </section>
        <aside className="flex-[1_1_320px] flex flex-col gap-5">
          <section className="bg-white border border-slate-200 rounded-[14px] p-5">
            <h2 className="text-base font-bold mb-2">Minhas tarefas</h2>
            <p className="text-[13.5px] leading-relaxed text-slate-600">Em breve, as tarefas de todos os apps vão aparecer aqui.</p>
          </section>
          <section className="bg-white border border-slate-200 rounded-[14px] p-5">
            <h2 className="text-base font-bold mb-2">Avisos</h2>
            <p className="text-[13.5px] leading-relaxed text-slate-600">Nenhum aviso no momento.</p>
          </section>
        </aside>
      </div>
    </main>
  </div>;
}

function App(){
  const [fb,setFb]=useState(null);
  const [usuario,setUsuario]=useState(undefined); // undefined = verificando; null = fora
  const [ctx,setCtx]=useState({admin:false,modulos:{}});
  const [ocupado,setOcupado]=useState(false), [erro,setErro]=useState("");

  useEffect(()=>{(async()=>{
    try{
      await carregarScript(SDK+"firebase-app-compat.js");
      await carregarScript(SDK+"firebase-firestore-compat.js");
      await carregarScript(SDK+"firebase-auth-compat.js");
      // mesmo cuidado do RH: no celular o domínio de autenticação precisa ser o do próprio site
      const host=String(location.hostname||"");
      const cfg={...FIREBASE_CFG,...(/\.web\.app$|\.firebaseapp\.com$/.test(host)?{authDomain:host}:{})};
      const app=window.firebase.apps.length?window.firebase.app():window.firebase.initializeApp(cfg);
      const auth=window.firebase.auth(app), db=window.firebase.firestore(app);
      setFb({auth,db});
      try{ await auth.getRedirectResult(); }catch(e){ console.warn("getRedirectResult",e&&e.code); }
      auth.onAuthStateChanged(async u=>{
        if(!u){ setUsuario(null); return; }
        const em=String(u.email||"").toLowerCase();
        if(!em.endsWith("@"+DOMINIO_PERMITIDO)){ await auth.signOut(); setErro("Acesso permitido apenas para e-mails @"+DOMINIO_PERMITIDO+"."); setUsuario(null); return; }
        let c={admin:em===ADMIN_EMAIL,modulos:{}};
        if(!c.admin){ try{ const pf=await db.collection("perfis").doc(em).get(); if(pf.exists) c.modulos=pf.data().modulos||{}; }catch(e){ console.warn("[perfis]",e&&e.code); } }
        setCtx(c); setUsuario(u);
      });
    }catch(e){ console.error(e); setErro("Não foi possível carregar o login. Verifique a internet e recarregue a página."); setUsuario(null); }
  })();},[]);

  const entrar=async()=>{
    if(!fb) return; setErro(""); setOcupado(true);
    const provider=new window.firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
    try{
      if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||"")){ await fb.auth.signInWithRedirect(provider); return; }
      await fb.auth.signInWithPopup(provider);
    }catch(e){
      const msg=String((e&&e.code)||e);
      if(/popup-blocked|operation-not-supported/i.test(msg)){ try{ await fb.auth.signInWithRedirect(provider); return; }catch(_){} }
      if(!/popup-closed|cancelled-popup/i.test(msg)) setErro("Login não concluído: "+msg.slice(0,70));
    }
    setOcupado(false);
  };
  const sair=async()=>{ try{ await fb.auth.signOut(); }catch(e){} };

  if(usuario===undefined) return <div className="min-h-screen flex items-center justify-center text-slate-500 text-sm">Carregando…</div>;
  if(!usuario) return <Login onEntrar={entrar} ocupado={ocupado} erro={erro}/>;
  return <Inicio usuario={usuario} ctx={ctx} onSair={sair}/>;
}

// Tablets que já usavam o RH na raiz (?tablet ou lembrados no aparelho) continuam indo direto para o RH.
const tabletRH=(()=>{ try{ return /[?&#]tablet\b/i.test(location.href)||localStorage.getItem("bsk_tablet")==="1"; }catch(e){ return /[?&#]tablet\b/i.test(location.href); } })();
if(tabletRH) location.replace("/rh"+location.search+location.hash);
else createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
