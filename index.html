      {editavel&&<div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
        {pend.length>0?<div><div className="text-sm font-medium text-slate-700 mb-1">Antes de enviar, falta:</div>
          <ul className="space-y-0.5">{pend.map((p,i)=>{ const c=AVAL.calcular&&snap.blocos.flatMap(b=>b.criterios).find(x=>x.id===p.criterioId);
            return <li key={i}><button onClick={()=>{ setAba(c.blocoId); setTimeout(()=>{ const el=document.getElementById("crit_"+c.id); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"}); },50); }} className="text-sm text-red-600 hover:underline text-left">• {p.msg}</button></li>; })}</ul></div>
          :<p className="text-sm text-emerald-700">Todos os critérios foram avaliados e as evidências obrigatórias preenchidas.</p>}
        {erros.length>0&&!pend.length&&<div className="text-sm text-red-600">{erros.map(e=>e.msg).join(" · ")}</div>}
        <div className="flex justify-end gap-2">
          <button onClick={()=>salvar().then(()=>notify("Avaliação salva ✓")).catch(()=>{})} className="px-4 py-2 text-sm border border-slate-300 rounded-md hover:bg-slate-50">Salvar</button>
          <button disabled={pend.length>0} onClick={()=>setConfirmarEnvio(true)} className="px-4 py-2 text-sm font-medium rounded-md bg-brand hover:bg-navy text-white disabled:opacity-40">Enviar para calibração</button></div>
      </div>}
    </div>}
    {/* navegação entre blocos */}
    <div className="flex justify-between pt-1">
      <button disabled={idxAba<=0} onClick={()=>irPara(abas[idxAba-1][0])} className="px-4 py-2 text-sm border border-slate-300 rounded-md hover:bg-slate-50 disabled:opacity-30">← {idxAba>0?abas[idxAba-1][1]:"Anterior"}</button>
      {idxAba<abas.length-1&&<button onClick={()=>irPara(abas[idxAba+1][0])} className="px-4 py-2 text-sm rounded-md bg-brand hover:bg-navy text-white">{abas[idxAba+1][1]} →</button>}
    </div>
    {confirmarEnvio&&<div className="fixed inset-0 z-50 flex items-center justify-center p-4"><div className="absolute inset-0 bg-navy/40" onClick={()=>setConfirmarEnvio(false)}/>
      <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-5 space-y-3">
        <div className="font-bold text-navy text-lg">Enviar para calibração?</div>
        <p className="text-sm text-slate-600">Nota final preliminar: <b>{fmtNota(calc.finalArred)}</b> — {calc.classificacao}.</p>
        <p className="text-sm text-slate-500">Após o envio, sua avaliação não poderá ser editada. Ajustes, se necessários, serão feitos e justificados na calibração.</p>
        <div className="flex justify-end gap-2 pt-1"><button onClick={()=>setConfirmarEnvio(false)} className="px-4 py-2 text-sm text-slate-500">Voltar e revisar</button>
          <button onClick={enviar} className="px-4 py-2 text-sm font-medium rounded-md bg-brand hover:bg-navy text-white">Enviar avaliação</button></div>
      </div></div>}
  </div>;
}

// ---------- calibração (Etapa 6) ----------
const respCalib=av=>(av.calibracao&&av.calibracao.respostas)||(av.gestor&&av.gestor.respostas)||{};
const flagsAv=av=>{ const r=av.resultadoFinal||av.resultadoPreliminar; const al=(r&&r.alertas)||[];
  return {nota1:al.some(a=>a.tipo==="nota1"),trava:al.some(a=>a.tipo==="trava"),diverg:al.some(a=>a.tipo==="divergencia"),blocoNA:al.some(a=>a.tipo==="bloco_sem_nota")}; };
const Flag=({on,rot,cor})=>on?<span className={"text-[11px] px-1.5 py-0.5 rounded font-medium "+(cor||"bg-red-50 text-red-600")}>{rot}</span>:<span className="text-slate-300 text-xs">—</span>;

// painel do ciclo: todas as avaliações na etapa de calibração (ordem alfabética — sem ranking)
function AvPainelCalibracao({avaliacoes,ciclo,onAbrir,onVoltar}){
  const agora=new Date().toISOString();
  const lista=avaliacoes.filter(a=>!a.cancelada&&["pendente","em_calibracao","calibrada"].includes(a.etapas.calibracao.estado))
    .sort((a,b)=>a.snapshot.contexto.pessoa.nome.localeCompare(b.snapshot.contexto.pessoa.nome,"pt-BR"));
  const faltam=avaliacoes.filter(a=>!a.cancelada&&a.etapas.calibracao.estado==="bloqueada").length;
  const blocosIds=[...new Set(lista.flatMap(a=>a.snapshot.blocos.map(b=>b.id)))];
  const nomeBloco=id=>{ for(const a of lista){ const b=a.snapshot.blocos.find(x=>x.id===id); if(b) return b.nome; } return id; };
  return <div className="w-full px-8 py-6 space-y-4">
    <button onClick={onVoltar} className="text-sm text-slate-500 hover:text-brand">← Avaliações</button>
    <div><h1 className="text-2xl font-bold text-navy">Calibração{ciclo?` · ${ciclo.nome}`:""}</h1>
      <p className="text-sm text-slate-500">Revise as avaliações enviadas pelos gestores, ajuste notas com justificativa e registre a decisão. A lista está em ordem alfabética: não há ranking nem curva forçada.</p></div>
    {faltam>0&&<div className="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-4 py-2">{faltam} avaliação(ões) do ciclo ainda não chegaram à calibração (autoavaliação ou avaliação do gestor em aberto).</div>}
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table className="w-full text-sm min-w-[1000px]">
        <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide text-left">
          <th className="px-4 py-2.5 font-semibold">Colaborador</th><th className="px-3 py-2.5 font-semibold">Cargo</th><th className="px-3 py-2.5 font-semibold">Gestor</th>
          {blocosIds.map(id=><th key={id} className="px-3 py-2.5 font-semibold text-center">{nomeBloco(id).split(" ")[0]}</th>)}
          <th className="px-3 py-2.5 font-semibold text-center text-sky-700">Auto</th><th className="px-3 py-2.5 font-semibold text-center">Final</th><th className="px-3 py-2.5 font-semibold">Classificação</th>
          <th className="px-3 py-2.5 font-semibold text-center">Nota 1</th><th className="px-3 py-2.5 font-semibold text-center">Trava</th><th className="px-3 py-2.5 font-semibold text-center">Divergência</th>
          <th className="px-3 py-2.5 font-semibold">Status</th><th className="px-3 py-2.5"></th></tr></thead>
        <tbody>{lista.map(a=>{ const s=a.snapshot.contexto; const r=a.resultadoFinal||a.resultadoPreliminar; const fl=flagsAv(a); const alterou=(a.calibracao&&a.calibracao.alteracoes||[]).length;
          return <tr key={a.id} className="border-t border-slate-100 hover:bg-slate-50">
            <td className="px-4 py-2.5 font-medium text-navy">{s.pessoa.nome}</td><td className="px-3 py-2.5 text-slate-600">{s.cargo.titulo}</td><td className="px-3 py-2.5 text-slate-600">{s.gestor.nome||"—"}</td>
            {blocosIds.map(id=><td key={id} className="px-3 py-2.5 text-center text-slate-700">{r&&r.blocos[id]?fmtNota(r.blocos[id].nota):"—"}</td>)}
            <td className="px-3 py-2.5 text-center text-sky-700">{a.auto&&Object.keys(a.auto.respostas||{}).length?fmtNota(AVAL.calcular(a.snapshot,a.auto.respostas).finalArred):"—"}</td>
            <td className="px-3 py-2.5 text-center font-bold text-navy">{fmtNota(r&&r.finalArred)}</td>
            <td className="px-3 py-2.5 text-slate-600">{(r&&r.classificacao)||"—"}{alterou?<div className="text-[11px] text-violet-700">{alterou} ajuste(s) na calibração</div>:null}</td>
            <td className="px-3 py-2.5 text-center"><Flag on={fl.nota1} rot="Sim"/></td>
            <td className="px-3 py-2.5 text-center"><Flag on={fl.trava} rot="Sim"/></td>
            <td className="px-3 py-2.5 text-center"><Flag on={fl.diverg} rot="Sim" cor="bg-amber-50 text-amber-700"/></td>
            <td className="px-3 py-2.5"><AvStatus s={AVAL.derivarStatus(a,agora)}/></td>
            <td className="px-3 py-2.5 text-right"><button onClick={()=>onAbrir(a)} className="text-sm px-3 py-1.5 rounded-md bg-brand hover:bg-navy text-white whitespace-nowrap">{a.etapas.calibracao.estado==="calibrada"?"Ver":"Calibrar"}</button></td>
          </tr>; })}
          {!lista.length&&<tr><td colSpan={10+blocosIds.length} className="px-4 py-12 text-center text-slate-400">Nenhuma avaliação aguardando calibração{ciclo?" neste ciclo":""}.</td></tr>}
        </tbody></table></div>
  </div>;
}

// calibração de uma avaliação
function AvCalibracao({av,ciclo,db,ator,notify,isRH,onVoltar,onAcao}){
  const snap=av.snapshot, ctx=snap.contexto, est=av.etapas.calibracao.estado;
  const aberta=est==="em_calibracao"&&isRH;
  const resp=respCalib(av), orig=(av.gestor&&av.gestor.respostas)||{}, auto=(av.auto&&av.auto.respostas)||{};
  const temAuto=Object.keys(auto).length>0; const calcAuto=temAuto?AVAL.calcular(snap,auto):null;
  const calc=est==="calibrada"&&av.resultadoFinal?av.resultadoFinal:AVAL.calcular(snap,resp,{situacoesCriticas:av.gestor.situacoesCriticas,auto:av.auto&&av.auto.respostas});
  const prel=av.resultadoPreliminar;
  const alts=(av.calibracao&&av.calibracao.alteracoes)||[];
  const [editar,setEditar]=useState(null), [decisao,setDecisao]=useState(""), [busy,setBusy]=useState(false);
  const run=async(fn,msg)=>{ setBusy(true); try{ await fn(); if(msg) notify(msg); }catch(e){ notify(String(e.message||e).slice(0,160)); } setBusy(false); };
  const sits=(av.gestor&&av.gestor.situacoesCriticas)||[];
  return <div className="w-full px-8 py-6 space-y-4 max-w-6xl">
    <button onClick={onVoltar} className="text-sm text-slate-500 hover:text-brand">← Voltar</button>
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-wrap items-start gap-4">
      <Avatar nome={ctx.pessoa.nome}/>
      <div className="flex-1 min-w-[240px]"><div className="flex items-center gap-2 flex-wrap"><h1 className="text-xl font-bold text-navy">Calibração · {ctx.pessoa.nome}</h1><AvStatus s={AVAL.derivarStatus(av,new Date().toISOString())}/></div>
        <div className="text-sm text-slate-500">{ctx.cargo.titulo} · gestor: {ctx.gestor.nome||"—"} · {ctx.ciclo.nome}</div></div>
      {isRH&&est==="pendente"&&<button disabled={busy} onClick={()=>run(()=>db.executar(av,"iniciarCalibracao",{},ator,ciclo),"Calibração iniciada ✓")} className="px-4 py-2 text-sm font-medium rounded-md bg-brand hover:bg-navy text-white">Iniciar calibração</button>}
      {isRH&&est==="calibrada"&&av.etapas.feedback.estado==="bloqueada"&&<button onClick={()=>onAcao("liberarFeedbackManual",av)} className="px-4 py-2 text-sm font-medium rounded-md bg-brand hover:bg-navy text-white">Liberar feedback</button>}
    </div>
    {/* resumo */}
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
      <div className="grid sm:grid-cols-5 gap-3">
        {snap.blocos.map(b=>{ const pv=prel&&prel.blocos[b.id]; const nv=calc.blocos[b.id]; const mudou=pv&&nv&&pv.notaArred!==nv.notaArred;
          return <MiniCard key={b.id} t={`${b.nome} · ${b.peso}%`} v={fmtNota(nv.nota)} sub={<>{mudou?`gestor: ${fmtNota(pv.nota)}`:`${nv.respondidos}/${nv.total}${nv.na?` · ${nv.na} N/A`:""}`}
            {calcAuto&&<span className="block text-sky-700">autoavaliação: {fmtNota(calcAuto.blocos[b.id]&&calcAuto.blocos[b.id].nota)}</span>}</>}/>; })}
        <div className="border-2 border-brand/30 rounded-md p-2.5 bg-brand/5"><div className="text-[11px] uppercase tracking-wide text-slate-500">{est==="calibrada"?"Nota final calibrada":"Nota final"}</div>
          <div className="text-2xl font-bold text-navy">{fmtNota(calc.finalArred)}</div><div className="text-xs text-slate-600">{calc.classificacao}</div>
          {prel&&prel.finalArred!==calc.finalArred&&<div className="text-[11px] text-violet-700">preliminar: {fmtNota(prel.finalArred)} · {prel.classificacao}</div>}
          {calcAuto&&<div className="text-[11px] text-sky-700">autoavaliação: {fmtNota(calcAuto.finalArred)} (referência, não compõe a nota)</div>}</div>
      </div>
      {calc.superaBloqueado&&<p className="text-xs text-amber-700">{calc.motivoSupera}</p>}
      {calc.alertas.length>0&&<div className="grid md:grid-cols-2 gap-1.5">{calc.alertas.map((a,i)=><div key={i} className={"text-xs rounded-md px-3 py-1.5 "+(a.tipo==="trava"||a.tipo==="nota1"?"bg-red-50 text-red-700":"bg-amber-50 text-amber-800")}>⚑ {a.msg}</div>)}</div>}
      {sits.length>0&&<div className="border-t border-slate-100 pt-3 space-y-1.5"><div className="text-[11px] uppercase tracking-wide text-red-600 font-semibold">Situações críticas registradas pelo gestor</div>
        {sits.map((x,i)=><div key={i} className="text-sm"><b className="text-slate-700">{x.categoria}:</b> <span className="text-slate-600">{x.descricao||"—"}</span></div>)}</div>}
    </div>
    {/* critérios */}
    {snap.blocos.map(b=><div key={b.id} className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div className="px-5 py-2.5 bg-slate-50 border-b border-slate-200 text-sm font-semibold text-navy">{b.nome} <span className="font-normal text-slate-400">· peso {b.peso}% · nota {fmtNota(calc.blocos[b.id].nota)}</span></div>
      <div className="divide-y divide-slate-100">{b.criterios.map(c=>{ const g=orig[c.id]||{}, r=resp[c.id]||{}, a=auto[c.id]||{}; const mudou=g.nota!==r.nota;
        const hist=alts.filter(x=>x.criterioId===c.id);
        const Nota=({v,cls})=><span className={"w-9 h-9 shrink-0 rounded-lg grid place-items-center text-white text-sm font-bold "+(v!=null?COR_NOTA[v].split(" ")[0]:"bg-slate-200")+" "+(cls||"")}>{v==="NA"?"N/A":v??"—"}</span>;
        // pontos de atenção para a calibração
        const aten=[];
        if(temAuto&&a.nota!=null&&g.nota!=null&&a.nota!=="NA"&&g.nota!=="NA"&&Math.abs(a.nota-g.nota)>=2) aten.push(["amber",`Divergência de ${Math.abs(a.nota-g.nota)} pontos entre autoavaliação e gestor: confronte os fatos citados pelos dois.`]);
        if(g.nota===1) aten.push(["red","Nota 1: confirme se as evidências sustentam \"não atende\" e se há plano de desenvolvimento para este ponto."]);
        if(g.nota===4) aten.push(["emerald","Nota 4: verifique se a entrega superou claramente o esperado para o cargo, e não apenas o atendeu."]);
        if(g.nota==="NA") aten.push(["slate","N/A: confirme se de fato não havia como avaliar no período; o peso foi redistribuído no bloco."]);
        if(g.nota!=null&&!String(g.comentario||"").trim()) aten.push(["amber","Sem justificativa do gestor: peça os fatos antes de manter a nota."]);
        if(temAuto&&(a.nota==null)) aten.push(["slate","O colaborador não respondeu este critério."]);
        const corAt={amber:"bg-amber-50 text-amber-800 border-amber-200",red:"bg-red-50 text-red-700 border-red-200",emerald:"bg-emerald-50 text-emerald-800 border-emerald-200",slate:"bg-slate-50 text-slate-600 border-slate-200"};
        return <div key={c.id} className={"px-5 py-4 space-y-3 "+(mudou?"bg-violet-50/40":"")}>
          {/* critério + nota vigente */}
          <div className="flex items-start gap-3 flex-wrap">
            <div className="flex-1 min-w-[220px]"><div className="text-sm font-semibold text-navy">{c.nome} <span className="text-[11px] font-normal text-slate-400">· peso {c.peso}%</span></div></div>
            <div className="flex items-center gap-2">
              <span className="text-[11px] text-slate-400">{mudou?<span className="text-violet-700 font-medium">calibrada</span>:"nota vigente"}</span>
              <Nota v={r.nota}/>
              {aberta&&<button onClick={()=>setEditar({c,nota:r.nota,justificativa:""})} className="text-xs px-2.5 py-1.5 border border-slate-300 rounded-md hover:bg-white">Alterar</button>}
            </div>
          </div>
          {/* direcionamento do critério */}
          <div className="rounded-lg bg-slate-50 border border-slate-100 px-3.5 py-2.5 text-xs text-slate-600 space-y-1">
            <div className="text-[10px] uppercase tracking-wide text-slate-400 font-semibold">Direcionamento</div>
            {c.pergunta&&<div className="text-slate-700">{c.pergunta}</div>}
            {c.orientacao&&<div className="whitespace-pre-line"><TextoRico t={c.orientacao}/></div>}
            {(c.evidencias||[]).length>0&&<div className="flex flex-wrap gap-1 pt-0.5"><span className="text-slate-400">Evidências esperadas:</span>{c.evidencias.map((e,k)=><span key={k} className="px-1.5 rounded bg-white border border-slate-200">{e}</span>)}</div>}
            {!c.pergunta&&!c.orientacao&&!(c.evidencias||[]).length&&<div className="text-slate-400">Sem orientação cadastrada para este critério.</div>}
            <div className="grid md:grid-cols-2 gap-2 pt-1.5">
              {temAuto&&a.nota!=null&&<div className={"rounded border px-2 py-1 "+(COR_REGUA[a.nota]||"border-slate-200 bg-white")}><b>Régua da nota {a.nota==="NA"?"N/A":a.nota} (autoavaliação):</b> {textoRegua(c,a.nota,snap.reguaGeral)}</div>}
              {g.nota!=null&&<div className={"rounded border px-2 py-1 "+(COR_REGUA[g.nota]||"border-slate-200 bg-white")}><b>Régua da nota {g.nota==="NA"?"N/A":g.nota} (gestor):</b> {textoRegua(c,g.nota,snap.reguaGeral)}</div>}
            </div>
            <details><summary className="text-brand cursor-pointer select-none">Ver régua completa</summary><div className="mt-1.5"><ReguaCompleta c={c} geral={snap.reguaGeral} destaque={r.nota}/></div></details>
          </div>
          {/* autoavaliação × gestor */}
          <div className="grid md:grid-cols-2 gap-3">
            <div className="rounded-lg border border-sky-100 bg-sky-50/40 p-3 flex gap-2.5">
              <Nota v={temAuto?a.nota:null} cls={temAuto?"":"opacity-40"}/>
              <div className="text-xs min-w-0 flex-1"><div className="text-[10px] uppercase tracking-wide text-sky-700 font-semibold">Autoavaliação · comentário do colaborador</div>
                {!temAuto?<div className="text-slate-400 mt-0.5">Sem autoavaliação neste ciclo.</div>:a.nota!=null?<>
                  <div className="text-sky-900 font-medium mt-0.5">{rotNota(a.nota)}</div>
                  <div className="text-slate-700 whitespace-pre-line mt-0.5">{String(a.comentario||"").trim()||<span className="text-slate-400 italic">Sem comentário.</span>}</div></>
                  :<div className="text-slate-400 mt-0.5">Não respondido.</div>}</div></div>
            <div className="rounded-lg border border-slate-200 bg-white p-3 flex gap-2.5">
              <Nota v={g.nota}/>
              <div className="text-xs min-w-0 flex-1"><div className="text-[10px] uppercase tracking-wide text-slate-500 font-semibold">Avaliação do gestor · justificativa</div>
                <div className="text-slate-800 font-medium mt-0.5">{g.nota!=null?rotNota(g.nota):"—"}</div>
                <div className="text-slate-700 whitespace-pre-line mt-0.5">{String(g.comentario||"").trim()||<span className="text-slate-400 italic">Sem justificativa.</span>}</div></div></div>
          </div>
          {/* pontos de atenção */}
          {aten.length>0&&<div className="space-y-1">{aten.map(([cor,t],k)=><div key={k} className={"text-xs rounded-md border px-3 py-1.5 "+corAt[cor]}>⚑ {t}</div>)}</div>}
          {hist.map((h,k)=><div key={k} className="text-[11px] text-violet-700">↳ Calibração: {h.de==="NA"?"N/A":h.de??"—"} → {h.para==="NA"?"N/A":h.para} · “{h.justificativa}” · {h.por} · {fmtDH(h.em)}</div>)}
        </div>; })}</div>
    </div>)}
    {/* decisão */}
    {aberta&&<div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
      <div className="text-[11px] uppercase tracking-wide text-brand font-semibold">Decisão de calibração</div>
      <textarea rows="3" value={decisao} onChange={e=>setDecisao(e.target.value)} placeholder={alts.length?"Registre a decisão e o racional dos ajustes (participantes, fatos considerados)…":"Ex.: Avaliação mantida conforme o gestor; evidências consistentes."}
        className="w-full text-sm border border-slate-300 rounded-md px-3 py-2"/>
      <div className="flex flex-wrap justify-end gap-2">
        {!alts.length&&<button disabled={busy} onClick={()=>run(()=>db.executar(av,"decidirCalibracao",{decisao:decisao.trim()||"Avaliação mantida conforme o gestor."},ator,ciclo),"Avaliação mantida e calibrada ✓")}
          className="px-4 py-2 text-sm border border-slate-300 rounded-md hover:bg-slate-50">Manter avaliação</button>}
        <button disabled={busy||!decisao.trim()} onClick={()=>run(()=>db.executar(av,"decidirCalibracao",{decisao},ator,ciclo),"Calibração registrada ✓")}
          className="px-4 py-2 text-sm font-medium rounded-md bg-brand hover:bg-navy text-white disabled:opacity-40">Registrar decisão</button></div>
      <p className="text-[11px] text-slate-400">Depois de registrada, a nota calibrada passa a ser a nota final e a avaliação segue para o feedback. Todas as alterações ficam no histórico.</p>
    </div>}
    {est==="calibrada"&&av.calibracao&&av.calibracao.decisao&&<div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-1">
      <div className="text-[11px] uppercase tracking-wide text-brand font-semibold">Decisão de calibração</div>
      <p className="text-sm text-slate-700">{av.calibracao.decisao.texto}</p>

const concluirAvaliacao=async({av,db,fb,ator,ciclo,competencias,criarPDI})=>{

const criarPDIDaAvaliacao=async({av,db,fb,ator,ciclo,pacote})=>{

    </tbody></table>`;
  const rg={...AVAL.REGUA_GERAL,...(tpl.reguaGeral||{})};

    <div class="bloco"><div class="rot">Classificação final</div><div class="cont">${AVAL.FAIXAS.map(f=>`${n2(f.min)} a ${n2(f.max)} — ${e(f.rot)}`).join("<br>")}

    <div class="bloco"><div class="rot">Cálculo</div><div class="cont">Nota de cada bloco = média ponderada das notas dos critérios (N/A sai do cálculo e o peso é redistribuído no bloco). Nota final = média ponderada dos blocos pelos pesos acima. A autoavaliação não compõe a nota.</div></div>
    <div class="bloco"><div class="rot">Justificativas</div><div class="cont">Avaliação do gestor: justificativa obrigatória para as notas ${evid.join(", ")}${reg.justificativaNA!==false?" e N/A":""}.${reg.justificativaAuto?" Autoavaliação: justificativa obrigatória em todas as notas.":""}</div></div>`;

function AvModelos({fb,ator,notify,onVoltar}){
  const [hist,setHist]=useState([]), [rev,setRev]=useState(0);
  // excluir versão: só se nenhuma avaliação a usa; a do sistema fica oculta
  const excluirVersao=async t=>{
    try{ const uso=await fb.db.collection("avaliacoes").where("snapshot.template.id","==",t.id).get();
      const n=uso.docs.length; if(n){ notify(`A ${fmtRev(t.versao)} está em uso por ${n} avaliação(ões) e não pode ser excluída.`); return; }
      const vis=AVAL.TEMPLATES_BASE.filter(x=>x.familia===t.familia&&!x.oculto);
      if(vis.length<=1){ notify("Esta é a única versão do modelo e não pode ser excluída."); return; }
      if(!window.confirm(`Excluir a ${fmtRev(t.versao)} de "${ROT_FAMILIA[t.familia]||t.nome}"?${t.ativo?" Ela é a vigente: a versão anterior volta a valer.":""}\n\nNenhuma avaliação usa esta versão.`)) return;
      const ref=fb.db.collection("aval_templates").doc(t.id);
      if(AVAL.ehTemplateDoSistema(t.id)) await ref.set({oculto:true,ativo:false,ocultadoEm:new Date().toISOString(),ocultadoPor:ator.email},{merge:true}); else await ref.delete();
      AVAL.removerTemplate(t.id); setRev(v=>v+1); notify(`${fmtRev(t.versao)} excluída ✓`); }
    catch(e){ notify(String(e.message||e).slice(0,140)); } };
  useEffect(()=>{ if(!fb) return; return fb.db.collection("aval_templates").onSnapshot(s=>setHist(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}); },[fb]);
  const [fam,setFam]=useState(null);
  const familias=AVAL.familiasDeTemplates();
  if(fam) return <AvModeloEditor fam={fam} fb={fb} ator={ator} notify={notify} onVoltar={()=>setFam(null)} hist={hist}/>;
  return <div className="w-full px-8 py-6 space-y-4 max-w-5xl">
    <button onClick={onVoltar} className="text-sm text-slate-500 hover:text-brand">← Avaliações</button>
    <div><h1 className="text-2xl font-bold text-navy">Modelos de avaliação</h1>
      <p className="text-sm text-slate-500">Edite os critérios, perguntas e pesos de cada modelo. Cada vez que você salva, o sistema cria uma nova versão: avaliações já abertas continuam com a versão em que foram criadas.</p></div>
    {familias.map(f=>{ const v=AVAL.vigenteDaFamilia(f); if(!v) return null; const versoes=AVAL.TEMPLATES_BASE.filter(t=>t.familia===f&&!t.oculto).sort((a,b)=>b.versao-a.versao);
      return <div key={f} className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
        <div className="flex items-start gap-3 flex-wrap"><div className="flex-1">
          <div className="text-lg font-semibold text-navy">{ROT_FAMILIA[f]||v.nome}</div>
          <div className="text-sm text-slate-500">Revisão vigente: <b>{fmtRev(v.versao)}</b> · {v.publico||""}{v.criadoEm?` · salva em ${fmtDH(v.criadoEm)} por ${v.criadoPor||"—"}`:" · versão original do sistema"}</div></div>
          <button onClick={()=>exportarModeloPDF(v)} className="px-4 py-2 text-sm border border-slate-300 rounded-md hover:bg-slate-50">PDF</button>
          <button onClick={()=>setFam(f)} className="px-4 py-2 text-sm font-medium rounded-md bg-brand hover:bg-navy text-white">Editar modelo</button></div>
        <div className="flex flex-wrap gap-2">{v.blocos.map(b=><span key={b.id} className="text-xs px-2.5 py-1 rounded-md bg-slate-100 text-slate-600"><b>{b.nome}</b> · {b.peso}% · {b.origem==="cargo"?"critérios definidos em cada cargo":`${b.criterios.length} critérios · régua em ${b.criterios.filter(c=>nRegua(c)===4).length}`}</span>)}</div>
        <details><summary className="text-xs text-slate-400 cursor-pointer">Histórico de revisões ({versoes.length})</summary>
          <div className="mt-2 space-y-1">{versoes.map(t=><div key={t.id} className="text-xs text-slate-600">
            <b>{fmtRev(t.versao)}</b>{t.ativo?<span className="ml-1 text-emerald-700">· vigente</span>:null} · {t.criadoEm?`${fmtDH(t.criadoEm)} · ${t.criadoPor||"—"}`:"original do sistema"}{t.motivo?<span className="text-slate-500"> — “{t.motivo}”</span>:null}
            {t.editadoEm?<span className="text-slate-400"> · editada em {fmtDH(t.editadoEm)}</span>:null}
            <button onClick={()=>exportarModeloPDF(t)} className="ml-2 text-brand hover:underline">PDF</button>
            {versoes.length>1&&<button onClick={()=>excluirVersao(t)} className="ml-2 text-red-600 hover:underline">Excluir</button>}</div>)}</div></details>
      </div>; })}
    <p className="text-[11px] text-slate-400">Os critérios de Resultados e Entregas continuam sendo definidos em cada cargo (Cargos → Critérios de avaliação). Aqui ficam os blocos comuns a todos os cargos do modelo.</p>
  </div>;
}
function AvModeloEditor({fam,fb,ator,notify,onVoltar}){
  const base=AVAL.vigenteDaFamilia(fam);
  const [f,setF]=useState(()=>{ const c=JSON.parse(JSON.stringify(base)); c.reguaGeral={...AVAL.REGUA_GERAL,...(c.reguaGeral||{})};
    c.blocos.forEach(b=>{ b.criterios=(b.criterios||[]).map(x=>({...x,evidencias:Array.isArray(x.evidencias)?x.evidencias.join("\n"):(x.evidencias||"")})); }); return c; });
  const [motivo,setMotivo]=useState(""), [busy,setBusy]=useState(false), [erros,setErros]=useState([]), [novaVersao,setNovaVersao]=useState(true);
  const setBloco=(i,patch)=>setF(p=>({...p,blocos:p.blocos.map((b,j)=>j===i?{...b,...patch}:b)}));
  const sup=(f.regras&&f.regras.supera)||{final:3.5,blocos:{}};
  const setSup=(k,v)=>setF(p=>({...p,regras:{...p.regras,supera:{...sup,...(k==="final"?{final:v}:{blocos:{...sup.blocos,[k]:v}})}}}));
  const somaBlocos=f.blocos.reduce((a,b)=>a+numPeso(b.peso),0);
  const validar=()=>{ const e=[];
    if(Math.abs(somaBlocos-100)>0.01) e.push(`Os pesos dos blocos somam ${somaBlocos}% (precisam somar 100%).`);
    f.blocos.filter(b=>b.origem!=="cargo").forEach(b=>{ const cs=(b.criterios||[]).filter(c=>String(c.nome||"").trim());
      if(!cs.length) e.push(`O bloco "${b.nome}" precisa de pelo menos um critério.`);
      const s=cs.reduce((a,c)=>a+numPeso(c.peso),0); if(cs.length&&Math.abs(s-100)>0.01) e.push(`Os critérios de "${b.nome}" somam ${s}% (precisam somar 100%).`);
      cs.forEach(c=>{ if(!String(c.pergunta||"").trim()) e.push(`"${c.nome}" está sem a pergunta do gestor.`); }); });
    if(novaVersao&&!motivo.trim()) e.push("Informe o motivo da revisão.");
    return e; };
  const salvar=async()=>{ const e=validar(); setErros(e); if(e.length) return; setBusy(true);
    try{ const nv=novaVersao?AVAL.proximaVersao(fam):base.versao;
      const agora=new Date().toISOString();
      const meta=novaVersao?{id:`${fam}-v${nv}`,versao:nv,ativo:true,emUso:false,derivadoDe:base.id,criadoEm:agora,criadoPor:ator.email,motivo:motivo.trim(),edicoes:[]}
        :{id:base.id,versao:base.versao,ativo:true,editadoEm:agora,editadoPor:ator.email,edicoes:[...(base.edicoes||[]),{em:agora,por:ator.email,obs:motivo.trim()}]};
      const nova={...JSON.parse(JSON.stringify(f)),...meta,
        blocos:f.blocos.map(b=>({...b,peso:numPeso(b.peso),criterios:b.origem==="cargo"?[]:(b.criterios||[]).filter(c=>String(c.nome||"").trim()).map(c=>({...c,
          id:c.id||("crit_"+uid()),peso:numPeso(c.peso),perguntaAuto:c.perguntaAuto||c.pergunta||"",obrigatorio:true,competenciasRelacionadas:c.competenciasRelacionadas||[],
          evidencias:String(c.evidencias||"").split(/\n+/).map(x=>x.trim()).filter(Boolean)}))}))};
      delete nova.provisorio;
      const b=fb.db.batch();
      b.set(fb.db.collection("aval_templates").doc(nova.id),nova);
      if(novaVersao) b.set(fb.db.collection("aval_templates").doc(base.id),{ativo:false},{merge:true});
      await b.commit(); AVAL.registrarTemplates([nova]); notify(novaVersao?`Modelo salvo como ${fmtRev(nv)} ✓`:`Alterações salvas na ${fmtRev(nv)} ✓`); onVoltar(); }
    catch(err){ setErros([String(err.message||err)]); } setBusy(false); };

      <div className="grid md:grid-cols-5 gap-2">{[1,2,3,4,"NA"].map(n=><div key={n} className={"rounded-lg border p-2 "+(COR_REGUA[n]||"border-slate-200 bg-slate-50")}>
        <div className="text-xs font-semibold text-slate-700 mb-1">{n==="NA"?"N/A":n} — {AVAL.ESCALA.find(e=>e.v===n).rot}</div>
        <CelTA value={(f.reguaGeral||{})[n]||""} onChange={v=>setF(p=>({...p,reguaGeral:{...(p.reguaGeral||{}),[n]:v}}))} ph="Significado desta nota"/></div>)}</div>

        :<CriteriosEditor rows={b.criterios||[]} onChange={v=>setBloco(i,{criterios:v})} notify={notify} geral={f.reguaGeral}/>}
    </div>)}
    {/* controle de revisão — mesmo padrão da edição de cargo */}
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden sticky bottom-0">

        </>:<div className="text-xs text-slate-500">As alterações serão salvas na revisão atual (<b className="text-navy">{fmtRev(base.versao)}</b>), sem gerar uma nova revisão no histórico. Use para correções pontuais — ajustes de digitação, formatação ou complementos que não mudam o conteúdo. Avaliações já incluídas não mudam em nenhum caso.</div>}
      </div>
      {erros.length>0&&<div className="px-4 py-2 text-sm text-red-600 bg-red-50 border-t border-red-200 space-y-0.5">{erros.map((e,k)=><div key={k}>• {e}</div>)}</div>}

      </div>
    </div>
  </div>;
}

          <Info l="Respostas salvas">{ext?`${respAuto} de ${nCrit} critérios`:"—"}</Info>
          <Info l="Último salvamento">{ext&&ext.salvoEm?fmtDH(ext.salvoEm):"—"}</Info>
        </div>}
        {av.etapas.auto.estado==="enviada"&&<p className="text-sm text-emerald-700">Esta autoavaliação foi enviada em {fmtDH(av.etapas.auto.conclusao)}.</p>}
        {av.etapas.auto.estado==="encerrada_pelo_rh"&&<p className="text-sm text-slate-600">Etapa encerrada pelo RH{av.auto&&Object.keys(av.auto.respostas||{}).length?` com ${Object.keys(av.auto.respostas).length} resposta(s) parcial(is) preservada(s)`:""}.</p>}

        {isRH&&(av.acesso||(av.auto&&Object.keys(av.auto.respostas||{}).length>0))&&<button onClick={()=>onAcao("verAuto",av)} className="text-sm px-3 py-1.5 border border-slate-300 rounded-md hover:bg-slate-50">Visualizar autoavaliação</button>}
        {av.acesso&&<div className="text-[11px] text-slate-400">Acesso nº {av.acesso.geracao||1}{(av.acesso.geracao||1)>1?" · os códigos anteriores foram invalidados":""}</div>}

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">

          <div className="flex flex-wrap gap-2 text-xs text-slate-500">{av.snapshot.blocos.map(b=><span key={b.id}>{b.nome}: <b className="text-slate-700">{fmtNota(av.resultadoPreliminar.blocos[b.id].nota)}</b></span>)}</div>

      </div>
    </div>
    <AvFeedbackResumo av={av} pdi={pdi} isRH={isRH} onConcluir={()=>onAcao("concluir",av)} onCriarPDI={()=>onAcao("criarPDI",av)} onIrPDI={()=>onAcao("irPDI",av)}/>
    <AvRevisoes av={av} isRH={isRH} ehGestor={ehGestor} onAbrir={()=>onAcao("abrirRevisao",av)} onDecidir={r=>onAcao("decidirRevisao",av,r)}/>
    {/* histórico */}
    <div ref={histRef} className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <div className="text-[11px] uppercase tracking-wide text-brand font-semibold mb-3">Histórico</div>

      <div className="space-y-2">{hist.map(h=><div key={h.id} className="flex gap-3 text-sm">
        <span className="text-xs text-slate-400 w-36 shrink-0">{fmtDH(h.em||h.emCliente)}</span>
        <div className="flex-1"><span className="font-medium text-slate-700">{ACAO_ROT[h.acao]||h.acao}</span>
          <span className="text-slate-400"> · {(h.ator&&(h.ator.nome||h.ator.email))||"Sistema"}</span>
          {(h.de!=null||h.para!=null)&&<span className="text-slate-500"> · {h.de!=null?`${/T/.test(h.de)?fmtDH(h.de):h.de} → `:""}{h.para!=null?(/T\d/.test(String(h.para))?fmtDH(h.para):String(h.para)):""}</span>}
          {h.justificativa&&<div className="text-xs text-slate-500 italic">“{h.justificativa}”</div>}
          {h.obs&&<div className="text-xs text-slate-400">{h.obs}</div>}</div></div>)}</div>
    </div>
  </div>;

function AvaliacoesView({pessoas,cargos,competencias,role,notify,fb,usuario,irParaPDI,foco,limparFoco}){
  const isRH=role==="RH";
  const [ciclos,setCiclos]=useState([]), [avaliacoes,setAvaliacoes]=useState([]), [carregado,setCarregado]=useState(false);
  useEffect(()=>{ if(!fb) return;
    const u1=fb.db.collection("aval_ciclos").onSnapshot(s=>setCiclos(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{console.error(e);notify("Sem permissão para ler os ciclos.");});
    const meu=String((usuario&&usuario.email)||"").toLowerCase();
    const q=isRH?fb.db.collection("avaliacoes"):fb.db.collection("avaliacoes").where("snapshot.contexto.gestor.email","==",meu); // gestor: só os liderados
    const u2=q.onSnapshot(s=>{ setAvaliacoes(s.docs.map(d=>({id:d.id,...d.data()}))); setCarregado(true); },e=>{console.error(e);setCarregado(true);});
    return ()=>{u1&&u1();u2&&u2();}; },[fb]);
  const db=useMemo(()=>fb?avalDB(fb):null,[fb]);
  const ator={tipo:"rh",email:(usuario&&usuario.email||"").toLowerCase(),nome:(usuario&&usuario.displayName)||""};
  // quem é o gestor registrado na avaliação atua como gestor; senão, como RH
  const atorPara=av=>av&&av.snapshot.contexto.gestor.email&&av.snapshot.contexto.gestor.email===ator.email?{...ator,tipo:"gestor"}:isRH?ator:{...ator,tipo:"gestor"};
  const cicloDe=av=>ciclos.find(c=>c.id===av.cicloId);
  const pessoaDe=av=>pessoas.find(p=>p.id===av.pessoaId);
  // sincroniza autoavaliações em aberto com o documento externo (ao abrir a tela)
  const sincronizado=useRef(false);
  useEffect(()=>{ if(!db||!isRH||!carregado||sincronizado.current) return; sincronizado.current=true;
    (async()=>{ for(const av of avaliacoes.filter(a=>!a.cancelada&&a.acesso&&["liberada","em_andamento"].includes(a.etapas.auto.estado))){
      try{ const ext=await db.lerExterno(av); const n=await db.sincronizar(av,ator,cicloDe(av),ext);
        if(AVAL.autoExpirada(n.etapas.auto,new Date().toISOString())&&!n.etapas.auto.expiracaoRegistradaEm) await db.executar(n,"registrarExpiracao",{},{tipo:"sistema",email:"",nome:"Sistema"},cicloDe(av));
      }catch(e){ console.warn("[sincronizar]",av.id,e); } } })(); },[db,carregado]);

  // filtros
  const [f,setF]=useState({q:"",ciclo:"",dep:"",cargo:"",gestor:"",status:"",ano:"",atrasadas:false,concluidas:false,grupo:""});
  const setFil=(k,v)=>setF(p=>({...p,[k]:v}));
  const limpar=()=>setF({q:"",ciclo:f.ciclo,dep:"",cargo:"",gestor:"",status:"",ano:"",atrasadas:false,concluidas:false,grupo:""});
  const agora=new Date().toISOString();
  const comStatus=avaliacoes.map(a=>({...a,_status:AVAL.derivarStatus(a,agora),_atrasada:AVAL.atrasada(a,agora)}));
  const doCiclo=comStatus.filter(a=>(!f.ciclo||a.cicloId===f.ciclo)&&(!f.ano||String((a.snapshot.contexto.ciclo.periodoFim||"").slice(0,4))===f.ano));

// =====================================================================
// MATRIZ DE PERFORMANCE — visão gerencial (somente leitura das avaliações concluídas)
// =====================================================================
const MZ_TOM={azul:{fill:"#eef2ff",stroke:"#c7d2fe",txt:"#3730a3"},neutro:{fill:"#f8fafc",stroke:"#e2e8f0",txt:"#334155"},
  ambar:{fill:"#fffbeb",stroke:"#fde68a",txt:"#92400e"},rosa:{fill:"#fff1f2",stroke:"#fecdd3",txt:"#9f1239"}};
const MZ_ATENCAO=["supera-abaixo","atende-abaixo","abaixo-supera","abaixo-atende","abaixo-abaixo"];
const familiaRot=id=>/^lideranca/.test(String(id))?"Liderança":/^nao-lideranca/.test(String(id))?"Não liderança":String(id||"—");
// deslocamento SÓ VISUAL para pessoas com notas iguais/próximas (as notas reais não mudam)
const jitterMatriz=pts=>{ const grupos={}; pts.forEach(p=>{ const k=Math.round(p.x*20)+"_"+Math.round(p.y*20); (grupos[k]=grupos[k]||[]).push(p); });
  const out=[]; Object.values(grupos).forEach(g=>{ if(g.length===1){ out.push({...g[0],dx:0,dy:0,grupo:1}); return; }
    g.forEach((p,i)=>{ const ang=(2*Math.PI*i)/g.length, r=g.length<=6?16:22; out.push({...p,dx:Math.cos(ang)*r,dy:Math.sin(ang)*r,grupo:g.length}); }); }); return out; };

// quebra o nome do posicionamento em até 3 linhas que caibam na área
const quebrarRotulo=(txt,maxC)=>{ const ws=String(txt).split(" "), out=[]; let cur="";
  ws.forEach(w=>{ if((cur+" "+w).trim().length<=maxC) cur=(cur+" "+w).trim(); else { if(cur) out.push(cur); cur=w; } }); if(cur) out.push(cur);
  return out.length>3?[...out.slice(0,2),out.slice(2).join(" ")]:out; };
function MatrizGrafico({pontos,limites,eixos,contagem,total,selZona,onZona,onPonto}){
  const W=640,H=560,M={l:64,r:16,t:16,b:56}, pw=W-M.l-M.r, ph=H-M.t-M.b;
  const sx=v=>M.l+((v-1)/3)*pw, sy=v=>M.t+(1-(v-1)/3)*ph;
  const [tip,setTip]=useState(null); const boxRef=useRef(null);
  const [l1,l2]=limites||AVAL.MATRIZ_LIMITES;
  const faixas=[["abaixo",1,l1],["atende",l1,l2],["supera",l2,4]];
  const pts=jitterMatriz(pontos);
  return <div ref={boxRef} className="relative overflow-x-auto">
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full min-w-[520px] select-none" style={{maxHeight:620}} role="img" aria-label="Matriz de Performance: Resultados e Entregas por Forma de Atuar">
      {faixas.map(([zx,x0,x1])=>faixas.map(([zy,y0,y1])=>{ const k=`${zx}-${zy}`, P=AVAL.POSICIONAMENTOS[k], t=MZ_TOM[P.tom]; const n=contagem[k]||0; const sel=selZona===k;
        return <g key={k} onClick={()=>onZona(sel?"":k)} style={{cursor:"pointer"}}>
          <rect x={sx(x0)} y={sy(y1)} width={sx(x1)-sx(x0)} height={sy(y0)-sy(y1)} fill={t.fill} stroke={sel?"#1a2e8a":t.stroke} strokeWidth={sel?2.5:1}/>
          <clipPath id={"mzc_"+k}><rect x={sx(x0)} y={sy(y1)} width={sx(x1)-sx(x0)} height={sy(y0)-sy(y1)}/></clipPath>
          <g clipPath={`url(#mzc_${k})`}>
            {quebrarRotulo(P.nome,(sx(x1)-sx(x0)-10)/6.3).map((ln,i)=><text key={i} x={sx(x0)+5} y={sy(y1)+13+i*11.5} fontSize="9.5" fontWeight="700" fill={t.txt}>{ln}</text>)}
            <text x={sx(x0)+5} y={sy(y1)+13+quebrarRotulo(P.nome,(sx(x1)-sx(x0)-10)/6.3).length*11.5} fontSize="9" fill={t.txt}>{n} {n===1?"pessoa":"pessoas"}{total?` · ${Math.round(n*100/total)}%`:""}</text>
          </g>
        </g>; }))}
      {[l1,l2].map(v=><g key={v}><line x1={sx(v)} x2={sx(v)} y1={M.t} y2={M.t+ph} stroke="#64748b" strokeDasharray="4 3"/><line x1={M.l} x2={M.l+pw} y1={sy(v)} y2={sy(v)} stroke="#64748b" strokeDasharray="4 3"/></g>)}
      <rect x={M.l} y={M.t} width={pw} height={ph} fill="none" stroke="#94a3b8"/>
      {[1,l1,l2,4].map(v=><g key={"t"+v}>
        <text x={sx(v)} y={M.t+ph+16} fontSize="10.5" textAnchor="middle" fill="#64748b">{v.toFixed(2).replace(".",",")}</text>
        <text x={M.l-8} y={sy(v)+4} fontSize="10.5" textAnchor="end" fill="#64748b">{v.toFixed(2).replace(".",",")}</text></g>)}
      <text x={M.l+pw/2} y={H-12} fontSize="12" fontWeight="700" textAnchor="middle" fill="#0f172a">{(eixos&&eixos.x)||"Resultados e Entregas"} →</text>
      <text transform={`translate(16 ${M.t+ph/2}) rotate(-90)`} fontSize="12" fontWeight="700" textAnchor="middle" fill="#0f172a">{(eixos&&eixos.y)||"Forma de Atuar"} →</text>
      {pts.map(p=>{ const cx=sx(p.x)+p.dx, cy=sy(p.y)+p.dy;
        return <g key={p.id} style={{cursor:"pointer"}} onClick={e=>{ e.stopPropagation(); onPonto(p.id); }}
          onMouseEnter={()=>setTip({p,cx,cy})} onMouseLeave={()=>setTip(t=>t&&t.p.id===p.id?null:t)}>
          {p.grupo>1&&<line x1={sx(p.x)} y1={sy(p.y)} x2={cx} y2={cy} stroke="#94a3b8" strokeWidth="0.8"/>}
          <circle cx={cx} cy={cy} r="13" fill="#1a2e8a" stroke="#fff" strokeWidth="2"/>
          <text x={cx} y={cy+3.5} fontSize="9.5" fontWeight="700" textAnchor="middle" fill="#fff">{initials(p.nome)}</text>
        </g>; })}
      {pts.filter(p=>p.grupo>1).length>0&&null}
    </svg>
    {tip&&<div className="absolute z-20 pointer-events-none bg-white border border-slate-200 shadow-xl rounded-lg p-3 text-xs w-60"
      style={{left:`calc(${(tip.cx/W)*100}% + 14px)`,top:`calc(${(tip.cy/H)*100}% - 10px)`,transform:tip.cx>W*0.6?"translateX(calc(-100% - 28px))":"none"}}>
      <div className="font-semibold text-navy text-sm">{tip.p.nome}</div>
      <div className="text-slate-500">{tip.p.cargo} · {tip.p.dep||"—"}</div>
      <div className="text-slate-500 mb-1.5">Gestor: {tip.p.gestor||"—"}</div>
      <div className="grid grid-cols-2 gap-x-2">
        <span className="text-slate-400">Resultados</span><b>{fmtNota(tip.p.x)}</b>
        <span className="text-slate-400">Forma de atuar</span><b>{fmtNota(tip.p.y)}</b>
        <span className="text-slate-400">Nota final</span><b>{fmtNota(tip.p.final)}</b></div>
      <div className="mt-1 text-slate-600">{tip.p.classificacao}</div>
      <div className="mt-1 font-semibold" style={{color:MZ_TOM[AVAL.POSICIONAMENTOS[tip.p.chave].tom].txt}}>{tip.p.posicionamento}</div>
    </div>}
  </div>;
}

              <div className="font-bold" style={{color:MZ_TOM[zonaSel.tom].txt}}>{zonaSel.nome}</div><div className="text-xs text-slate-500">{contagem[f.pos]||0} pessoa(s)</div></div>
              <button onClick={()=>setFil("pos","")} className="text-slate-400 hover:text-slate-600">✕</button></div>
            <div><div className="text-[11px] font-semibold text-slate-600">O que este posicionamento indica</div><p className="text-sm text-slate-700">{zonaSel.indica}</p></div>
            <div><div className="text-[11px] font-semibold text-slate-600">Orientação</div><p className="text-sm text-slate-700">{zonaSel.orientacao}</p></div>
            <div><div className="text-[11px] font-semibold text-slate-600">Pontos para discussão</div><ul className="text-sm text-slate-700 list-disc pl-5">{zonaSel.discussao.map((d,i)=><li key={i}>{d}</li>)}</ul></div>
            <p className="text-[11px] text-slate-400">A matriz apoia a decisão: as ações são definidas pelo gestor e pelo RH.</p></div>
          :<div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-2">Distribuição</div>
            {[...AVAL.ZONAS].reverse().flatMap(zx=>[...AVAL.ZONAS].reverse().map(zy=>`${zx}-${zy}`)).map(k=>{ const P=AVAL.POSICIONAMENTOS[k], n=contagem[k]||0;
              return <button key={k} onClick={()=>setFil("pos",k)} className="w-full flex items-center gap-2 text-sm py-1 hover:bg-slate-50 rounded px-1">
                <span className="w-3 h-3 rounded-sm border" style={{background:MZ_TOM[P.tom].fill,borderColor:MZ_TOM[P.tom].stroke}}/>
                <span className="flex-1 text-left text-slate-700">{P.nome}</span><b className="text-navy">{n}</b><span className="text-xs text-slate-400 w-10 text-right">{elegiveis.length?Math.round(n*100/elegiveis.length):0}%</span></button>; })}
          </div>}
        {semPos.length>0&&<div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
          <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">Sem avaliação elegível ({semPos.length})</div>
          {semPos.map(l=><div key={l.id} className="text-xs text-slate-600 py-0.5"><b className="text-slate-700">{l.nome}</b> — {l.pos.motivo}</div>)}</div>}
      </div>
    </div>
    {/* tabela sincronizada */}
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table className="w-full text-sm min-w-[1100px]"><thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <SortTh label="Colaborador" col="nome" sort={sort} onSort={toggle} className="px-4"/><SortTh label="Cargo" col="cargo" sort={sort} onSort={toggle}/>
        <SortTh label="Departamento" col="dep" sort={sort} onSort={toggle}/><SortTh label="Gestor" col="gestor" sort={sort} onSort={toggle}/>
        <SortTh label="Resultados" col="x" sort={sort} onSort={toggle} align="center"/><SortTh label="Forma de atuar" col="y" sort={sort} onSort={toggle} align="center"/>
        <SortTh label="Nota final" col="final" sort={sort} onSort={toggle} align="center"/><SortTh label="Classificação" col="classif" sort={sort} onSort={toggle}/>
        <SortTh label="Posicionamento" col="pos" sort={sort} onSort={toggle}/><SortTh label="PDI" col="pdi" sort={sort} onSort={toggle}/><th className="px-3 py-2.5"></th></tr></thead>
        <tbody>{ordenada.map(l=><tr key={l.id} className="border-t border-slate-100 hover:bg-slate-50">
          <td className="px-4 py-2.5"><button onClick={()=>setDet(l.id)} className="flex items-center gap-2.5 text-left"><Avatar nome={l.nome} foto={l.foto} pessoaId={l.pessoaId} fotoLocal={l.fotoLocal}/><span className="font-medium text-navy hover:text-brand">{l.nome}</span></button></td>
          <td className="px-3 py-2.5 text-slate-600">{l.cargo}</td><td className="px-3 py-2.5 text-slate-600">{l.dep||"—"}</td><td className="px-3 py-2.5 text-slate-600">{l.gestor||"—"}</td>
          <td className="px-3 py-2.5 text-center">{fmtNota(l.x)}</td><td className="px-3 py-2.5 text-center">{fmtNota(l.y)}</td><td className="px-3 py-2.5 text-center font-semibold">{fmtNota(l.final)}</td>
          <td className="px-3 py-2.5 text-slate-600">{l.classificacao}</td>
          <td className="px-3 py-2.5"><span className="text-xs font-semibold px-2 py-0.5 rounded-full border" style={{background:MZ_TOM[AVAL.POSICIONAMENTOS[l.chave].tom].fill,borderColor:MZ_TOM[AVAL.POSICIONAMENTOS[l.chave].tom].stroke,color:MZ_TOM[AVAL.POSICIONAMENTOS[l.chave].tom].txt}}>{l.posicionamento}</span>
            {!l.pos.consolidado&&<div className="text-[10px] text-amber-700 mt-0.5">não consolidado</div>}{(l.pos.avisos||[]).length>0&&<div className="text-[10px] text-amber-700">peso redistribuído</div>}</td>
          <td className="px-3 py-2.5 text-xs text-slate-600">{l.pdi?AVAL.STATUS_PDI[l.pdi.status]||l.pdi.status:"—"}</td>
          <td className="px-3 py-2.5 text-right"><button onClick={()=>setDet(l.id)} className="text-sm text-brand hover:underline">Detalhe</button></td></tr>)}
          {!ordenada.length&&<tr><td colSpan="11" className="px-4 py-10 text-center text-slate-400">Nenhum colaborador corresponde aos filtros selecionados.</td></tr>}</tbody></table></div>
    <p className="text-[11px] text-slate-400">A ordenação serve para leitura e não representa ranking. Avaliação e matriz são conceitos separados: a classificação final vem da avaliação; o posicionamento vem de Resultados × Forma de Atuar.</p>
    </>}
    {/* detalhe do colaborador */}
    {detL&&<Slide titulo={detL.nome} sub={`${detL.cargo} · ${detL.dep||"—"}`} onClose={()=>setDet(null)}>
      {(()=>{ const a=detL.av, r=a.conclusao.resultado, P=detL.pos.elegivel?AVAL.POSICIONAMENTOS[detL.chave]:null, fbk=a.feedback||{};
        const nb=id=>r.blocos[id]?fmtNota(r.blocos[id].notaArred!=null?r.blocos[id].notaArred:r.blocos[id].nota):"—";
        return <div className="space-y-4">
          <div className="flex items-center gap-3"><Avatar nome={detL.nome} foto={detL.foto} pessoaId={detL.pessoaId} fotoLocal={detL.fotoLocal} lg/>
            <div className="text-sm text-slate-600"><div>Gestor: <b>{detL.gestor||"—"}</b></div><div>{a.snapshot.contexto.ciclo.nome} · concluída em {fmtD(a.conclusao.em)}</div></div></div>
          <div className="grid grid-cols-3 gap-2">
            <MiniCard t="Resultados" v={nb("resultados")}/>{r.blocos.lideranca&&<MiniCard t="Liderança" v={nb("lideranca")}/>}<MiniCard t="Cultura" v={nb("cultura")}/>
            <MiniCard t="Forma de atuar" v={fmtNota(detL.y)}/><MiniCard t="Nota final" v={fmtNota(r.finalArred)} sub={r.classificacao}/></div>
          {P?<div className="rounded-lg border p-3" style={{background:MZ_TOM[P.tom].fill,borderColor:MZ_TOM[P.tom].stroke}}>
              <div className="text-[11px] uppercase tracking-wide text-slate-500">Posicionamento na matriz</div>
              <div className="font-bold" style={{color:MZ_TOM[P.tom].txt}}>{P.nome}</div><p className="text-xs text-slate-700 mt-1">{P.indica}</p>
              {(detL.pos.avisos||[]).map((x,i)=><p key={i} className="text-[11px] text-amber-700 mt-1">{x}</p>)}</div>
            :<div className="text-sm text-slate-500">Este colaborador ainda não possui avaliação elegível para posicionamento: {detL.pos.motivo}</div>}
          <Info l="Principais contribuições">{fbk.contribuicoes||"—"}</Info>
          <Info l="Principais pontos de desenvolvimento">{fbk.desenvolvimento||"—"}</Info>
          <Info l="Mensagem central do gestor">{fbk.mensagemCentral||"—"}</Info>
          <Info l="PDI">{detL.pdi?AVAL.STATUS_PDI[detL.pdi.status]||detL.pdi.status:"Sem PDI vinculado"}</Info>
          <div className="flex gap-2 pt-1">
            {irParaAvaliacao&&<button onClick={()=>irParaAvaliacao(a.id)} className="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-md hover:bg-slate-50">Ver avaliação</button>}
            {a.pdiId&&irParaPDI&&<button onClick={()=>irParaPDI(a.pdiId)} className="flex-1 px-3 py-2 text-sm rounded-md bg-brand hover:bg-navy text-white">Ir para o PDI</button>}</div>
          <p className="text-[11px] text-slate-400">A matriz é só visualização. Alterações de notas acontecem no módulo Avaliação de Desempenho.</p>
        </div>; })()}
    </Slide>}
  </div></main>;
}

function CompetenciasView({competencias,setCompetencias,cargos,role,busca,notify}){
  const isRH=role==="RH";
  const [tipo,setTipo]=useState("comportamental");
  const [aba,setAba]=useState("dic");
  const [grupoF,setGrupoF]=useState("");
  const [gerGrupos,setGerGrupos]=useState(false);
  const [nomesEdit,setNomesEdit]=useState({});
  const {sort:sortComp,toggle:toggleSortComp,sortBy:sortByComp}=useSort("codigo","asc");
  const [q,setQ]=useState("");
  const [edit,setEdit]=useState(null);
  const [mostrarInativas,setMostrarInativas]=useState(true);
  const [ver,setVer]=useState(null);
  const doTipo=(competencias||[]).filter(c=>c.tipo===tipo);
  const termo=(q||busca||"").trim().toLowerCase();
  const gruposDoTipo=[...new Set(doTipo.map(c=>c.grupo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const filtrada=sortByComp(doTipo.filter(c=>{
    if(!mostrarInativas&&c.status==="INATIVA")return false;
    if(grupoF==="__sem"){ if(c.grupo)return false; } else if(grupoF&&(c.grupo||"")!==grupoF)return false;
    if(!termo)return true;
    return [c.nome,c.codigo,c.conceito,c.grupo,c.aplicabilidade,...LISTAS_COMP.flatMap(([k])=>c[k]||[])].filter(Boolean).join(" ").toLowerCase().includes(termo);
  }),{
    codigo:c=>c.codigo||"",
    nome:c=>c.nome||"",
    grupo:c=>c.grupo||"",
    aplicabilidade:c=>c.aplicabilidade||"",
    detalhe:c=>LISTAS_COMP.reduce((s,[k])=>s+((c[k]||[]).length),0),
    niveis:c=>NIVEIS_EXIG.filter(([k])=>String(c.niveis?.[k]||"").trim()).length,
    perguntas:c=>nPerguntas(c),
    status:c=>c.status==="INATIVA"?"Inativa":"Ativa",
  });
  const salvar=comp=>{
    setCompetencias(prev=>{
      const i=prev.findIndex(x=>x.id===comp.id);
      if(i>=0){const c=[...prev];c[i]={...comp,atualizadoEm:hoje()};return c;}
      return [...prev,{...comp,criadoEm:hoje(),atualizadoEm:hoje()}];
    });
    notify(`"${comp.nome}" salva ✓`); setEdit(null);
  };
  const excluir=c=>{ if(!window.confirm(`Excluir a competência "${c.nome}"? Esta ação não pode ser desfeita.`))return;
    setCompetencias(prev=>prev.filter(x=>x.id!==c.id)); notify("Competência excluída."); };
  const alternar=c=>setCompetencias(prev=>prev.map(x=>x.id===c.id?{...x,status:x.status==="INATIVA"?"ATIVA":"INATIVA",atualizadoEm:hoje()}:x));
  const exportarExcel=()=>{
    try{
      const lst=a=>(a||[]).filter(Boolean).map((p,i)=>`${i+1}. ${p}`).join("\n");
      const linhas=doTipo.map(c=>{
        const o={"ID":c.codigo||"","Competência":c.nome||"","Tipo":c.tipo==="tecnica"?"Técnica":"Comportamental","Grupo":c.grupo||"","Aplicabilidade":c.aplicabilidade||"","Conceito":c.conceito||""};
        LISTAS_COMP.forEach(([k,titulo])=>{o[titulo]=lst(c[k]);});
        NIVEIS_EXIG.forEach(([k,l])=>{o[l]=c.niveis?.[k]||"";});
        o["Cargos indicados"]=(c.cargosIndicados||[]).map(id=>{const cg=(cargos||[]).find(x=>x.id===id);return cg?cg.titulo:"";}).filter(Boolean).join("; ");
        o["Status"]=c.status==="INATIVA"?"Inativa":"Ativa";
        return o;
      });
      if(!linhas.length){notify("Nada para exportar.");return;}
      const ws=XLSX.utils.json_to_sheet(linhas);const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,tipo==="tecnica"?"Técnicas":"Comportamentais");
      XLSX.writeFile(wb,`dicionario-competencias-${tipo}.xlsx`);
    }catch(e){notify("Falha ao exportar: "+String(e.message||e).slice(0,60));}
  };
  const importarCompetencias=(linhas)=>{
    let criados=0,atualizados=0,erros=0;
    const idPorTitulo={}; (cargos||[]).forEach(cg=>{idPorTitulo[(cg.titulo||"").trim().toLowerCase()]=cg.id;});
    const resolverCargos=txt=>String(txt||"").split(/[;\n]/).map(s=>s.trim()).filter(Boolean)
      .map(t=>idPorTitulo[t.toLowerCase()]).filter(Boolean);
    setCompetencias(prev=>{
      const lista=[...prev];
      for(const L of linhas){
        try{
          const cargosInd=resolverCargos(L.cargosIndicadosTxt);
          const i=lista.findIndex(c=>(L.codigo&&(c.codigo||"").trim().toLowerCase()===L.codigo.trim().toLowerCase())
            ||(!L.codigo&&c.tipo===L.tipo&&(c.nome||"").trim().toLowerCase()===L.nome.trim().toLowerCase()));
          if(i>=0){
            const ant=lista[i]; const m={...ant,nome:L.nome,tipo:L.tipo,status:L.status,atualizadoEm:hoje()};
            if(L.codigo)m.codigo=L.codigo;
            ["grupo","conceito","aplicabilidade"].forEach(k=>{if(L[k])m[k]=L[k];});
            ["comportamentos","evidencias","criterios","kpis","perguntas","treinamentos"].forEach(k=>{if(L[k]&&L[k].length)m[k]=L[k];});
            if(Object.keys(L.niveis||{}).length)m.niveis={...(ant.niveis||{}),...L.niveis};
            if(cargosInd.length)m.cargosIndicados=cargosInd;
            lista[i]=m; atualizados++;
          } else {
            const nums=lista.map(c=>{const mm=/(\d+)\s*$/.exec(c.codigo||"");return mm?parseInt(mm[1],10):0;});
            lista.push({id:uid(),codigo:L.codigo||`COMP-${String((nums.length?Math.max(...nums):0)+1).padStart(4,"0")}`,
              tipo:L.tipo,nome:L.nome,grupo:L.grupo,aplicabilidade:L.aplicabilidade||"",conceito:L.conceito,
              comportamentos:L.comportamentos,evidencias:L.evidencias,criterios:L.criterios,kpis:L.kpis,
              perguntas:L.perguntas,treinamentos:L.treinamentos,niveis:L.niveis||{},cargosIndicados:cargosInd,
              status:L.status,criadoEm:hoje(),atualizadoEm:hoje()});
            criados++;
          }
        }catch(e){ console.error(e); erros++; }
      }
      return lista;
    });
    return {criados,atualizados,erros};
  };
  const baixarModelo=()=>{
    try{
      const exemplo=[
        {"ID":"COM-001","Competência":"Comunicação Assertiva","Tipo":"Comportamental","Grupo":"Comunicação",
         "Conceito":"Expressa ideias com clareza e respeito, adaptando a mensagem ao interlocutor.",
         "Comportamentos esperados":"Fala de forma objetiva em reuniões\nDá retorno direto sem desqualificar o outro",
         "Evidências observáveis":"Registros de reunião com encaminhamentos claros\nAusência de retrabalho por ruído de comunicação",
         "Critérios de avaliação":"Consistência ao longo do período, não apenas casos isolados\nComportamento mantido sob pressão",
         "Indicadores mensuráveis (KPIs)":"% de retrabalho por falha de comunicação\nNota de clima na dimensão comunicação",
         "Perguntas comportamentais":"Conte uma situação em que você precisou dar um retorno difícil.\nComo você adapta sua comunicação para públicos diferentes?",
         "Nível 1":"Comunica-se de forma reativa, apenas quando solicitado.",
         "Nível 2":"Expõe suas ideias com clareza em situações rotineiras.",
         "Nível 3":"Adapta a mensagem ao interlocutor e confirma o entendimento.",
         "Nível 4":"Conduz conversas difíceis e media divergências na equipe.",
         "Nível 5":"É referência: forma outros e representa a área em fóruns externos.",
         "Treinamentos recomendados":"Comunicação Não Violenta — 16h\nOratória aplicada — 8h",
         "Cargos indicados":"Supervisor de Produção; Coordenador de Vendas","Status":"Ativa"},
        {"ID":"TEC-001","Competência":"Operação de Envase","Tipo":"Técnica","Grupo":"Produção e Processo",
         "Conceito":"Opera a linha de envase conforme parâmetros de processo e padrões de qualidade.",
         "Comportamentos esperados":"Realiza setup conforme procedimento\nRegistra parâmetros a cada troca de lote",
         "Evidências observáveis":"Fichas de processo preenchidas corretamente\nLotes dentro da faixa de peso especificada",
         "Critérios de avaliação":"Autonomia na operação\nCapacidade de identificar desvio antes do lote seguir",
         "Indicadores mensuráveis (KPIs)":"% de lotes dentro da especificação\nTempo médio de setup",
         "Perguntas comportamentais":"Descreva o procedimento de setup da envasadora.\nO que você faz ao identificar variação de peso?",
         "Nível 1":"Opera com supervisão direta em produtos de baixa complexidade.",
         "Nível 2":"Opera com autonomia a linha padrão e registra os parâmetros.",
         "Nível 3":"Executa setup completo e corrige desvios simples sozinho.",
         "Nível 4":"Ajusta processo em produtos novos e treina operadores.",
         "Nível 5":"Define parâmetros de processo e conduz melhorias na linha.",
         "Treinamentos recomendados":"Boas Práticas de Fabricação — 8h\nOperação de envasadora — treinamento interno",
         "Cargos indicados":"Auxiliar de Produção; Supervisor de Produção","Status":"Ativa"},
      ];
      const ws=XLSX.utils.json_to_sheet(exemplo);
      ws["!cols"]=[{wch:10},{wch:26},{wch:16},{wch:22},{wch:46},{wch:46},{wch:46},{wch:46},{wch:46},{wch:46},
        {wch:40},{wch:40},{wch:40},{wch:40},{wch:40},{wch:40},{wch:38},{wch:10}];
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Competências");
      XLSX.writeFile(wb,"modelo-competencias.xlsx");
    }catch(e){notify("Falha ao gerar modelo: "+String(e.message||e).slice(0,60));}
  };
  const abrirGerGrupos=()=>{
    const m={}; gruposDoTipo.forEach(g=>{m[g]=g;});
    setNomesEdit(m); setGerGrupos(v=>!v);
  };
  const renomearGrupo=antigo=>{
    const novo=String(nomesEdit[antigo]||"").trim();
    if(!novo){notify("O nome do grupo não pode ficar vazio.");return;}
    if(novo===antigo){notify("Nada a alterar.");return;}
    const existe=gruposDoTipo.some(g=>g!==antigo&&g.toLowerCase()===novo.toLowerCase());
    const qtd=doTipo.filter(c=>(c.grupo||"")===antigo).length;
    if(existe&&!window.confirm(`Já existe o grupo "${novo}".\n\nAs ${qtd} competência(s) de "${antigo}" serão movidas para ele (os dois grupos serão mesclados). Continuar?`))return;
    setCompetencias(prev=>prev.map(c=>c.tipo===tipo&&(c.grupo||"")===antigo?{...c,grupo:novo,atualizadoEm:hoje()}:c));
    if(grupoF===antigo)setGrupoF(novo);
    setNomesEdit(m=>{const n={...m};delete n[antigo];n[novo]=novo;return n;});
    notify(existe?`Grupos mesclados em "${novo}" (${qtd} competência(s)).`:`Grupo renomeado para "${novo}" em ${qtd} competência(s).`);
  };
  const removerGrupo=g=>{
    const qtd=doTipo.filter(c=>(c.grupo||"")===g).length;
    if(!window.confirm(`Remover o grupo "${g}"?\n\n${qtd} competência(s) ficarão sem grupo. As competências NÃO são excluídas.`))return;
    setCompetencias(prev=>prev.map(c=>c.tipo===tipo&&(c.grupo||"")===g?{...c,grupo:"",atualizadoEm:hoje()}:c));
    if(grupoF===g)setGrupoF("");
    setNomesEdit(m=>{const n={...m};delete n[g];return n;});
    notify(`Grupo "${g}" removido de ${qtd} competência(s).`);
  };
  const bkp=(()=>{try{const v=localStorage.getItem("bsk_competencias_bkp");const a=v?JSON.parse(v):[];return Array.isArray(a)?a:[];}catch{return [];}})();
  const restaurarBkp=()=>{
    if(!bkp.length)return;
    if(!window.confirm(`Restaurar ${bkp.length} competência(s) da cópia local?\n\nElas voltarão para o dicionário e serão sincronizadas com a nuvem.`))return;
    setCompetencias(bkp);
    notify(`${bkp.length} competência(s) restaurada(s).`);
  };
  const rotuloDic=tipo==="tecnica"?"Técnicas (hard skills)":"Comportamentais (soft skills)";
  const nComp=(competencias||[]).filter(c=>c.tipo==="comportamental").length;
  const nTec=(competencias||[]).filter(c=>c.tipo==="tecnica").length;
  const nCore=doTipo.reduce((s,c)=>s+nPerguntas(c),0);
  const nIncompletas=doTipo.filter(c=>NIVEIS_EXIG.filter(([k])=>String(c.niveis?.[k]||"").trim()).length<NIVEIS_EXIG.length||(c.comportamentos||[]).length===0||nPerguntas(c)===0).length;
  const card=(t,v,sub,cor)=><div className="bg-white rounded-xl border border-slate-200 shadow-sm px-4 py-3">
    <div className="text-[11px] uppercase tracking-wide text-slate-400">{t}</div>
    <div className={"text-3xl font-bold "+(cor||"text-navy")}>{v}</div>
    {sub&&<div className="text-[11px] text-slate-400 mt-0.5">{sub}</div>}</div>;

  if(edit) return <CompetenciaForm comp={edit} tipo={tipo} existentes={competencias||[]} cargos={cargos||[]} onClose={()=>setEdit(null)} onSave={salvar}/>;

  return <main className="flex-1 overflow-auto"><div className="p-5 space-y-4">
    <div className="flex items-center justify-between flex-wrap gap-3">
      <div className="flex items-center gap-2.5">
        <span className="w-10 h-10 grid place-items-center rounded-xl bg-brand/10 text-brand"><IcBuilding size={22}/></span>
        <div><h1 className="text-xl font-bold text-navy">Competências</h1>
          <p className="text-sm text-slate-500">Dicionário corporativo — alimenta os descritivos de cargo, avaliações e PDI</p></div>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        <button onClick={baixarModelo} className="text-sm px-3 py-2 rounded-md border border-slate-300 text-slate-500 hover:bg-slate-50" title="Baixa uma planilha de exemplo com as colunas certas">Modelo</button>
        <div className="flex items-center rounded-md border border-slate-300 overflow-hidden text-sm">
          <span className="px-2.5 py-2 text-slate-400 text-xs bg-slate-50 border-r border-slate-200">Exportar</span>
          <button onClick={exportarExcel} className="px-2.5 py-2 text-slate-600 hover:bg-slate-50" title="Exporta o dicionário aberto em planilha">Excel</button>
          <button onClick={()=>exportarCompsPDF(filtrada,cargos||[],rotuloDic,notify)} className="px-2.5 py-2 text-slate-600 hover:bg-slate-50 border-l border-slate-200" title="Exporta em PDF as competências que estão na lista">PDF</button>
          <button onClick={()=>exportarCompsWord(filtrada,cargos||[],rotuloDic,notify)} className="px-2.5 py-2 text-slate-600 hover:bg-slate-50 border-l border-slate-200" title="Exporta em Word as competências que estão na lista">Word</button>
        </div>
        {isRH&&<>
          <button onClick={()=>document.getElementById("importCompInput")?.click()} className="text-sm px-3 py-2 rounded-md border border-slate-300 text-slate-600 hover:bg-slate-50">Importar Excel</button>
          <input id="importCompInput" type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={e=>importarCompetenciasExcel(e,importarCompetencias,notify,()=>{e.target.value="";},tipo)}/>

        </>}
      </div>
    </div>

    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
