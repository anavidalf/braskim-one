<script type="text/babel" data-type="module" data-presets="react">
import React,{useState,useMemo,useEffect,useRef} from "react";
import {createRoot} from "react-dom/client";

/* ==================================================================
   SISTEMA OPERACIONAL BRASKIM — App unificado
   Módulos: Pessoas (CRM) + Organograma · estado e Firebase compartilhados
   Fonte Única da Verdade · Arquitetura Orientada a Eventos
   ================================================================== */

// ---------- helpers ----------
const uid=()=>Math.random().toString(36).slice(2,10);
// remove valores undefined recursivamente (Firestore não aceita undefined em set/add)
const semUndefined=obj=>{
  if(obj===undefined) return null;
  if(obj===null||typeof obj!=="object") return obj;
  if(Array.isArray(obj)) return obj.map(v=>v===undefined?null:semUndefined(v));
  const out={};
  for(const k of Object.keys(obj)){ const v=obj[k]; if(v===undefined) continue; out[k]=semUndefined(v); }
  return out;
};
const hoje=()=>new Date().toISOString().slice(0,10);
const brDate=s=>s?s.split("-").reverse().join("/"):"—";
const fmtCPF=v=>{const d=v.replace(/\D/g,"").slice(0,11);return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,"$1.$2.$3-$4").replace(/(\d{3})(\d{1,3})$/,"$1.$2").replace(/(\d{1,3})$/,"$1");};
const fmtTel=v=>{const d=v.replace(/\D/g,"").slice(0,11);if(d.length<=2)return d.length?`(${d}`:"";if(d.length<=7)return `(${d.slice(0,2)}) ${d.slice(2)}`;return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;};

const initials=n=>(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
// "Carlos Alberto Souza" -> "Carlos A."; "Ana" -> "Ana"
const nomeCurto=n=>{const p=(n||"").trim().split(/\s+/).filter(Boolean);if(!p.length)return "";return p.length===1?p[0]:`${p[0]} ${p[1][0].toUpperCase()}.`;};
const money=v=>v==null||v===""?"—":Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const parseSal=v=>{if(v==null||v==="")return 0;if(typeof v==="number")return v;const s=String(v).trim();if(s.includes(","))return parseFloat(s.replace(/\./g,"").replace(",","."))||0;return parseFloat(s)||0;};
const fmtSalInput=v=>{if(v==null||v==="")return "";const n=parseSal(v);if(!n)return "";return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});};
const idade=s=>{if(!s)return"—";const d=new Date(s),t=new Date();let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a+" anos";};
const faixa=s=>s<3000?"Faixa A":s<5000?"Faixa B":s<7000?"Faixa C":"Faixa D";
const addMeses=(d,n)=>{ if(!d)return ""; const [y,m,dd]=d.split("-").map(Number); const dt=new Date(y,m-1+n,dd); return dt.toISOString().slice(0,10); };
const fmtRev=n=>"REV"+String(n||1).padStart(2,"0");
const revVencida=c=>!!(c&&c.proximaRevisao&&c.proximaRevisao<=hoje());
const CARGO_META_KEYS=["id","status","criadoEm","revisao","dataRevisao","proximaRevisao","revisoes","_motivo"];
const snapshotCargo=c=>{const o={};Object.keys(c||{}).forEach(k=>{if(!CARGO_META_KEYS.includes(k))o[k]=c[k];});return JSON.parse(JSON.stringify(o));};
const proximoCodigoBKM=cargos=>{let max=0;(cargos||[]).forEach(c=>{const m=/BKM-(\d+)/.exec(c.codigo||"");if(m)max=Math.max(max,parseInt(m[1],10));});return "BKM-"+String(max+1).padStart(4,"0");};
const randCPF=()=>{const r=()=>Math.floor(Math.random()*10);return `${r()}${r()}${r()}.${r()}${r()}${r()}.${r()}${r()}${r()}-${r()}${r()}`;};
const evt=(tipo,pessoaId,resumo,ts,origem="pessoas")=>({id:uid(),tipo,pessoaId,resumo,timestamp:ts||new Date().toISOString(),origemModulo:origem,autor:"sistema"});
const nameOf=n=>n.type==="pessoa"?n.pessoa.nome:n.type==="vaga"?n.vaga.cargo:n.name;

const STATUS={
  ATIVO:{label:"Ativo",dot:"bg-emerald-500",cls:"bg-emerald-50 text-emerald-700 ring-emerald-200"},
  AFASTADO:{label:"Afastado",dot:"bg-amber-500",cls:"bg-amber-50 text-amber-700 ring-amber-200"},
  DESLIGADO:{label:"Desligado",dot:"bg-slate-400",cls:"bg-slate-100 text-slate-500 ring-slate-200"},
};
const SETORES=["Formulação","Envase","Qualidade","Logística","Comercial","Administrativo","Manutenção"];
const CONTRATOS=["CLT","Aprendiz","Estágio","Temporário","PJ"];
const EVENTO_META={
  PessoaCriada:{c:"#1a2e8a",t:"Cadastro criado"},PessoaAdmitida:{c:"#16a34a",t:"Admissão"},
  DadosPessoaisAlterados:{c:"#0ea5e9",t:"Dados alterados"},CargoAlterado:{c:"#1a2e8a",t:"Mudança de cargo"},
  AlteracaoSalarial:{c:"#7c3aed",t:"Alteração salarial"},MudancaDeLider:{c:"#0ea5e9",t:"Mudança de líder"},
  DocumentoAnexado:{c:"#64748b",t:"Documento anexado"},PessoaAfastada:{c:"#d97706",t:"Afastamento"},
  PessoaRetornou:{c:"#16a34a",t:"Retorno ao trabalho"},PessoaDesligada:{c:"#64748b",t:"Desligamento"},
};

const OBRIG=["nome","nascimento","rg","cpf","sexo","email","endereco","complemento","bairro","cidade","cep","telefone","estadoCivil","escolaridade","formacao"],
  OBRIG_VINC=["matricula","ctps","esocial","pis","tipo","cargo","cbo","setor","lider","admissao","salario"],
  OBRIG_BANCO=["banco","agencia","conta","pix","tipoPix"],
  OBRIG_OUT=["camiseta","calcado"],
  OBRIG_EMG=["nome","parentesco","telefone"];
const completude=p=>{
  const tot=OBRIG.length+OBRIG_VINC.length+OBRIG_BANCO.length+OBRIG_OUT.length+OBRIG_EMG.length;
  const ok=OBRIG.filter(k=>p[k]).length
    +OBRIG_VINC.filter(k=>p.vinculo?.[k]).length
    +OBRIG_BANCO.filter(k=>(p.banco||{})[k]).length
    +OBRIG_OUT.filter(k=>(p.outras||{})[k]).length
    +OBRIG_EMG.filter(k=>(p.emergencia||{})[k]).length;
  return Math.round(ok/tot*100);
};

// ---------- seed compartilhado (8 pessoas, dados ricos) ----------
function mk(nome,sexo,nasc,email,setor,cargo,unid,sal,contrato,adm,status,comp){
  const lideres={Formulação:"Diretoria Industrial",Envase:"Roberto Dias Nogueira",Qualidade:"Ana Vidal Ferreira",Logística:"Diretoria Industrial",Comercial:"Diretoria Comercial",Administrativo:"Diretoria Adm."};
  return {id:uid(),nome,cpf:randCPF(),nascimento:nasc,email,telefone:"(12) 9"+Math.floor(1000+Math.random()*8999)+"-"+Math.floor(1000+Math.random()*8999),
    status,organizacaoId:"braskim",escolaridade:setor==="Comercial"?"Superior incompleto":"Superior completo",
    formacao:setor==="Formulação"?"Química":setor==="Qualidade"?"Eng. Química":"—",
    dependentes:status==="DESLIGADO"?0:Math.floor(Math.random()*3),tags:setor==="Formulação"?["chave"]:[],observacoes:"",competencias:comp,
    vinculo:{matricula:"BRK"+Math.floor(10000+Math.random()*89999),cargo,setor,unidade:unid,lider:lideres[setor]||"—",
      tipoContrato:contrato,jornada:"44h semanais",salario:sal,faixaSalarial:faixa(sal),admissao:adm,desligamento:status==="DESLIGADO"?"2025-11-30":""},
    documentos:[{tipo:"RG/CPF",nome:"documentos.pdf",validade:"",status:"VÁLIDO"},
      {tipo:"ASO",nome:"aso-admissional.pdf",validade:status==="ATIVO"?"2026-03-01":"2025-01-01",status:status==="ATIVO"?"VÁLIDO":"VENCIDO"}]};
}
const seedPessoas=()=>[];
// catálogo de testes comportamentais (igual ao Orbit)
const TESTES_CATALOGO=[
  {id:"eneagrama",nome:"Eneagrama",cor:"#f59e0b",dica:"Tipo de personalidade (1 a 9)"},
  {id:"bigfive",nome:"Big Five",cor:"#8b5cf6",dica:"5 grandes fatores"},
  {id:"hogan",nome:"Hogan",cor:"#ef4444",dica:"Traços de liderança"},
  {id:"vak",nome:"VAK",cor:"#0ea5e9",dica:"Canal de aprendizagem"},
  {id:"disc",nome:"DISC",cor:"#ec4899",dica:"Perfil comportamental"},
];
const seedEventos=pessoas=>{const ev=[];pessoas.forEach(p=>{
  ev.push(evt("PessoaCriada",p.id,"Cadastro criado no sistema",p.vinculo.admissao+"T09:00:00"));
  ev.push(evt("PessoaAdmitida",p.id,`Admitido(a) como ${p.vinculo.cargo} · ${p.vinculo.setor}`,p.vinculo.admissao+"T09:05:00"));
  if(p.status==="AFASTADO")ev.push(evt("PessoaAfastada",p.id,"Afastamento iniciado (atestado)","2025-10-15T08:00:00"));
  if(p.status==="DESLIGADO")ev.push(evt("PessoaDesligada",p.id,"Desligamento — pedido de demissão",p.vinculo.desligamento+"T17:00:00"));
});return ev;};

// ---------- catálogo de cargos (Cargo é Objeto Mestre; o Vínculo referencia por título) ----------
const NIVEIS=["01","02","03","04","05","06","07","08","09","10"]; // nível da trilha (senioridade)
const CLASSIFICACOES=["Estratégico","Tático","Operacional"]; // nível do cargo
const _ROMANOS={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10};
// índice 0-based de senioridade; aceita tanto o legado romano ("I") quanto o novo numérico ("01"/"1")
const nivelIdx=n=>{ if(n==null||n==="")return -1; const s=String(n).trim();
  if(_ROMANOS[s.toUpperCase()])return _ROMANOS[s.toUpperCase()]-1;
  const num=parseInt(s,10); return isNaN(num)?-1:num-1; };
// critérios objetivos para SER PROMOVIDO A ESTE cargo (avaliados pelo sistema)
const CRIT_ENTRY={tempoMinMeses:0,notaMinAvaliacao:0,exigeCompetenciasObrig:false};
// rotina de gestão (só cargos de nível Estratégico)
const FREQ_ROTINA=[["diaria","Rotina Diária"],["semanal","Rotina Semanal"],["mensal","Rotina Mensal"],["anual","Rotina Trimestral / Anual"]];
const ehEstrategico=c=>(c?.classificacao||"")==="Estratégico";
const COLS_ROTINA=[["rotina","Rotina"],["frequencia","Frequência"],["participantes","Participantes"],["duracao","Duração"],["objetivo","Objetivo principal"]];
const COLS_INDIC=[["indicador","Indicador"],["objetivo","Objetivo"],["frequencia","Frequência"]];
const linhaVazia=cols=>Object.fromEntries([["id",uid()],...cols.map(([k])=>[k,""])]);
const linhaPreenchida=cols=>r=>cols.some(([k])=>String(r[k]||"").trim());
// indicadores em tabela; cargos antigos (lista simples) viram linhas só com o nome do indicador
const indicadoresDe=c=>{ if(Array.isArray(c?.indicadoresTab)&&c.indicadoresTab.length) return c.indicadoresTab;
  return (c?.indicadores||[]).filter(x=>String(x||"").trim()).map(t=>({id:uid(),indicador:t,objetivo:"",frequencia:""})); };
const rotinasDe=c=>{ if(Array.isArray(c?.rotinasGestao)&&c.rotinasGestao.length) return c.rotinasGestao;
  const rg=c?.rotinaGestao||{}, out=[];
  [["diaria","Diária"],["semanal","Semanal"],["mensal","Mensal"],["anual","Trimestral / Anual"]].forEach(([k,l])=>(rg[k]||[]).forEach(t=>out.push({id:uid(),rotina:t,frequencia:l,participantes:"",duracao:"",objetivo:""})));
  return out; };
const CRIT_II={tempoMinMeses:12,notaMinAvaliacao:3.0,exigeCompetenciasObrig:false};
const CRIT_III={tempoMinMeses:24,notaMinAvaliacao:3.5,exigeCompetenciasObrig:true};
const cg=o=>({id:uid(),status:"ATIVO",criadoEm:"18/03/2026",
  departamento:"",cargoSuperior:"",cbo:"",escolaridadeMinima:"",tempoExperiencia:"",detalhesExperiencia:"",certificacoes:"",
  nivelAutonomia:"",supervisionaPessoas:false,cuidaBensMateriais:false,lidaValoresFinanceiros:false,acessaInfoConfidenciais:false,relacionamentoCliente:"",
  metas:[],indicadores:[],conhecimentos:[],habilidades:[],atitudes:[],
  desafios:"",recursosFerramentas:"",cargosAnteriores:[],proximosPassos:[],
  atividades:{diarias:[],semanais:[],quinzenais:[],mensais:[],esporadicas:[],anuais:[]},treinamentos:[],
  revisao:1,dataRevisao:"2026-03-18",proximaRevisao:"2027-03-18",revisoes:[],
  responsabilidades:[],competenciasObrig:[],competenciasDesej:[],requisitos:{formacao:"—",experienciaMeses:0},criterios:CRIT_ENTRY,...o});
const DEP_MAP={"Operação de Envase":"Produção","Qualidade":"Qualidade e P&D","Pesquisa & Desenvolvimento":"Qualidade e P&D","Logística":"Logística","Comercial":"Comercial & Marketing","Financeiro":"Financeiro"};
const GER_MAP={"Operação de Envase":"Supervisor de Produção","Qualidade":"Coordenador de Operações","Pesquisa & Desenvolvimento":"Diretoria Industrial","Logística":"Coordenador de Operações","Comercial":"Gerente Comercial","Financeiro":"Diretor"};
const ESCOLARIDADES=["Ensino fundamental","Ensino médio","Curso técnico","Superior incompleto","Superior completo","Pós-graduação"];
const ESCOLARIDADES_PESSOA=["Ensino Médio Incompleto","Ensino Médio Completo","Ensino Superior Cursando","Ensino Superior Completo","Pós-Graduação"];
const TEMPOS_EXP=["Sem experiência","Até 1 ano","1 a 3 anos","3 a 5 anos","Mais de 5 anos"];
const AUTONOMIAS=["Baixa","Média","Alta","Total"];
const RELAC_CLIENTE=["Nenhum","Interno","Externo eventual","Externo frequente"];
const seedCargos=()=>{ const base=[
  // Operação de Envase
  cg({codigo:"OPE-01",titulo:"Operador de Envase I",familia:"Operação de Envase",nivel:"I",faixaMin:2200,faixaMax:2600,setor:"Envase",
    missao:"Executar operações de envase conforme procedimentos, garantindo qualidade e segurança na linha.",
    responsabilidades:["Operar equipamentos de envase","Registrar produção do turno","Seguir procedimentos de NR-12","Zelar pela limpeza (5S)"],
    requisitos:{formacao:"Ensino médio completo",experienciaMeses:0},competenciasObrig:["NR-12"],competenciasDesej:[],criterios:CRIT_ENTRY}),
  cg({codigo:"OPE-02",titulo:"Operador de Envase II",familia:"Operação de Envase",nivel:"II",faixaMin:2700,faixaMax:3300,setor:"Envase",
    missao:"Operar linhas de envase com autonomia e apoiar a preparação e o setup de máquinas.",
    responsabilidades:["Operar e ajustar linhas de envase","Realizar setup básico de equipamentos","Apoiar operadores nível I","Registrar não conformidades"],
    requisitos:{formacao:"Ensino médio completo",experienciaMeses:12},competenciasObrig:["NR-12"],competenciasDesej:["5S"],criterios:CRIT_II}),
  cg({codigo:"OPE-03",titulo:"Operador de Envase III",familia:"Operação de Envase",nivel:"III",faixaMin:3400,faixaMax:4200,setor:"Envase",
    missao:"Conduzir a operação da linha, liderar o turno e assegurar metas de produção e qualidade.",
    responsabilidades:["Liderar operação do turno","Coordenar setups complexos","Treinar novos operadores","Garantir indicadores de OEE"],
    requisitos:{formacao:"Ensino médio + técnico",experienciaMeses:24},competenciasObrig:["NR-12","5S"],competenciasDesej:["Liderança de turno"],criterios:CRIT_III}),
  // Qualidade
  cg({codigo:"QUA-01",titulo:"Técnica de Qualidade",familia:"Qualidade",nivel:"I",faixaMin:3200,faixaMax:3900,setor:"Qualidade",
    missao:"Executar análises e inspeções de qualidade nos produtos e processos.",
    responsabilidades:["Coletar e analisar amostras","Registrar laudos","Apoiar auditorias internas"],
    requisitos:{formacao:"Curso técnico em Química/Qualidade",experienciaMeses:0},competenciasObrig:["ISO 9001"],competenciasDesej:[],criterios:CRIT_ENTRY}),
  cg({codigo:"QUA-02",titulo:"Analista de Qualidade",familia:"Qualidade",nivel:"II",faixaMin:4200,faixaMax:5200,setor:"Qualidade",
    missao:"Analisar indicadores de qualidade, tratar não conformidades e conduzir melhorias.",
    responsabilidades:["Tratar não conformidades (CAPA)","Analisar indicadores","Conduzir auditorias","Elaborar FISPQ"],
    requisitos:{formacao:"Superior em Química/Eng.",experienciaMeses:24},competenciasObrig:["ISO 9001"],competenciasDesej:["FISPQ"],criterios:CRIT_II}),
  cg({codigo:"QUA-03",titulo:"Coordenador(a) de Qualidade",familia:"Qualidade",nivel:"III",faixaMin:6500,faixaMax:8500,setor:"Qualidade",
    missao:"Coordenar o sistema de gestão da qualidade e a equipe, garantindo conformidade regulatória.",
    responsabilidades:["Gerir o SGQ","Liderar equipe de qualidade","Responder por auditorias externas","Garantir compliance regulatório"],
    requisitos:{formacao:"Superior + especialização",experienciaMeses:48},competenciasObrig:["ISO 9001","FISPQ"],competenciasDesej:["Gestão de equipe"],criterios:CRIT_III}),
  // P&D
  cg({codigo:"PD-01",titulo:"Analista de P&D Jr.",familia:"Pesquisa & Desenvolvimento",nivel:"I",faixaMin:4000,faixaMax:5000,setor:"Formulação",
    missao:"Apoiar o desenvolvimento de formulações sob supervisão, executando testes de bancada.",
    responsabilidades:["Executar testes de bancada","Documentar formulações","Apoiar escalonamento de processos"],
    requisitos:{formacao:"Superior em Química/Eng. Química",experienciaMeses:0},competenciasObrig:["FISPQ"],competenciasDesej:[],criterios:CRIT_ENTRY}),
  cg({codigo:"PD-02",titulo:"Analista de P&D",familia:"Pesquisa & Desenvolvimento",nivel:"II",faixaMin:5500,faixaMax:7000,setor:"Formulação",
    missao:"Desenvolver formulações de forma autônoma, do conceito ao escalonamento industrial.",
    responsabilidades:["Desenvolver formulações","Conduzir escalonamento","Interagir com Qualidade e Produção","Registrar propriedade intelectual"],
    requisitos:{formacao:"Superior em Química/Eng. Química",experienciaMeses:24},competenciasObrig:["FISPQ"],competenciasDesej:["ISO 9001"],criterios:CRIT_II}),
  cg({codigo:"PD-03",titulo:"Coordenador(a) de P&D",familia:"Pesquisa & Desenvolvimento",nivel:"III",faixaMin:8000,faixaMax:11000,setor:"Formulação",

// famílias (trilhas) de um cargo — aceita legado (string em c.familia) e novo (array em c.familias)
const familiasDe=c=>{ if(!c)return []; const arr=Array.isArray(c.familias)?c.familias:(c.familia?[c.familia]:[]); return [...new Set(arr.map(f=>String(f||"").trim()).filter(Boolean))]; };
const compartilhaFamilia=(a,b)=>{ const fa=familiasDe(a),fb=familiasDe(b); return fa.some(f=>fb.includes(f)); };
// próximo(s) cargo(s) na trilha (mesma família, nível seguinte). Retorna 1 por família compartilhada.
const proximosCargos=(cargos,cargoAtual)=>{
  const c=cargos.find(x=>x.titulo===cargoAtual); if(!c)return [];
  const fams=familiasDe(c); const res=[];
  fams.forEach(fam=>{
    const cand=cargos.filter(x=>familiasDe(x).includes(fam)&&nivelIdx(x.nivel)===nivelIdx(c.nivel)+1);
    if(cand[0]&&!res.find(r=>r.cargo.id===cand[0].id)) res.push({familia:fam,cargo:cand[0]});
  });
  return res;
};
// próximo cargo na trilha (compat: retorna o primeiro caminho, ou o da família informada)
const proximoCargo=(cargos,cargoAtual,familia)=>{
  const lista=proximosCargos(cargos,cargoAtual);
  if(familia){ const m=lista.find(x=>x.familia===familia); return m?m.cargo:null; }
  return lista[0]?lista[0].cargo:null;
};
const posicaoNaFaixa=(cargo,salario)=>{ if(!cargo||salario==null)return null;
  if(salario<cargo.faixaMin)return "ABAIXO"; if(salario>cargo.faixaMax)return "ACIMA"; return "DENTRO"; };
const compaRatio=(cargo,salario)=> cargo? (salario/((cargo.faixaMin+cargo.faixaMax)/2)) : null;
const mesesDesde=d=>{ if(!d)return 0; const a=new Date(d),b=new Date(); return Math.max(0,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())); };
// avalia critérios OBJETIVOS para promoção ao próximo cargo da trilha
const avaliarElegibilidade=(pessoa,cargos,familia)=>{
  const prox=proximoCargo(cargos,pessoa.vinculo.cargo,familia);
  if(!prox) return {prox:null,elegivel:false,checks:[],motivo:"Topo da trilha"};
  const cr=prox.criterios, meses=mesesDesde(pessoa.vinculo.desdeCargo||pessoa.vinculo.admissao);
  const checks=[
    {ok:meses>=cr.tempoMinMeses, label:`Tempo mínimo no nível (${cr.tempoMinMeses} meses)`, atual:`${meses} meses`},
    {ok:(pessoa.ultimaAvaliacao||0)>=cr.notaMinAvaliacao, label:`Avaliação ≥ ${cr.notaMinAvaliacao.toFixed(1)}`, atual:pessoa.ultimaAvaliacao?pessoa.ultimaAvaliacao.toFixed(1):"sem avaliação"},
  ];
  if(cr.exigeCompetenciasObrig){
    const faltam=prox.competenciasObrig.filter(k=>!(pessoa.competencias||[]).includes(k));
    checks.push({ok:faltam.length===0, label:"Competências obrigatórias do cargo", atual:faltam.length?`faltam: ${faltam.join(", ")}`:"completas"});
  }
  return {prox,elegivel:checks.every(c=>c.ok),checks};
};
// cargos do mesmo nível em outra família (movimentação lateral)
const cargosLaterais=(cargos,cargoAtual)=>{ const c=cargos.find(x=>x.titulo===cargoAtual); if(!c)return [];
  return cargos.filter(x=>nivelIdx(x.nivel)===nivelIdx(c.nivel)&&x.titulo!==c.titulo); };

const importarColaboradoresExcel=(e,criarPessoa,editarPessoa,pessoas,notify,reset)=>{
  const file=e.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  const g=(r,...keys)=>{for(const k of keys){if(r[k]!==undefined&&r[k]!=="")return String(r[k]);}return "";};
  // Converte datas da planilha para ISO (aaaa-mm-dd). Aceita dd/mm/aaaa, número de série do Excel e ISO.
  const ptToIso=v=>{
    if(v==null||v==="")return "";
    const s=String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);                 // já em ISO
    let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);          // dd/mm/aaaa
    if(m){let[_,d,mo,a]=m;if(a.length===2){const n=parseInt(a,10);a=(n>(new Date().getFullYear()%100)?"19":"20")+a;}
      return `${a}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
    if(/^\d+(\.\d+)?$/.test(s)){                                          // número de série do Excel
      const n=parseFloat(s);
      if(n>0&&n<60000){const dt=new Date(Date.UTC(1899,11,30)+n*86400000);
        return dt.toISOString().slice(0,10);}
    }
    const d2=new Date(s); return isNaN(d2)?"":d2.toISOString().slice(0,10);
  };
  reader.onload=async ev=>{
    try{
      let rows=[];
      if(file.name.toLowerCase().endsWith(".csv")){
        const txt=new TextDecoder("utf-8").decode(ev.target.result);
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        const heads=lines[0].split(";").map(h=>h.replace(/^"|"$/g,"").trim());
        rows=lines.slice(1).map(l=>{const vals=l.split(";").map(v=>v.replace(/^"|"$/g,"").trim());const o={};heads.forEach((h,i)=>o[h]=vals[i]||"");return o;});
      } else if(window.XLSX){
        const wb=XLSX.read(ev.target.result,{type:"array",codepage:65001});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      } else { notify("Biblioteca XLSX não carregou — tente com um arquivo .csv"); return; }
      if(!rows.length){ notify("Arquivo vazio ou sem dados."); return; }
      let ok=0,err=0;
      for(const r of rows){
        const nome=g(r,"Nome","nome").trim(); if(!nome){err++;continue;}
        const p={
          nome,
          email:g(r,"E-mail","Email","email"),
          telefone:g(r,"Telefone","telefone"),
          nascimento:ptToIso(g(r,"Data de Nascimento","Nascimento")),
          rg:g(r,"RG","rg"),
          cpf:g(r,"CPF","cpf"),
          sexo:g(r,"Sexo","sexo"),
          estadoCivil:g(r,"Estado Civil","Estado civil","estadoCivil"),
          escolaridade:g(r,"Escolaridade","escolaridade"),
          formacao:g(r,"Formação","Formacao","Formação","formacao"),
          endereco:g(r,"Endereço","Endereco","endereco"),
          complemento:g(r,"Complemento","complemento"),
          bairro:g(r,"Bairro","bairro"),
          cidade:g(r,"Cidade","cidade"),
          cep:g(r,"CEP","cep"),
          status:g(r,"Status","status")||"ATIVO",
          vinculo:{
            matricula:g(r,"Matrícula","Matricula"),
            ctps:g(r,"CTPS","ctps"),
            esocial:g(r,"Código e-Social","Codigo e-Social","esocial"),
            pis:g(r,"PIS","pis"),
            tipo:g(r,"Tipo","tipo"),
            cargo:g(r,"Cargo","cargo"),
            cbo:g(r,"CBO","cbo"),
            setor:g(r,"Setor","setor"),
            lider:g(r,"Superior Direto","Superior direto","lider"),
            admissao:ptToIso(g(r,"Data de Admissão","Data de Admissao")),
            salario:g(r,"Salário","Salario"),
            unidade:"Matriz",tipoContrato:"CLT"
          },
          banco:{
            banco:g(r,"Banco","banco"),
            agencia:g(r,"Agência","Agencia"),
            conta:g(r,"Conta Corrente","conta"),
            pix:g(r,"PIX","pix"),
            tipoPix:g(r,"Tipo PIX","Tipo Pix"),
          },
          outras:{camiseta:g(r,"Camiseta"),calcado:g(r,"Calçado","Calcado")},
          emergencia:{nome:g(r,"Emergência - Nome","Emergencia - Nome"),parentesco:g(r,"Emergência - Parentesco","Emergencia - Parentesco"),telefone:g(r,"Emergência - Telefone","Emergencia - Telefone")},
          testes:{},tags:[],redes:{},anotacoes:[],reunioes1a1:[],treinamentos:[],documentos:[],dependentes:[],logAlteracoes:[],
        };
        try{
          const cpf=(p.cpf||"").replace(/\D/g,"");
          const existe=(pessoas||[]).find(x=>(cpf&&(x.cpf||"").replace(/\D/g,"")===cpf)||(x.nome||"").toLowerCase().trim()===(p.nome||"").toLowerCase().trim());
          if(existe){ await editarPessoa(existe,p); ok++; }
          else { await criarPessoa(p); ok++; }
        }catch(e2){ console.error(e2); err++; }
      }
      notify(`Importação concluída: ${ok} colaborador(es) importado(s) (criados ou atualizados)${err?`, ${err} com erro`:""}.`);
    }catch(ex){ console.error(ex); notify("Erro ao ler o arquivo: "+String(ex.message||ex).slice(0,80)); }
    finally{ reset&&reset(); }
  };
  reader.readAsArrayBuffer(file);
};

const importarCompetenciasExcel=(e,onImportar,notify,reset,tipoPadrao)=>{

    if(!s)return tipoPadrao||"comportamental";
    if(s.startsWith("t")||s.includes("hard")||s.includes("técn")||s.includes("tecn"))return "tecnica";
    if(s.startsWith("c")||s.includes("soft")||s.includes("comport"))return "comportamental";

  const lerLista=(r,...rotulos)=>{

    });
    const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp("^("+[...new Set(bases)].filter(Boolean).map(esc).join("|")+")\\s*\\d+$","i");
    Object.keys(r).forEach(k=>{ if(re.test(k.trim())&&String(r[k]||"").trim()) arr.push(String(r[k]).trim()); });
    return arr.map(s=>s.replace(/^\s*\d+\s*[.)-]\s*/,"").trim()).filter(Boolean);
  };
  reader.onload=async ev=>{

        rows=lines.slice(1).map(l=>{const vals=l.split(";").map(v=>v.replace(/^"|"$/g,"").trim());const o={};heads.forEach((h,i)=>o[h]=vals[i]||"");return o;});
      } else if(window.XLSX){
        const wb=XLSX.read(ev.target.result,{type:"array",codepage:65001});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      } else { notify("Biblioteca XLSX não carregou — tente com um arquivo .csv"); return; }
      if(!rows.length){ notify("Arquivo vazio ou sem dados."); return; }

const importarCargosExcel=(e,onImportar,notify,reset)=>{
  const file=e.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  const g=(r,...keys)=>{for(const k of keys){if(r[k]!==undefined&&r[k]!=="")return String(r[k]).trim();}return "";};
  const num=v=>{ const n=Number(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isNaN(n)?0:n; };
  const normNivel=v=>{ const s=String(v||"").trim(); if(!s)return ""; const R={I:"01",II:"02",III:"03",IV:"04",V:"05",VI:"06",VII:"07",VIII:"08",IX:"09",X:"10"}; if(R[s.toUpperCase()])return R[s.toUpperCase()]; const n=parseInt(s,10); return isNaN(n)?s:String(n).padStart(2,"0"); };
  reader.onload=async ev=>{
    try{
      let rows=[];
      if(file.name.toLowerCase().endsWith(".csv")){
        const txt=new TextDecoder("utf-8").decode(ev.target.result);
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        const heads=lines[0].split(";").map(h=>h.replace(/^"|"$/g,"").trim());
        rows=lines.slice(1).map(l=>{const vals=l.split(";").map(v=>v.replace(/^"|"$/g,"").trim());const o={};heads.forEach((h,i)=>o[h]=vals[i]||"");return o;});
      } else if(window.XLSX){
        const wb=XLSX.read(ev.target.result,{type:"array",codepage:65001});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      } else { notify("Biblioteca XLSX não carregou — tente com um arquivo .csv"); return; }
      if(!rows.length){ notify("Arquivo vazio ou sem dados."); return; }
      const parsed=[];
      for(const r of rows){
        const titulo=g(r,"Cargo","Título","Titulo","cargo","titulo"); if(!titulo){continue;}
        const famStr=g(r,"Famílias","Familias","Família","Familia","Trilha","Trilhas","familia");
        const familias=famStr?famStr.split(/[;,/]/).map(s=>s.trim()).filter(Boolean):[];
        parsed.push({
          codigo:g(r,"Código","Codigo","codigo"),
          titulo,
          departamento:g(r,"Departamento","departamento","Setor"),
          cbo:g(r,"CBO","cbo"),
          cargoSuperior:g(r,"Cargo Superior","Cargo superior","cargoSuperior","Superior"),
          nivel:normNivel(g(r,"Nível da Trilha","Nivel da Trilha","Nível","Nivel","nivel")),
          classificacao:g(r,"Nível do Cargo","Nivel do Cargo","Classificação","Classificacao","classificacao"),
          familias,
          familia:familias[0]||"",
          faixaMin:num(g(r,"Faixa Mín","Faixa Min","Faixa mínima","Faixa minima","faixaMin","Salário mín","Salario min")),
          faixaMax:num(g(r,"Faixa Máx","Faixa Max","Faixa máxima","Faixa maxima","faixaMax","Salário máx","Salario max")),
          missao:g(r,"Missão","Missao","missao"),
          cboRaw:g(r,"CBO","cbo"),
          statusRaw:g(r,"Status","status"),
        });
      }
      if(!parsed.length){ notify("Nenhuma linha com 'Cargo' encontrada. Confira o cabeçalho da planilha."); return; }
      const res=onImportar(parsed);
      notify(`Importação de cargos: ${res.criados} criado(s), ${res.atualizados} atualizado(s)${res.erros?`, ${res.erros} com erro`:""}.`);
    }catch(ex){ console.error(ex); notify("Erro ao ler o arquivo: "+String(ex.message||ex).slice(0,80)); }
    finally{ reset&&reset(); }
  };
  reader.readAsArrayBuffer(file);
};

  const divergencias=(snap,auto,gestor)=>{
    const out=[];

      if(ehNota(a)&&ehNota(g)&&Math.abs(a-g)>=LIMITES_DIVERGENCIA.criterio) out.push({criterioId:c.id,msg:`Divergência em "${c.nome}": autoavaliação ${a} × gestor ${g}`}); });

    snap.blocos.forEach(b=>{ if(ca[b.id]!=null&&cg[b.id]!=null&&Math.abs(ca[b.id]-cg[b.id])>=LIMITES_DIVERGENCIA.bloco-1e-9)

  const calcularBlocosSimples=(snap,resp)=>{ const o={}; snap.blocos.forEach(b=>{ let p=0,np=0;

  // validação do envio do gestor: tudo respondido + evidência em 1/2/4 + justificativa em N/A

      if(!r||(!ehNota(r.nota)&&r.nota!=="NA")) erros.push({criterioId:c.id,msg:`"${c.nome}" sem resposta`});
      else if(ehNota(r.nota)&&(reg.evidenciaObrigatoria||[]).includes(r.nota)&&!txt) erros.push({criterioId:c.id,msg:`"${c.nome}": nota ${r.nota} exige justificativa`});

  // ---------- acesso externo ----------
  const ALFABETO="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // sem 0/O, 1/I/L

  const gerarToken=()=>{ const b=bytesAleatorios(32); let s=""; b.forEach(x=>s+=String.fromCharCode(x));

      for(const x of b){ if(x<248&&out.length<8) out+=ALFABETO[x%31]; } } // 248 = 8*31, evita viés

  const dataSP=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"America/Sao_Paulo"}); // AAAA-MM-DD
  const prazoAcesso=(liberadoEm,dias)=>{ const [y,m,dd]=dataSP(liberadoEm).split("-").map(Number);

    return new Date(`${alvo.toISOString().slice(0,10)}T23:59:59${TZ_OFFSET}`).toISOString(); };
  // conteúdo dos 2 documentos externos (nada de ids internos, salário etc.)

      expiraEm,revogado:false,cicloNome:s.contexto.ciclo.nome||"",mensagem:String(mensagem||""),
      blocos:s.blocos.filter(b=>b.criterios.length).map(b=>({id:b.id,nome:b.nome,n:b.criterios.length})),

    const conteudo={...capa,liberadoEm,estado:"liberada",
      escala:ESCALA,perguntasFechamento:PERGUNTAS_FECHAMENTO,declaracao:DECLARACAO_ENVIO,
      justificativaObrigatoria:!!(s.regras&&s.regras.justificativaAuto),
      blocos:s.blocos.map(b=>({id:b.id,nome:b.nome,criterios:b.criterios.map(c=>({id:c.id,nome:c.nome,pergunta:c.perguntaAuto||c.pergunta,regua:c.regua||null}))})), // orientação e evidências: só para o gestor

  const autoExpirada=(etapaAuto,agora)=>!!(etapaAuto&&["liberada","em_andamento"].includes(etapaAuto.estado)&&etapaAuto.prazo&&new Date(agora)>new Date(etapaAuto.prazo));

  // ---------- status (derivado das etapas; fonte única) ----------
  const etapasIniciais=()=>({
    auto:{estado:"pendente",responsavel:"colaborador",inicio:null,prazo:null,conclusao:null,obs:""},
    gestor:{estado:"bloqueada",responsavel:"gestor",inicio:null,prazo:null,conclusao:null,obs:""},
    calibracao:{estado:"bloqueada",responsavel:"rh",inicio:null,prazo:null,conclusao:null,obs:""},
    feedback:{estado:"bloqueada",responsavel:"gestor",inicio:null,prazo:null,conclusao:null,obs:""},

    if(e.calibracao.estado==="pendente") return "aguardando_calibracao";

  // ---------- nova avaliação ----------
  const novaAvaliacao=({ciclo,pessoa,cargo,template,gestor,agora})=>({
    id:`${ciclo.id}_${pessoa.id}`,cicloId:ciclo.id,pessoaId:pessoa.id,
    snapshot:montarSnapshot({ciclo,pessoa,cargo,template,gestor,agora}),
    etapas:etapasIniciais(),
    acesso:null,           // parte visível: {liberadoEm, expiraEm, geracao}. Token, código e ids dos docs externos
                           // ficam em avaliacoes/{id}/privado/acesso (só RH lê) — o gestor nunca os vê.
    auto:null,             // espelho da autoavaliação (copiado do doc externo quando enviada/encerrada)
    gestor:{respostas:{},situacoesCriticas:[],autoConsultadaEm:null},
    resultadoPreliminar:null, calibracao:{alteracoes:[],decisao:null}, resultadoFinal:null,

  // ---------- ações (máquina de estados) ----------
  // aplicarAcao(av, acao, dados, ator, agora, ciclo) -> {av, eventos}  |  lança Error com mensagem ao usuário

  const clone=o=>JSON.parse(JSON.stringify(o));

    atualizarEstrutura:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH.");

    gerarAcesso:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH.");

      av.resultadoFinal=calcular(av.snapshot,resp,{situacoesCriticas:av.gestor.situacoesCriticas,auto:av.auto&&av.auto.respostas});
      av.calibracao.decisao={texto:d.decisao,manteve:!av.calibracao.alteracoes.length,em:agora,por:ator.email};
      av.etapas.calibracao={...av.etapas.calibracao,estado:"calibrada",conclusao:agora};
      if(!(ciclo&&ciclo.liberacaoFeedback==="manual")) av.etapas.feedback={...av.etapas.feedback,estado:"pendente",inicio:agora,prazo:(ciclo&&ciclo.prazos&&ciclo.prazos.feedback)||null};
      return [evento(ator,"calibracao_decidida","calibracao",{de:av.resultadoPreliminar&&av.resultadoPreliminar.finalArred,para:av.resultadoFinal.finalArred,justificativa:d.decisao})]; },

    liberarFeedbackManual:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH."); exigir(av.etapas.calibracao.estado==="calibrada"&&av.etapas.feedback.estado==="bloqueada","Nada a liberar.");
      av.etapas.feedback={...av.etapas.feedback,estado:"pendente",inicio:agora}; return [evento(ator,"feedback_liberado","feedback")]; },

    registrarFeedback:(av,d,ator,agora)=>{ exigir(ehGestorDa(ator,av)||ehRH(ator),"Somente o gestor ou o RH.");
      exigir(av.etapas.feedback.estado==="pendente","O feedback não está liberado.");
      ["data","contribuicoes","desenvolvimento","mensagemCentral"].forEach(k=>exigir(String(d[k]||"").trim(),"Preencha data, contribuições, pontos de desenvolvimento e mensagem central."));
      av.feedback={data:d.data,gestorResponsavel:d.gestorResponsavel||av.snapshot.contexto.gestor.nome,contribuicoes:d.contribuicoes,desenvolvimento:d.desenvolvimento,
        mensagemCentral:d.mensagemCentral,observacoes:d.observacoes||"",ciencia:d.ciencia?{texto:TEXTO_CIENCIA,em:agora,registradaPor:ator.email}:null,registradoEm:agora,por:ator.email};
      av.etapas.feedback={...av.etapas.feedback,estado:"realizado",conclusao:agora};
      av.etapas.conclusao={...av.etapas.conclusao,estado:"pendente",inicio:agora};
      return [evento(ator,"feedback_registrado","feedback",{para:d.data})]; },

    abrirRevisao:(av,d,ator,agora)=>{ exigir(ehRH(ator)||ehGestorDa(ator,av),"Sem permissão.");
      exigir(av.etapas.conclusao.estado!=="concluida","Avaliação concluída: use retificação.");
      exigir(String(d.motivo||"").trim(),"Informe o motivo da revisão.");
      const r={id:`rev${av.revisoes.length+1}`,data:d.data||agora,motivo:d.motivo,fatos:d.fatos||"",responsavel:d.responsavel||"",decisao:null,alteracao:null,justificativa:null,abertaEm:agora};
      av.revisoes.push(r); return [evento(ator,"revisao_aberta",null,{campo:r.id,justificativa:d.motivo})]; },

    decidirRevisao:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH."); const r=av.revisoes.find(x=>x.id===d.revisaoId); exigir(r&&!r.decisao,"Revisão inexistente ou já decidida.");
      exigir(String(d.decisao||"").trim()&&String(d.justificativa||"").trim(),"Registre decisão e justificativa.");
      Object.assign(r,{decisao:d.decisao,alteracao:d.alteracao||null,justificativa:d.justificativa,decididaEm:agora,por:ator.email});
      return [evento(ator,"revisao_decidida",null,{campo:r.id,para:d.decisao,justificativa:d.justificativa})]; },

    concluir:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH.");
      const e=av.etapas;
      exigir(["enviada","encerrada_pelo_rh"].includes(e.auto.estado),"A autoavaliação precisa estar enviada ou formalmente encerrada.");
      exigir(e.gestor.estado==="concluida","A avaliação do gestor não foi concluída.");
      exigir(e.calibracao.estado==="calibrada","A calibração não foi concluída.");
      exigir(e.feedback.estado==="realizado","O feedback não foi registrado.");
      exigir(!av.revisoes.some(r=>!r.decisao),"Há revisão sem decisão.");
      av.conclusao={em:agora,por:ator.email,congelado:true,resultado:clone(av.resultadoFinal)};
      e.conclusao={...e.conclusao,estado:"concluida",conclusao:agora};
      av.conclusao.matriz={...calcularMatriz(av),calculadoEm:agora}; // fotografia reprodutível para a Matriz de Performance
      return [evento(ator,"avaliacao_concluida","conclusao",{para:av.resultadoFinal.finalArred})]; },

    retificar:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH."); exigir(av.etapas.conclusao.estado==="concluida","Somente avaliações concluídas são retificadas."); exigirMotivo(d);
      const novo=calcular(av.snapshot,{...(av.calibracao.respostas||av.gestor.respostas),...clone(d.respostas||{})},{situacoesCriticas:av.gestor.situacoesCriticas});
      av.retificacoes=[...(av.retificacoes||[]),{em:agora,por:ator.email,justificativa:d.motivo,anterior:clone(av.conclusao.resultado),novo}];
      av.conclusao={...av.conclusao,resultado:novo,retificadoEm:agora};
      av.retificacoes[av.retificacoes.length-1].matrizAnterior=clone(av.conclusao.matriz||null);
      av.conclusao.matriz={...calcularMatriz(av),calculadoEm:agora};
      return [evento(ator,"retificada","conclusao",{de:av.retificacoes.at(-1).anterior.finalArred,para:novo.finalArred,justificativa:d.motivo})]; },

    // desfaz a conclusão: a avaliação volta para "Feedback realizado"; a versão concluída fica arquivada
    reabrirConclusao:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH."); exigirMotivo(d);
      exigir(av.etapas.conclusao.estado==="concluida","A avaliação não está concluída.");
      av.reaberturas=[...(av.reaberturas||[]),{em:agora,por:ator.email,motivo:d.motivo,etapa:"conclusao",conclusao:clone(av.conclusao)}];
      av.conclusao=null; av.etapas.conclusao={...av.etapas.conclusao,estado:"pendente",conclusao:null};
      return [evento(ator,"conclusao_reaberta","conclusao",{justificativa:d.motivo,obs:"versão concluída arquivada"})]; },

    consolidarMatriz:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH."); exigir(av.etapas.conclusao.estado==="concluida","Avaliação não concluída.");
      exigir(!(av.conclusao.matriz&&av.conclusao.matriz.elegivel!==undefined),"Posicionamento já consolidado.");
      av.conclusao.matriz={...calcularMatriz(av),calculadoEm:agora};
      return [evento(ator,"matriz_consolidada","conclusao",{para:av.conclusao.matriz.posicionamento||av.conclusao.matriz.motivo})]; },

    transferirGestor:(av,d,ator)=>{ exigir(ehRH(ator),"Somente o RH."); exigirMotivo(d);
      exigir(av.etapas.conclusao.estado!=="concluida","Avaliação concluída.");
      const de=av.snapshot.contexto.gestor.nome; av.snapshot.contexto.gestor={id:d.gestor.id||"",nome:d.gestor.nome,email:(d.gestor.email||"").toLowerCase()};
      return [evento(ator,"gestor_transferido",null,{de,para:d.gestor.nome,justificativa:d.motivo})]; },

    vincularPDI:(av,d,ator)=>{ exigir(av.etapas.conclusao.estado==="concluida","Conclua a avaliação antes."); exigir(!av.pdiId,"Já existe PDI vinculado.");
      av.pdiId=d.pdiId; return [evento(ator,"pdi_criado","conclusao",{para:d.pdiId})]; },

    cancelar:(av,d,ator,agora)=>{ exigir(ehRH(ator),"Somente o RH."); exigirMotivo(d); exigir(av.etapas.conclusao.estado!=="concluida","Avaliação concluída não pode ser cancelada.");
      av.cancelada={em:agora,por:ator.email,motivo:d.motivo}; return [evento(ator,"cancelada",null,{justificativa:d.motivo})]; },
  };
  const CONGELADAS=["retificar","vincularPDI","consolidarMatriz","reabrirConclusao"]; // únicas ações aceitas depois da conclusão
  const aplicarAcao=(avOriginal,acao,dados,ator,agora,ciclo)=>{
    const fn=ACOES[acao]; if(!fn) falha("Ação desconhecida: "+acao);
    if(avOriginal.cancelada) falha("Avaliação cancelada.");
    if(avOriginal.etapas.conclusao.estado==="concluida"&&!CONGELADAS.includes(acao)) falha("Avaliação concluída e congelada.");
    const av=clone(avOriginal);
    const eventos=fn(av,dados||{},ator,agora,ciclo)||[];
    const privado=av._privado||null; delete av._privado; // vai para o subdocumento privado, nunca para o doc da avaliação
    av.status=derivarStatus(av,agora); av.atualizadaEm=agora;
    return {av,privado,eventos:eventos.map(e=>({...e,em:agora,statusDepois:av.status}))};
  };
  // ações que fazem sentido agora (para montar o menu da tela)
  const acoesDisponiveis=(av,ator,agora,ciclo)=>Object.keys(ACOES).filter(k=>{
    if(["sincronizarAuto","salvarGestor","consultarAuto","atualizarEstrutura","registrarExpiracao"].includes(k)) return false;
    try{ aplicarAcao(av,k,{motivo:"x",novoPrazo:new Date(new Date(agora).getTime()+864e5).toISOString(),decisao:"x",justificativa:"x",
      data:"x",contribuicoes:"x",desenvolvimento:"x",mensagemCentral:"x",acesso:{expiraEm:"2999-01-01"},gestor:{nome:"x"},pdiId:"x",revisaoId:(av.revisoes.find(r=>!r.decisao)||{}).id,
      criterioId:(todosCriterios(av.snapshot)[0]||{}).id,nota:"NA"},ator,agora,ciclo); return true; }catch(e){ return false; } });

  // ---------- pacote para o módulo PDI ----------
  const pacotePDI=(av,competencias)=>{
    const res=(av.conclusao&&av.conclusao.resultado)||av.resultadoFinal; const resp=av.calibracao.respostas||av.gestor.respostas;
    const baixos=todosCriterios(av.snapshot).filter(c=>resp[c.id]&&(resp[c.id].nota===1||resp[c.id].nota===2))
      .map(c=>({criterioId:c.id,nome:c.nome,bloco:(av.snapshot.blocos.find(b=>b.id===c.blocoId)||{}).nome,nota:resp[c.id].nota,evidencia:resp[c.id].comentario||"",competenciasRelacionadas:c.competenciasRelacionadas||[]}));
    const compIds=[...new Set(baixos.flatMap(b=>b.competenciasRelacionadas))];
    const s=av.snapshot.contexto;
    return {origem:{avaliacaoId:av.id,cicloId:av.cicloId,ciclo:s.ciclo,colaborador:s.pessoa,cargo:s.cargo,gestor:s.gestor,concluidaEm:av.conclusao&&av.conclusao.em,
        notaFinal:res.finalArred,classificacao:res.classificacao,notasBloco:Object.fromEntries(Object.entries(res.blocos).map(([k,b])=>[k,b.notaArred])),
        contribuicoes:av.feedback.contribuicoes,pontosDesenvolvimento:av.feedback.desenvolvimento,mensagemCentral:av.feedback.mensagemCentral,observacoesFeedback:av.feedback.observacoes,
        criteriosBaixos:baixos,
        competenciasRelacionadas:compIds.map(id=>{ const c=(competencias||[]).find(x=>x.id===id); return c?{id,nome:c.nome,treinamentos:c.treinamentos||[]}:{id}; })},
      status:"nao_iniciado", prioridades:[], // o gestor escolhe 1–2 no módulo PDI
      criarAutomatico:!!String(av.feedback.desenvolvimento||"").trim()};
  };

  // ---------- ciclo ----------
  const progressoCiclo=(avs,agora)=>{ const at=avs.filter(a=>!a.cancelada); const n=f=>at.filter(f).length;
    return {total:at.length,
      autoEnviadas:n(a=>["enviada","encerrada_pelo_rh"].includes(a.etapas.auto.estado)),
      gestorConcluidas:n(a=>a.etapas.gestor.estado==="concluida"),
      calibradas:n(a=>a.etapas.calibracao.estado==="calibrada"),
      feedbacks:n(a=>a.etapas.feedback.estado==="realizado"),
      concluidas:n(a=>a.etapas.conclusao.estado==="concluida"),
      atrasadas:n(a=>atrasada(a,agora))}; };
  const statusCicloSugerido=(ciclo,avs)=>{ if(["rascunho","programado","cancelado"].includes(ciclo.status)) return ciclo.status;
    const at=avs.filter(a=>!a.cancelada); if(!at.length) return "aberto";
    if(at.every(a=>a.etapas.conclusao.estado==="concluida")) return "concluido";
    if(at.every(a=>["calibrada"].includes(a.etapas.calibracao.estado))) return "em_fechamento";
    if(at.some(a=>a.etapas.auto.estado!=="pendente"&&a.etapas.auto.estado!=="liberada")) return "em_andamento";
    return "aberto"; };

  return {VERSAO_CALCULO,ESCALA,FAIXAS,STATUS,STATUS_CICLO,STATUS_PDI,SITUACOES_CRITICAS,PERGUNTAS_FECHAMENTO,DECLARACAO_ENVIO,TEXTO_CIENCIA,
    LIMITES_DIVERGENCIA,DIAS_VALIDADE_ACESSO,REGUA_GERAL,CRITERIOS_LIDERANCA,CRITERIOS_CULTURA,CRITERIOS_RESULTADO_GERENTE_OPERACOES,TEMPLATES_BASE,
    MATRIZ_LIMITES,MATRIZ_CONFIGS,POSICIONAMENTOS,ZONAS,ROT_ZONA,configMatrizPara,zonaMatriz,eixoMatriz,calcularMatriz,posicaoMatriz,
    registrarTemplates,vigenteDaFamilia,familiasDeTemplates,removerTemplate,ehTemplateDoSistema,proximaVersao,
    templateDoCargo,novaVersaoTemplate,validarTemplate,montarSnapshot,calcular,classificar,divergencias,validarAvaliacaoGestor,
    gerarToken,gerarCodigo,normalizarCodigo,sha256Hex,idCapa,idConteudo,prazoAcesso,montarDocsAcesso,autoExpirada,
    etapasIniciais,derivarStatus,atrasada,novaAvaliacao,aplicarAcao,acoesDisponiveis,pacotePDI,progressoCiclo,statusCicloSugerido};
})();

const ADMIN_EMAIL="ana.vidal@braskim.com.br";
const DOMINIO_PERMITIDO="braskim.com.br";
// módulos controláveis: [id, rótulo]. A ordem segue o menu.
const MODULOS=[
  ["atividades","Tarefas"],
  ["modelos","Modelos de tarefa"],
  ["procedimentos","Procedimentos"],
  ["cargos","Cargos"],
  ["departamentos","Departamentos"],
  ["pessoas","Colaboradores"],
  ["organograma","Organograma"],
  ["comp","Competências"],
  ["aval","Avaliações de desempenho"],
  ["pdi","PDI"],
  ["matriz","Matriz de Performance"],
  ["configs","Configurações"],
];
const ACESSO_COL="acessos";
// nível por módulo: "" (sem acesso) | "ver" (só leitura) | "editar" (leitura e escrita)
const nivelDoAcesso=(acesso,modId)=>{
  if(!acesso)return "";
  if(acesso.admin)return "editar";
  return (acesso.modulos&&acesso.modulos[modId])||"";
};

function AcessosView({acessos,fb,usuario,notify}){
  const [novo,setNovo]=useState(false);
  const [edit,setEdit]=useState(null);
  const db=fb&&fb.db;
  const salvar=async(dados,idExistente)=>{
    if(!db)return;
    const email=(dados.email||"").trim().toLowerCase();
    if(!email){notify&&notify("Informe o e-mail.");return;}
    if(!email.endsWith("@"+DOMINIO_PERMITIDO)){notify&&notify("O e-mail precisa ser @"+DOMINIO_PERMITIDO);return;}
    if(email===ADMIN_EMAIL){notify&&notify("Este e-mail já é administrador do sistema.");return;}
    const dup=acessos.find(a=>(a.email||"").toLowerCase()===email&&a.id!==idExistente);
    if(dup){notify&&notify("Já existe um acesso com esse e-mail.");return;}
    try{
      const payload={nome:dados.nome||email,email,modulos:dados.modulos||{},atualizadoEm:new Date().toISOString(),por:(usuario&&usuario.email)||"?"};
      if(idExistente) await db.collection(ACESSO_COL).doc(idExistente).set(payload,{merge:true});
      else await db.collection(ACESSO_COL).add({...payload,criadoEm:new Date().toISOString()});
      notify&&notify(idExistente?"Acesso atualizado.":"Acesso criado.");
      setNovo(false);setEdit(null);
    }catch(e){notify&&notify("Erro ao salvar: "+(e.message||e));}
  };
  const excluir=async a=>{
    if(!db)return;
    if(!window.confirm(`Remover o acesso de "${a.nome||a.email}"?\n\nA pessoa deixará de entrar no sistema.`))return;
    try{await db.collection(ACESSO_COL).doc(a.id).delete();notify&&notify("Acesso removido.");}
    catch(e){notify&&notify("Erro ao remover: "+(e.message||e));}
  };
  const resumo=a=>{
    const mods=MODULOS.filter(([id])=>a.modulos&&a.modulos[id]);
    if(mods.length===0)return "Sem módulos";
    if(mods.length===MODULOS.length)return "Todos os módulos";
    return mods.map(([id,l])=>l).slice(0,3).join(", ")+(mods.length>3?` +${mods.length-3}`:"");
  };
  return <div className="flex-1 overflow-y-auto px-8 py-6 bg-slate-50">
    <div className="flex items-center justify-between mb-5">
      <div className="flex items-center gap-2.5">
        <span className="w-10 h-10 grid place-items-center rounded-xl bg-brand/10 text-brand">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <div><h1 className="text-2xl font-bold text-navy">Perfis de Acesso</h1>
          <p className="text-sm text-slate-500">Quem entra no sistema e o que cada pessoa pode ver ou editar</p></div>
      </div>
      <button onClick={()=>setNovo(true)} className="bg-brand hover:bg-navy text-white text-sm font-medium px-4 py-2 rounded-md shadow-sm flex items-center gap-1.5"><IcPlus/>Novo acesso</button>
    </div>

    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="px-4 py-3 border-b border-slate-100 bg-slate-50 flex items-center gap-3">
        <span className="inline-grid place-items-center w-9 h-9 rounded-full bg-navy text-white text-sm font-bold">A</span>
        <div className="flex-1"><div className="text-sm font-semibold text-navy">Administrador</div>
          <div className="text-[11px] text-slate-400">{ADMIN_EMAIL}</div></div>
        <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-brand/10 text-brand">Acesso total</span>
      </div>
      <table className="w-full text-sm">
        <thead><tr className="text-slate-500 text-xs uppercase tracking-wide bg-white border-b border-slate-100">
          <th className="text-left font-semibold px-4 py-2.5">Pessoa</th>
          <th className="text-left font-semibold px-3 py-2.5">Módulos liberados</th>
          <th className="text-center font-semibold px-3 py-2.5">Ações</th></tr></thead>
        <tbody>
          {acessos.length===0&&<tr><td colSpan="3" className="px-4 py-10 text-center text-slate-400">Nenhum acesso cadastrado ainda. Clique em "Novo acesso" para liberar a primeira pessoa.</td></tr>}
          {acessos.map(a=>(
            <tr key={a.id} className="border-t border-slate-100 hover:bg-slate-50">
              <td className="px-4 py-3"><div className="font-medium text-navy">{a.nome||a.email}</div><div className="text-[11px] text-slate-400">{a.email}</div></td>
              <td className="px-3 py-3 text-slate-600">{resumo(a)}</td>
              <td className="px-3 py-3"><div className="flex items-center justify-center gap-1.5">
                <button onClick={()=>setEdit(a)} className="text-xs px-2.5 py-1 border border-slate-300 rounded-md text-slate-600 hover:bg-slate-50">Editar</button>
                <button onClick={()=>excluir(a)} className="text-xs px-2 py-1 border border-slate-300 rounded-md text-red-500 hover:bg-red-50">Remover</button>
              </div></td>
            </tr>))}
        </tbody>
      </table>
    </div>

    {(novo||edit)&&<AcessoForm acesso={edit} onClose={()=>{setNovo(false);setEdit(null);}} onSalvar={salvar}/>}
  </div>;
}

function AcessoForm({acesso,onClose,onSalvar}){
  const [nome,setNome]=useState(acesso?.nome||"");
  const [email,setEmail]=useState(acesso?.email||"");
  const [modulos,setModulos]=useState(()=>({...(acesso?.modulos||{})}));
  const setMod=(id,nivel)=>setModulos(m=>{const n={...m};if(nivel)n[id]=nivel;else delete n[id];return n;});
  const inp="w-full text-sm border border-slate-300 rounded-md px-2.5 py-1.5 outline-none focus:ring-2 ring-brand/30";
  return <div onClick={onClose} className="fixed inset-0 z-50 bg-navy/50 grid place-items-center p-4">
    <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[88vh] flex flex-col">
      <div className="p-5 border-b border-slate-200 flex items-center justify-between">
        <h2 className="text-lg font-bold text-navy">{acesso?"Editar acesso":"Novo acesso"}</h2>
        <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl">✕</button></div>
      <div className="p-5 space-y-4 overflow-auto">
        <div className="grid grid-cols-2 gap-3">
          <L t="Nome"><input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Nome da pessoa" className={inp}/></L>
          <L t="E-mail (Google) *"><input value={email} onChange={e=>setEmail(e.target.value)} disabled={!!acesso} placeholder={"nome@"+DOMINIO_PERMITIDO} className={inp+(acesso?" bg-slate-50 text-slate-400":"")}/></L>
        </div>
        <div>
          <div className="text-sm font-semibold text-navy mb-1">Módulos e permissões</div>
          <p className="text-[11px] text-slate-400 mb-3">Para cada módulo: <b>Sem acesso</b> (não aparece), <b>Ver</b> (só consulta) ou <b>Editar</b> (consulta e altera).</p>
          <div className="space-y-1.5">
            {MODULOS.map(([id,label])=>{const atual=modulos[id]||"";
              return <div key={id} className="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2">
                <span className="text-sm text-navy">{label}</span>
                <div className="flex rounded-md border border-slate-300 overflow-hidden text-xs">
                  {[["","Sem acesso"],["ver","Ver"],["editar","Editar"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setMod(id,v)}
                      className={"px-2.5 py-1 "+(atual===v?(v===""?"bg-slate-500 text-white":v==="ver"?"bg-sky-500 text-white":"bg-brand text-white"):"text-slate-500 hover:bg-slate-50")+(v!==""?" border-l border-slate-300":"")}>{l}</button>))}
                </div>
              </div>;})}
          </div>
        </div>
      </div>
      <div className="p-4 border-t border-slate-200 flex justify-end gap-2">
        <button onClick={onClose} className="px-3 py-1.5 text-sm text-slate-500">Cancelar</button>
        <button onClick={()=>onSalvar({nome,email,modulos},acesso?.id)} className="bg-brand hover:bg-navy text-white text-sm font-medium px-5 py-2 rounded-md">Salvar</button>
      </div>
    </div>
  </div>;
}

function App(){
  const lsGet=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
  const [mode,setMode]=useState("demo");
  const [fb,setFb]=useState(null);
  useEffect(()=>{ window.__bskFB=fb; },[fb]); // acesso ao Firestore para componentes da ficha (histórico de avaliações)
  // ============================================================
  // FONTE DE VERDADE: Firestore. O navegador é apenas cache de exibição.
  // O estado nasce VAZIO — nunca com seeds, nunca com dados do localStorage.
  // Só um snapshot vindo do servidor preenche estas listas.
  // ============================================================
  const [pessoas,setPessoas]=useState([]);
  const [cargos,_setCargos]=useState([]);
  const [departamentos,_setDepartamentos]=useState([]);
  const [competencias,_setCompetencias]=useState([]);
  const [configs,setConfigs]=useState(()=>lsGet("bsk_configs",seedConfigs()));
  // marca que uma alteração veio de AÇÃO DO USUÁRIO (única origem autorizada a gravar)
  const mutacaoRef=React.useRef({});
  const fazSetter=(nome,setter)=>(arg)=>setter(prev=>{
    const novo=typeof arg==="function"?arg(prev):arg;
    mutacaoRef.current[nome]=novo;
    return novo;
  });
  const setCargos=fazSetter("cargos",_setCargos);
  const setDepartamentos=fazSetter("departamentos",_setDepartamentos);
  const setCompetencias=fazSetter("competencias",_setCompetencias);
  useEffect(()=>{if(mode==="firebase"){lsSet("bsk_firebase_ok",true);}},[mode]);
  // ============================================================
  // CAMADA DE DADOS — única que fala com o Firestore
  // Garantias: (1) só grava por ação do usuário; (2) recusa escrita baseada em
  // versão antiga (_rev + transação); (3) faz backup antes de sobrescrever;
  // (4) nenhuma falha é silenciosa; (5) o navegador nunca origina gravação.
  // ============================================================
  const COLECOES=["cargos","departamentos","competencias"];
  // Versão desta build. Toda gravação carrega este número, e as Regras do Firestore
  // recusam escritas de versões antigas — é o que impede um dispositivo com a página
  // em cache (versão velha) de sobrescrever dados bons.
  const APP_VERSAO=20260722;
  const [versaoObsoleta,setVersaoObsoleta]=useState(false);
  const revRef=React.useRef({});            // versão confirmada pelo servidor
  const somenteLeituraRef=React.useRef({}); // true quando exibindo cache offline
  const conectadoRef=React.useRef(false);
  const [statusSync,setStatusSync]=useState({});
  const [avisoSync,setAvisoSync]=useState(null);
  const [diagAberto,setDiagAberto]=useState(false);
  const logRef=React.useRef([]);
  const [logVersao,setLogVersao]=useState(0);
  const logar=(colecao,tipo,detalhe)=>{
    logRef.current=[{em:new Date().toISOString(),colecao,tipo,detalhe},...logRef.current].slice(0,120);
    setLogVersao(v=>v+1);
    console.info(`[dados] ${colecao} | ${tipo} | ${detalhe}`);
  };
  const setterCru={cargos:_setCargos,departamentos:_setDepartamentos,competencias:_setCompetencias};

  // Aplica no estado o que veio do SERVIDOR (nunca marca mutação → nunca grava de volta)
  const aplicarDoServidor=(nome,lista,rev,appVersao)=>{
    // Se a nuvem foi gravada por uma versão MAIS NOVA do sistema, esta aba está
    // desatualizada (página em cache) e não pode gravar nada.
    if(appVersao&&appVersao>APP_VERSAO){
      setVersaoObsoleta(true);
      logar(nome,"VERSAO-OBSOLETA",`nuvem gravada pela versão ${appVersao}; esta aba é a ${APP_VERSAO} — gravação bloqueada`);
    }
    revRef.current[nome]=rev;
    somenteLeituraRef.current[nome]=false;
    conectadoRef.current=true;
    setterCru[nome](lista);
    lsSet("bsk_"+nome,lista);   // cache de exibição, somente leitura
    setStatusSync(s=>({...s,[nome]:{origem:"servidor",qtd:lista.length,rev,em:new Date().toISOString()}}));
    // servidor voltou a responder → tira o aviso de offline/leitura desta coleção
    setAvisoSync(a=>(a&&a.nome===nome&&(a.tipo==="offline"||a.tipo==="listener"))?null:a);
    logar(nome,"leitura-servidor",`${lista.length} registro(s), rev ${rev}`);
  };
  // Exibe o cache local quando o servidor não respondeu — em modo SOMENTE LEITURA
  const exibirCacheLocal=(nome,motivo)=>{
    if(revRef.current[nome]!=null) return;
    const cache=lsGet("bsk_"+nome,[]);
    somenteLeituraRef.current[nome]=true;
    if(cache.length) setterCru[nome](cache);
    setStatusSync(s=>({...s,[nome]:{origem:"cache-local",qtd:cache.length,rev:null,em:new Date().toISOString()}}));
    logar(nome,"cache-local",`${cache.length} registro(s) — ${motivo} — GRAVAÇÃO BLOQUEADA`);
    setAvisoSync({nome,tipo:"offline",msg:motivo});
  };

  const salvarColecao=async(nome,lista)=>{
    if(mode!=="firebase"||!fb){ logar(nome,"gravacao-ignorada","modo demonstração"); return; }
    if(versaoObsoleta){
      logar(nome,"gravacao-bloqueada","esta aba está com uma versão antiga do sistema");
      setAvisoSync({nome,tipo:"obsoleta",msg:"esta aba carregou uma versão antiga do sistema"}); return;
    }
    if(somenteLeituraRef.current[nome]){
      logar(nome,"gravacao-bloqueada","exibindo cache local (sem servidor)");
      setAvisoSync({nome,tipo:"nao-salvo",msg:"sem conexão com a nuvem",lista}); return;
    }
    const base=revRef.current[nome];
    if(base==null){
      logar(nome,"gravacao-bloqueada","sem sincronização inicial com o servidor");
      setAvisoSync({nome,tipo:"nao-salvo",msg:"ainda não sincronizado com a nuvem",lista}); return;
    }
    try{
      await fb.db.runTransaction(async tx=>{
        const ref=fb.db.collection("config").doc(nome);
        const snap=await tx.get(ref);
        const atual=snap.exists?(Number(snap.data()._rev)||0):0;
        if(atual!==base){ const err=new Error("conflito"); err.conflito=true; err.atual=atual; throw err; }
        const anterior=(snap.exists&&Array.isArray(snap.data().lista))?snap.data().lista:[];
        if(anterior.length) tx.set(fb.db.collection("backups").doc(nome),
          {lista:semUndefined(anterior),em:new Date().toISOString(),rev:atual,qtd:anterior.length});
        tx.set(ref,{lista:semUndefined(lista),_rev:base+1,_appVersao:APP_VERSAO,
          _atualizadoEm:new Date().toISOString(),_por:(usuarioRef.current&&usuarioRef.current.email)||"?"});
      });
      revRef.current[nome]=base+1;
      lsSet("bsk_"+nome,lista);
      setStatusSync(s=>({...s,[nome]:{origem:"servidor",qtd:lista.length,rev:base+1,em:new Date().toISOString()}}));
      logar(nome,"gravado",`${lista.length} registro(s), rev ${base} -> ${base+1}`);
      setAvisoSync(a=>(a&&a.nome===nome)?null:a);
    }catch(e){
      if(e&&e.conflito){
        logar(nome,"RECUSADO",`servidor está na rev ${e.atual} e esta alteração partiu da rev ${base} — dado mais novo preservado`);
        setAvisoSync({nome,tipo:"conflito",msg:`a nuvem tem uma versão mais recente (rev ${e.atual})`});
      }else{
        logar(nome,"ERRO-GRAVACAO",String((e&&e.message)||e));
        setAvisoSync({nome,tipo:"nao-salvo",msg:String((e&&e.message)||e),lista});
      }
    }
  };
  // Único disparador de gravação: uma mutação feita pelo usuário
  useEffect(()=>{
    const pend=mutacaoRef.current;
    const nomes=Object.keys(pend);
    if(!nomes.length) return;
    nomes.forEach(nome=>{ const lista=pend[nome]; delete pend[nome]; salvarColecao(nome,lista); });
  });
  useEffect(()=>{
    lsSet("bsk_configs",configs);
    if(mode==="firebase"&&fb&&conectadoRef.current){
      try{fb.api.setDoc(fb.api.doc(fb.db,"config","configs"),semUndefined(configs));}catch(e){logar("configs","ERRO-GRAVACAO",String(e.message||e));}
    }
  },[configs,mode,fb]);
  const [eventos,setEventos]=useState([]);
  const [role,setRole]=useState("RH");
  const [busca,setBusca]=useState("");
  const [view,setView]=useState("atividades");
  const [pdiFoco,setPdiFoco]=useState(null), [avalFoco,setAvalFoco]=useState(null), [tplRev,setTplRev]=useState(0);
  const [promocoes,setPromocoes]=useState([]);
  const [orgRevisoes,setOrgRevisoes]=useState([]);
  const [iaKey,setIaKey]=useState("");
  const [iaModel,setIaModel]=useState("claude-sonnet-4-5");
  const [cfgOpen,setCfgOpen]=useState(false);
  const [toast,setToast]=useState(null);
  const notify=m=>{setToast(m);setTimeout(()=>setToast(null),2600);};
  const [erroPersistente,setErroPersistente]=useState(null); // {msg} — fica até o usuário fechar
  // guarda de navegação: telas podem registrar uma função que retorna true se pode sair (ou trata o "voltar")
  const navGuardRef=React.useRef(null); // ()=>{dirty:boolean, voltarParaLista:()=>void} | null
  const irPara=(destino)=>{
    // guarda de permissão: admin passa em tudo; demais só nos módulos liberados (e sempre em telas próprias)
    const livres=["acessos","perfil"];
    if(!ehAdmin&&!livres.includes(destino)&&!nivelDoAcesso(meuAcesso,destino)){notify&&notify("Você não tem acesso a este módulo.");return;}
    const g=navGuardRef.current&&navGuardRef.current();
    if(g){
      if(g.dirty){
        const r=window.confirm("Há alterações não salvas nesta tela. Deseja sair sem salvar?\n\nOK = sair sem salvar · Cancelar = continuar editando");
        if(!r) return;               // continua editando
      }
      g.voltarParaLista&&g.voltarParaLista(); // fecha o detalhe/edição aberto
    }
    setView(destino);
  };

  useEffect(()=>{setEventos(seedEventos(pessoas));},[]); // eventos coerentes com o seed

  // ---- único caminho de escrita (usado por todos os módulos) ----
  const commit=async(pessoa,events=[])=>{
    const p={...pessoa,_savedAt:Date.now()};
    setPessoas(prev=>{const i=prev.findIndex(x=>x.id===p.id);if(i<0)return[...prev,p];const c=[...prev];c[i]=p;return c;});
    if(events.length) setEventos(prev=>[...prev,...events]);
    if(mode==="firebase"&&fb){
      // marca que esta pessoa tem escrita pendente por 5s
      // onSnapshot vai ignorar atualizações remotas para ela neste período
      pendentesRef.current[p.id]=(Date.now()+5000);
      try{
        await fb.api.setDoc(fb.api.doc(fb.db,"pessoas",p.id),semUndefined(p));
        for(const e of events) await fb.api.addDoc(fb.api.collection(fb.db,"eventos"),semUndefined(e));
      }catch(err){
        const code=err?.code||"";
        const msg=code==="permission-denied"
          ? "PERMISSÃO NEGADA pelo Firestore ao salvar. As Regras de Segurança estão bloqueando a escrita. Revise as regras no Console do Firebase."
          : "Falha ao salvar no Firebase: "+String(err.message||err).slice(0,120);
        setErroPersistente({msg}); console.error("commit setDoc falhou:",err);
      }
    }
  };
  // ---- registro de eventos sem alterar pessoa (ex.: catálogo de cargos) ----
  const addEventos=async events=>{
    if(!events.length)return;
    if(mode==="firebase"&&fb){ try{ for(const e of events) await fb.api.addDoc(fb.api.collection(fb.db,"eventos"),semUndefined(e)); }catch(err){console.error(err);} }
    else setEventos(prev=>[...prev,...events]);
  };
  // ---- exclusão definitiva (local + Firestore) ----
  const excluirPessoaFB=async(p)=>{
    // remove do estado local imediatamente
    setPessoas(prev=>prev.filter(x=>x.id!==p.id));
    if(mode==="firebase"&&fb){
      // marca como excluída por 10s para o onSnapshot não reinserir durante a corrida
      excluidosRef.current[p.id]=(Date.now()+10000);
      delete pendentesRef.current[p.id];
      try{
        await fb.api.deleteDoc(fb.api.doc(fb.db,"pessoas",p.id));
        // varredura defensiva: apaga documentos "irmãos" (mesma pessoa gravada com outro id de doc)
        const cpf=(p.cpf||"").replace(/\D/g,"");
        const snap=await fb.db.collection("pessoas").get();
        for(const d of snap.docs){
          if(d.id===p.id) continue;
          const dd=d.data()||{};
          const mesmoCpf=cpf&&(dd.cpf||"").replace(/\D/g,"")===cpf;
          const mesmoNome=(dd.nome||"").toLowerCase().trim()===(p.nome||"").toLowerCase().trim();
          if(mesmoCpf||(!cpf&&mesmoNome)){
            excluidosRef.current[d.id]=(Date.now()+10000);
            try{ await fb.db.collection("pessoas").doc(d.id).delete(); }catch(e){console.error(e);}
          }
        }
      }catch(err){ notify("Erro ao excluir no Firebase: "+String(err.message||err).slice(0,60)); console.error(err); }
    }
  };

  const [usuario,setUsuario]=useState(null);
  const [meuAcesso,setMeuAcesso]=useState(null); // {admin, modulos:{id:"ver"|"editar"}} do usuário logado
  const [acessos,setAcessos]=useState([]);       // lista de todos os acessos (para a tela de admin)
  const [acessoCarregado,setAcessoCarregado]=useState(false); // já recebeu resposta do servidor?
  // carrega o acesso do usuário logado e (se admin) a lista completa
  useEffect(()=>{
    if(!fb||!usuario){setMeuAcesso(null);setAcessoCarregado(false);return;}
    const email=(usuario.email||"").toLowerCase();
    if(email===ADMIN_EMAIL){ setMeuAcesso({admin:true,nome:usuario.displayName||"Administrador",email,modulos:{}});setAcessoCarregado(true); }
    const un=fb.db.collection(ACESSO_COL).onSnapshot(s=>{
      const lista=s.docs.map(d=>({id:d.id,...d.data()}));
      setAcessos(lista);
      if(email!==ADMIN_EMAIL){
        const meu=lista.find(a=>(a.email||"").toLowerCase()===email);
        setMeuAcesso(meu?{...meu,admin:false}:{admin:false,email,nome:usuario.displayName||email,modulos:{}});
      }
      setAcessoCarregado(true);
    },e=>{console.error("[acessos]",e);setAcessoCarregado(true);});
    return ()=>un&&un();
  },[fb,usuario]);
  const ehAdmin=!!(meuAcesso&&meuAcesso.admin);
  // modelos de avaliação salvos pelo RH (versões) entram no registro do motor
  useEffect(()=>{ if(!fb||!acessoCarregado) return; if(!(ehAdmin||nivelDoAcesso(meuAcesso,"aval")||nivelDoAcesso(meuAcesso,"matriz"))) return;
    return fb.db.collection("aval_templates").onSnapshot(s=>{ AVAL.registrarTemplates(s.docs.map(d=>({id:d.id,...d.data()}))); setTplRev(v=>v+1); },e=>console.warn("[modelos]",e)); },[fb,acessoCarregado,ehAdmin]);
  // espelho `perfis/{email}` usado pelas regras do Firestore (Etapa 2 · Avaliação). Só o admin grava.
  useEffect(()=>{
    if(!fb||!ehAdmin||!acessoCarregado)return;
    (async()=>{ try{
      const snap=await fb.db.collection("perfis").get(); const atuais={}; snap.docs.forEach(d=>atuais[d.id]=d.data());
      const vistos=new Set();
      for(const a of acessos){ const em=String(a.email||"").toLowerCase().trim(); if(!em)continue; vistos.add(em);
        const dados={email:em,nome:a.nome||"",modulos:a.modulos||{}}; const at=atuais[em];
        if(!at||JSON.stringify({email:at.email,nome:at.nome,modulos:at.modulos||{}})!==JSON.stringify(dados)) await fb.db.collection("perfis").doc(em).set(dados); }
      for(const id of Object.keys(atuais)) if(!vistos.has(id)) await fb.db.collection("perfis").doc(id).delete();
    }catch(e){ console.warn("[perfis] sincronização",e); } })();
  },[fb,ehAdmin,acessoCarregado,acessos]);
  // se a view atual não é permitida para o usuário, leva ao primeiro módulo liberado
  useEffect(()=>{
    if(!meuAcesso||ehAdmin)return;
    if(view!=="acessos"&&!nivelDoAcesso(meuAcesso,view)){
      const primeiro=MODULOS.find(([id])=>nivelDoAcesso(meuAcesso,id));
      if(primeiro)setView(primeiro[0]);
    }
  },[meuAcesso,ehAdmin,view]);
  const [loginando,setLoginando]=useState(false);
  const pendentesRef=React.useRef({}); // {pessoaId: timestamp_expiracao}
  const excluidosRef=React.useRef({}); // {pessoaId: timestamp_expiracao} — evita reaparecer via onSnapshot
  const usuarioRef=React.useRef(null); // usuário logado, para registrar autoria das gravações
  const cargosRef=React.useRef(cargos);
  const deptosRef=React.useRef(departamentos);
  const compsRef=React.useRef(competencias);
  useEffect(()=>{cargosRef.current=cargos;},[cargos]);
  useEffect(()=>{deptosRef.current=departamentos;},[departamentos]);
  useEffect(()=>{compsRef.current=competencias;},[competencias]);
  useEffect(()=>{usuarioRef.current=usuario;},[usuario]);

  const conectarFirebase=async cfg=>{
    try{
      if(!window.firebase){
        const carregarScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
        await carregarScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await carregarScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
        await carregarScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
      }
      const app=window.firebase.apps.length?window.firebase.app():window.firebase.initializeApp(cfg);
      const auth=window.firebase.auth(app);
      const db=window.firebase.firestore(app);
      // 1) Ao voltar do Google (redirect), recupera o resultado ANTES de qualquer decisão.
      //    Sem isso, onAuthStateChanged podia disparar com null e reabrir a tela de login → loop.
      try{ await auth.getRedirectResult(); }catch(e){ console.warn("getRedirectResult:",e&&e.code); }
      // 2) Espera o Firebase resolver o estado de auth (com teto de tempo, para não travar).
      const u=await new Promise(res=>{
        let feito=false;
        const un=auth.onAuthStateChanged(user=>{ if(feito)return; feito=true; try{un();}catch(_){}res(user); });
        setTimeout(()=>{ if(!feito){feito=true; res(auth.currentUser||null);} },4000);
      });
      if(u){
        try{sessionStorage.removeItem("bsk_redir_login");}catch(_){}
        if(!(u.email||"").toLowerCase().endsWith("@"+DOMINIO_PERMITIDO)){await auth.signOut();notify("Acesso permitido apenas para e-mails @"+DOMINIO_PERMITIDO);setLoginando(false);return;}
        setUsuario(u);
      } else {
        // Se já tentamos redirecionar nesta sessão e voltamos SEM login, não redireciona de novo:
        // mostra o botão. Isso evita o ciclo redirect→volta→redirect em qualquer dispositivo.
        if(sessionStorage.getItem("bsk_redir_login")){
          try{sessionStorage.removeItem("bsk_redir_login");}catch(_){}
          setLoginando(false); return;
        }
        setLoginando(true);
        const provider=new window.firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({prompt:"select_account"});
        const ehMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||"");
        try{
          if(ehMobile){
            sessionStorage.setItem("bsk_redir_login","1");
            await auth.signInWithRedirect(provider); return; // a página recarrega e volta autenticada
          }
          const result=await auth.signInWithPopup(provider);
          const em=(result.user.email||"").toLowerCase();
          if(!em.endsWith("@"+DOMINIO_PERMITIDO)){await auth.signOut();notify("Acesso permitido apenas para e-mails @"+DOMINIO_PERMITIDO);setLoginando(false);return;}
          try{sessionStorage.removeItem("bsk_redir_login");}catch(_){}
          setUsuario(result.user);
        }catch(e){
          const msg=String((e&&e.code)||(e&&e.message)||e);
          // popup bloqueado/fechado → tenta uma única vez por redirecionamento (com trava)

            try{ sessionStorage.setItem("bsk_redir_login","1"); await auth.signInWithRedirect(provider); return; }catch(e2){}
          }
          setLoginando(false); notify("Login não concluído: "+msg.slice(0,70)); return;
        }
        setLoginando(false);
      }
      // Perfil só de Avaliações/PDI (gestor): as regras não permitem ler dados de RH (salários etc.),
      // então esses dados nem são carregados — evita avisos de erro de sincronização.
      let perfilRestrito=false;
      try{ const em=String((auth.currentUser&&auth.currentUser.email)||"").toLowerCase();
        if(em&&em!==ADMIN_EMAIL){ const pf=await db.collection("perfis").doc(em).get();
          const mods=pf.exists?Object.entries(pf.data().modulos||{}).filter(([,v])=>v).map(([k])=>k):[];
          perfilRestrito=mods.length>0&&mods.every(k=>k==="aval"||k==="pdi"||k==="matriz"); } }catch(e){ console.warn("[perfis] leitura do próprio perfil",e&&e.code); }
      const api={
        collection:(db,name)=>db.collection(name),
        onSnapshot:(ref,cb)=>ref.onSnapshot(snap=>cb({docs:snap.docs,empty:snap.empty})),
        addDoc:(ref,data)=>ref.add(data),

        const remotoIds=new Set(remoto.map(r=>r.id));
        setPessoas(prev=>{
          const prevMap=Object.fromEntries(prev.map(p=>[p.id,p]));
          const resultado={};
          // 1) parte do remoto (Firestore = fonte da verdade), respeitando janelas locais
          remoto.forEach(r=>{
            // ignora quem acabou de ser excluído localmente
            if((excluidosRef.current[r.id]||0)>agora) return;
            // se há escrita local pendente, mantém a versão local (mais nova)
            if((pendentesRef.current[r.id]||0)>agora && prevMap[r.id]){ resultado[r.id]=prevMap[r.id]; return; }
            resultado[r.id]=r;
          });
          // 2) preserva itens locais ainda não confirmados no servidor (recém-criados, escrita em voo)
          prev.forEach(p=>{
            if(resultado[p.id]) return;
            if((excluidosRef.current[p.id]||0)>agora) return;      // foi excluído: não ressuscita
            if(remotoIds.has(p.id)) return;                         // já tratado acima

            // caso contrário: sumiu do servidor (excluído em outra sessão) → remove
          });
          return Object.values(resultado);
        });
