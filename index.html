const FIREBASE_CFG={apiKey:"AIzaSyB0Y1wn5kWzGiWc"+"xDowbTIuztCERx6me2M",authDomain:"braskim---one.firebaseapp.com",projectId:"braskim---one",storageBucket:"braskim---one.firebasestorage.app",messagingSenderId:"1064753515954",appId:"1:1064753515954:web:b4d2a2fd48c3e8482da8ab"};

};
const IcoSair=()=><Svg size={18} sw={2}><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></Svg>;

// ---------- catálogo de apps ----------

  {id:"rh",nome:"Recursos Humanos",desc:"Colaboradores, férias, avaliações, PDI e reconhecimento.",href:"/rh",

const carregarScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
const iniciais=n=>String(n||"").trim().split(/\s+/).filter(Boolean).map(p=>p[0]).slice(0,2).join("").toUpperCase()||"?";
const saudacao=()=>{const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";};

// frase exibida no login (provisória; futuramente uma "frase do dia")

          <div className="text-[13px] font-semibold tracking-wider uppercase text-indigo-300">{dataLonga()}</div>
          <p className="mt-2 text-[19px] leading-normal text-slate-200">{FRASE_LOGIN}</p>

      <div className="w-full max-w-[400px] bg-white border border-slate-200 rounded-2xl p-10 shadow-[0_8px_24px_rgba(15,23,42,0.06)]">

        <button onClick={onEntrar} disabled={ocupado} className="w-full h-12 rounded-[11px] border border-slate-300 bg-white flex items-center justify-center gap-3 text-[15px] font-semibold hover:bg-slate-50 disabled:opacity-60">
          <Svg size={18} sw={2}><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8"/><path d="M12 21a9 9 0 1 1 6.2-15.5"/></Svg>
          {ocupado?"Entrando…":"Entrar com Google"}

        {erro&&<p className="mt-4 text-sm text-red-700">{erro}</p>}
      </div>
    </div>
  </div>;
}

function CardApp({app,disponivel}){
  const conteudo=<>
    <div className="flex items-center justify-between">
      <span className={"w-12 h-12 rounded-xl flex items-center justify-center "+(disponivel?"bg-brand/[0.08] text-brand ring-1 ring-inset ring-brand/20":"bg-slate-200 text-slate-500")}>{ICONES[app.id]}</span>
      <span className={"text-xs font-semibold px-2.5 py-1 rounded-full "+(disponivel?"bg-green-100 text-green-800":"bg-slate-200 text-slate-600")}>{disponivel?"Disponível":app.href?"Sem acesso":"Em breve"}</span>

  if(disponivel) return <a href={app.href} className={base+"bg-white border border-slate-200 shadow-sm hover:border-brand/40 hover:shadow-md transition"}>{conteudo}</a>;

// ---------- painel lateral (estilo Gmail): caixa de entrada, avisos, hoje na Braskim ----------
// As contagens ainda vêm zeradas: serão preenchidas quando Tarefas e Avisos forem conectados ao portal.
const C_NAVY="#0f172a", C_CLARO="#7b8ff0"; // cores do logo Braskim One
const IcoEnvelope=({s=22})=><svg aria-hidden="true" width={s} height={s} viewBox="0 0 24 24" fill="none" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke={C_NAVY}/><path d="M3.8 6.8l8.2 6.2 8.2-6.2" stroke={C_CLARO}/></svg>;
const IcoSino=({s=22})=><svg aria-hidden="true" width={s} height={s} viewBox="0 0 24 24" fill="none" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8" stroke={C_NAVY}/><path d="M10 20a2 2 0 0 0 4 0" stroke={C_CLARO}/></svg>;
const IcoAgenda=({s=22})=><svg aria-hidden="true" width={s} height={s} viewBox="0 0 24 24" fill="none" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke={C_NAVY}/><path d="M3.5 10h17M8 3v4M16 3v4" stroke={C_CLARO}/><path d="M8 14h2M14 14h2" stroke={C_NAVY}/></svg>;
const IcoExpandir=()=><Svg size={18} sw={2}><path d="M14 4h6v6"/><path d="M20 4l-7 7"/><path d="M10 20H4v-6"/><path d="M4 20l7-7"/></Svg>;
const IcoFechar=()=><Svg size={18} sw={2}><path d="M6 6l12 12M18 6L6 18"/></Svg>;
const IcoVoltar=()=><Svg size={18} sw={2}><path d="M15 18l-6-6 6-6"/></Svg>;

const PAINEIS={
  tarefas:{rotulo:"Caixa de entrada",Icone:IcoEnvelope,
    vazio:"Nenhuma tarefa pendente.",
    explica:"Quando o app Tarefas estiver no portal, tudo o que for atribuído a você em qualquer área chega aqui."},
  avisos:{rotulo:"Avisos",Icone:IcoSino,
    vazio:"Nenhum aviso no momento.",
    explica:"Aqui vão aparecer pendências dos apps (por exemplo, documentos vencendo no RH) e comunicados da empresa."},
  agenda:{rotulo:"Hoje na Braskim",Icone:IcoAgenda,
    vazio:"Nada programado para hoje.",
    explica:"Aniversariantes, tempo de casa, férias que começam e eventos do dia vão aparecer aqui."},
};
const Badge=({n})=>n>0?<span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10.5px] font-bold leading-[18px] text-center ring-2 ring-white">{n>99?"99+":n}</span>:null;

function ConteudoPainel({id}){
  const p=PAINEIS[id];
  return <div className="text-center py-10 px-4">
    <div className="mx-auto w-14 h-14 rounded-2xl bg-brand/[0.06] flex items-center justify-center"><p.Icone s={28}/></div>
    <p className="mt-4 text-[15px] font-semibold text-navy">{p.vazio}</p>
    <p className="mt-1.5 text-[13.5px] leading-relaxed text-slate-500 max-w-[300px] mx-auto">{p.explica}</p>

// coluna fina de ícones colada na borda direita da tela
function TrilhoDireito({aberto,onAbrir,contagens}){
  return <nav aria-label="Atalhos" className="hidden md:flex w-14 shrink-0 h-screen sticky top-0 flex-col items-center gap-2 pt-6 bg-white border-l border-slate-200">
    {Object.entries(PAINEIS).map(([id,p])=>
      <button key={id} onClick={()=>onAbrir(id)} title={p.rotulo} aria-label={p.rotulo+(contagens[id]?": "+contagens[id]:"")} aria-pressed={aberto===id}

        <p.Icone/><Badge n={contagens[id]}/>
      </button>)}
  </nav>;
}

// painel que abre ao lado do trilho, com opção de tela inteira
function PainelLateral({id,onFechar,onTelaInteira}){
  const p=PAINEIS[id];
  return <section aria-label={p.rotulo} className="hidden md:flex w-[360px] shrink-0 h-screen sticky top-0 flex-col bg-white border-l border-slate-200">
    <div className="flex items-center gap-2 px-5 h-16 border-b border-slate-100">
      <div className="flex-1 min-w-0">
        <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">{p.rotulo}</div>
        <div className="text-[14px] font-semibold text-brand capitalize truncate">{dataHoje()}</div>
      </div>
      <button onClick={onTelaInteira} title="Abrir em tela inteira" aria-label="Abrir em tela inteira" className="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100"><IcoExpandir/></button>
      <button onClick={onFechar} title="Fechar" aria-label="Fechar painel" className="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100"><IcoFechar/></button>
    </div>
    <div className="flex-1 overflow-y-auto"><ConteudoPainel id={id}/></div>
  </section>;
}

// tela inteira (#/tarefas, #/avisos, #/agenda)
function TelaInteira({id,onVoltar}){
  const p=PAINEIS[id];
  return <div>
    <button onClick={onVoltar} className="inline-flex items-center gap-1.5 h-9 pl-2 pr-3 -ml-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200/60"><IcoVoltar/>Início</button>
    <div className="mt-4 flex items-center gap-3"><p.Icone s={30}/><h1 className="text-[32px] font-bold tracking-tight">{p.rotulo}</h1></div>
    <div className="mt-6 bg-white border border-slate-200 rounded-[14px]"><ConteudoPainel id={id}/></div>
  </div>;
}

const lerHash=()=>{ const h=(location.hash||"").replace(/^#\/?/,""); return PAINEIS[h]||h==="roadmap"?h:""; };

// ---------- Roadmap: lista de ideias de melhoria do sistema (só a administradora) ----------
function Roadmap({db,usuario,onVoltar}){
  const [itens,setItens]=useState(null), [novo,setNovo]=useState(""), [aberto,setAberto]=useState(""), [editando,setEditando]=useState(""), [txt,setTxt]=useState(""), [obs,setObs]=useState(""), [erro,setErro]=useState("");
  useEffect(()=>{ if(!db) return; return db.collection("roadmap").onSnapshot(s=>setItens(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")))),
    e=>{ setItens([]); setErro("Não foi possível ler o roadmap ("+String(e.code||e.message||e).slice(0,60)+"). Confira a regra do Firestore para a coleção roadmap."); }); },[db]);
  const agora=()=>new Date().toISOString(), por=(usuario&&usuario.email)||"";
  const falha=e=>setErro("Não foi possível salvar ("+String(e.code||e.message||e).slice(0,60)+").");
  const adicionar=async()=>{ const t=novo.trim(); if(!t) return; setErro(""); try{ await db.collection("roadmap").add({titulo:t,obs:"",criadoEm:agora(),criadoPor:por}); setNovo(""); }catch(e){ falha(e); } };
  const salvarTitulo=async it=>{ const t=txt.trim(); setEditando(""); if(!t||t===it.titulo) return; try{ await db.collection("roadmap").doc(it.id).set({titulo:t,atualizadoEm:agora()},{merge:true}); }catch(e){ falha(e); } };
  const salvarObs=async it=>{ if(obs===(it.obs||"")) return; try{ await db.collection("roadmap").doc(it.id).set({obs,atualizadoEm:agora()},{merge:true}); }catch(e){ falha(e); } };
  const excluir=async it=>{ if(!window.confirm(`Excluir "${it.titulo}"?`)) return; try{ await db.collection("roadmap").doc(it.id).delete(); }catch(e){ falha(e); } };
  const abrir=it=>{ if(aberto===it.id){ setAberto(""); return; } setAberto(it.id); setObs(it.obs||""); };
  return <div>
    <button onClick={onVoltar} className="inline-flex items-center gap-1.5 h-9 pl-2 pr-3 -ml-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200/60"><IcoVoltar/>Início</button>
    <div className="mt-4 flex items-center gap-3"><span className="text-brand">{ICONES.roadmap}</span><h1 className="text-[32px] font-bold tracking-tight">Roadmap</h1></div>
    <p className="mt-1 text-[15px] text-slate-600">Ideias de melhoria para o Braskim One.</p>
    <form onSubmit={e=>{ e.preventDefault(); adicionar(); }} className="mt-6 flex gap-2">
      <label className="sr-only" htmlFor="rm-novo">Nova ação</label>
      <input id="rm-novo" value={novo} onChange={e=>setNovo(e.target.value)} placeholder="Nova ação ou ideia de melhoria…" className="flex-1 h-11 px-4 rounded-xl border border-slate-300 bg-white text-[15px] focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand"/>
      <button type="submit" disabled={!novo.trim()} className="h-11 px-5 rounded-xl bg-brand text-white font-semibold text-sm disabled:opacity-40 hover:bg-navy">Adicionar</button></form>
    {erro&&<p className="mt-3 text-sm text-red-700">{erro}</p>}
    <div className="mt-5 bg-white border border-slate-200 rounded-[14px] divide-y divide-slate-100">
      {itens===null&&<p className="p-6 text-sm text-slate-500">Carregando…</p>}
      {itens&&!itens.length&&!erro&&<p className="p-8 text-center text-sm text-slate-500">Nenhuma ação cadastrada ainda. Escreva a primeira acima.</p>}
      {(itens||[]).map((it,i)=><div key={it.id}>
        <div className="flex items-center gap-3 px-4 py-3">
          <span className="w-7 text-sm font-semibold text-slate-400 text-right shrink-0">{i+1}.</span>
          {editando===it.id
            ?<input autoFocus value={txt} onChange={e=>setTxt(e.target.value)} onBlur={()=>salvarTitulo(it)} onKeyDown={e=>{ if(e.key==="Enter") e.currentTarget.blur(); if(e.key==="Escape") setEditando(""); }} aria-label="Editar ação" className="flex-1 h-9 px-3 rounded-lg border border-brand text-[15px] focus:outline-none"/>
            :<button onClick={()=>{ setEditando(it.id); setTxt(it.titulo); }} title="Clique para editar" className="flex-1 text-left text-[15px] text-navy hover:text-brand">{it.titulo}</button>}
          <button onClick={()=>abrir(it)} aria-expanded={aberto===it.id} className={"shrink-0 h-8 px-3 rounded-lg text-xs font-semibold "+(it.obs?"bg-brand/10 text-brand":"text-slate-500 hover:bg-slate-100")}>{it.obs?"Observações ●":"+ Observações"}</button>
          <button onClick={()=>excluir(it)} aria-label={`Excluir ${it.titulo}`} title="Excluir" className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50"><Svg size={16} sw={2}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></Svg></button>
        </div>
        {aberto===it.id&&<div className="px-4 pb-4 pl-14">
          <label className="sr-only" htmlFor={"rm-obs-"+it.id}>Observações</label>
          <textarea id={"rm-obs-"+it.id} autoFocus rows={4} value={obs} onChange={e=>setObs(e.target.value)} onBlur={()=>salvarObs(it)} placeholder="Observações, contexto, detalhes da ideia…" className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand"/>
          <p className="mt-1 text-xs text-slate-400">Salva automaticamente ao sair do campo.{it.atualizadoEm?` Última alteração: ${new Date(it.atualizadoEm).toLocaleString("pt-BR")}.`:""}</p></div>}
      </div>)}
    </div>
  </div>;
}

function Inicio({usuario,ctx,onSair,db}){
  const nome=usuario.displayName||usuario.email;
  const primeiro=String(nome).split(/\s+/)[0];
  const [menu,setMenu]=useState(false);
  const [painel,setPainel]=useState("");          // painel lateral aberto
  const [tela,setTela]=useState(lerHash);          // tela inteira aberta
  useEffect(()=>{ const f=()=>setTela(lerHash()); window.addEventListener("hashchange",f); return ()=>window.removeEventListener("hashchange",f); },[]);
  const contagens={tarefas:0,avisos:0,agenda:0};
  const abrirTela=id=>{ setPainel(""); location.hash="/"+id; };
  const voltar=()=>{ history.pushState("",document.title,location.pathname+location.search); setTela(""); };
  const visiveis=APPS.filter(a=>!a.soAdmin||ctx.admin).map(a=>({app:a,disponivel:!!(a.href&&a.liberado&&a.liberado(ctx))}));
  return <div className="min-h-screen md:flex">
    <aside className="relative overflow-hidden bg-navy text-white md:w-[400px] xl:w-[460px] md:shrink-0 md:h-screen md:sticky md:top-0 flex flex-col p-5 md:p-12 gap-6">
      <img src="/braskim-simbolo-contorno.png" alt="" aria-hidden="true" className="hidden md:block absolute left-12 top-1/2 -translate-y-1/2 h-[400px] w-auto opacity-[0.08] pointer-events-none select-none"/>
      <div className="relative"><Logo grande/></div>
      <div className="relative my-auto hidden md:block">
        <h1 className="text-[44px] leading-[1.1] font-bold tracking-tight">Tudo da Braskim<br/>num só lugar.</h1>
        <div className="mt-8 pt-6 border-t border-slate-700 max-w-[460px]">
          <div className="text-[13px] font-semibold tracking-wider uppercase text-indigo-300">{dataLonga()}</div>
          <p className="mt-2 text-[19px] leading-normal text-slate-200">{FRASE_LOGIN}</p>
        </div>
      </div>
      <div className="relative">
        <button onClick={()=>setMenu(m=>!m)} aria-expanded={menu} className="flex items-center gap-2.5 p-2 -ml-2 rounded-lg hover:bg-white/5 text-left">
          {usuario.photoURL?<img src={usuario.photoURL} alt="" referrerPolicy="no-referrer" className="w-9 h-9 rounded-full"/>:<span className="w-9 h-9 rounded-full bg-slate-200 text-navy flex items-center justify-center font-bold text-[13px]">{iniciais(nome)}</span>}
          <span className="leading-tight min-w-0"><span className="block text-sm font-semibold truncate">{nome}</span><span className="block text-xs text-slate-400 truncate">{ctx.admin?"Administradora":usuario.email}</span></span>
        </button>
        {menu&&<div className="absolute left-0 bottom-full mb-2 w-52 bg-white text-navy rounded-xl shadow-lg border border-slate-200 py-1 z-10">
          <button onClick={onSair} className="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm hover:bg-slate-50"><IcoSair/>Sair</button>
        </div>}
      </div>
    </aside>
    <main className="flex-1 min-w-0 px-5 md:px-10 pt-9 md:pt-12 pb-12">
      <div className="max-w-[1100px]">
      {tela==="roadmap"?(ctx.admin?<Roadmap db={db} usuario={usuario} onVoltar={voltar}/>:<p className="text-slate-500">Sem acesso.</p>):tela?<TelaInteira id={tela} onVoltar={voltar}/>:<>
        <div className="mb-7 flex flex-wrap items-center justify-between gap-4">
          <div>
            <div className="text-[13px] text-slate-600 uppercase tracking-wider font-semibold md:hidden">{dataHoje()}</div>
            <h1 className="mt-1.5 md:mt-0 text-[32px] font-bold tracking-tight">{saudacao()}, {primeiro}</h1>
          </div>
          {/* no celular não há trilho lateral: os atalhos abrem direto em tela inteira */}
          <div className="flex md:hidden items-center gap-2">
            {Object.entries(PAINEIS).map(([id,p])=><button key={id} onClick={()=>abrirTela(id)} aria-label={p.rotulo} className="relative w-11 h-11 rounded-full bg-white border border-slate-200 flex items-center justify-center"><p.Icone/><Badge n={contagens[id]}/></button>)}
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
          {visiveis.map(v=><CardApp key={v.app.id} {...v}/>)}
        </div>
      </>}
      </div>
    </main>
    {painel&&!tela&&<PainelLateral id={painel} onFechar={()=>setPainel("")} onTelaInteira={()=>abrirTela(painel)}/>}
    <TrilhoDireito aberto={tela||painel} contagens={contagens} onAbrir={id=>{ if(tela){ abrirTela(id); return; } setPainel(p=>p===id?"":id); }}/>
  </div>;
}

function App(){
  const [fb,setFb]=useState(null);
  const [usuario,setUsuario]=useState(undefined); // undefined = verificando; null = fora
  const [ctx,setCtx]=useState({admin:false,modulos:{}});
  const [ocupado,setOcupado]=useState(false), [erro,setErro]=useState("");

  useEffect(()=>{(async()=>{
    try{
      await carregarScript(SDK+"firebase-app-compat.js");
      await carregarScript(SDK+"firebase-firestore-compat.js");
      await carregarScript(SDK+"firebase-auth-compat.js");
      // mesmo cuidado do RH: no celular o domínio de autenticação precisa ser o do próprio site
      const host=String(location.hostname||"");
      const cfg={...FIREBASE_CFG,...(/\.web\.app$|\.firebaseapp\.com$/.test(host)?{authDomain:host}:{})};
      const app=window.firebase.apps.length?window.firebase.app():window.firebase.initializeApp(cfg);
      const auth=window.firebase.auth(app), db=window.firebase.firestore(app);
      setFb({auth,db});
      try{ await auth.getRedirectResult(); }catch(e){ console.warn("getRedirectResult",e&&e.code); }
      auth.onAuthStateChanged(async u=>{
        if(!u){ setUsuario(null); return; }
        const em=String(u.email||"").toLowerCase();
        if(!em.endsWith("@"+DOMINIO_PERMITIDO)){ await auth.signOut(); setErro("Acesso permitido apenas para e-mails @"+DOMINIO_PERMITIDO+"."); setUsuario(null); return; }
        let c={admin:em===ADMIN_EMAIL,modulos:{}};
        if(!c.admin){ try{ const pf=await db.collection("perfis").doc(em).get(); if(pf.exists) c.modulos=pf.data().modulos||{}; }catch(e){ console.warn("[perfis]",e&&e.code); } }
        setCtx(c); setUsuario(u);
      });
    }catch(e){ console.error(e); setErro("Não foi possível carregar o login. Verifique a internet e recarregue a página."); setUsuario(null); }
  })();},[]);

  const entrar=async()=>{
    if(!fb) return; setErro(""); setOcupado(true);
    const provider=new window.firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
    try{
      if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||"")){ await fb.auth.signInWithRedirect(provider); return; }
      await fb.auth.signInWithPopup(provider);
    }catch(e){
      const msg=String((e&&e.code)||e);
      if(/popup-blocked|operation-not-supported/i.test(msg)){ try{ await fb.auth.signInWithRedirect(provider); return; }catch(_){} }
      if(!/popup-closed|cancelled-popup/i.test(msg)) setErro("Login não concluído: "+msg.slice(0,70));
    }
    setOcupado(false);
  };
  const sair=async()=>{ try{ await fb.auth.signOut(); }catch(e){} };

  if(usuario===undefined) return <div className="min-h-screen flex items-center justify-center text-slate-500 text-sm">Carregando…</div>;
  if(!usuario) return <Login onEntrar={entrar} ocupado={ocupado} erro={erro}/>;
  return <Inicio usuario={usuario} ctx={ctx} onSair={sair} db={fb&&fb.db}/>;
}

// Tablets que já usavam o RH na raiz (?tablet ou lembrados no aparelho) continuam indo direto para o RH.
const tabletRH=(()=>{ try{ return /[?&#]tablet\b/i.test(location.href)||localStorage.getItem("bsk_tablet")==="1"; }catch(e){ return /[?&#]tablet\b/i.test(location.href); } })();
if(tabletRH) location.replace("/rh"+location.search+location.hash);
else createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
